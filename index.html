exam:[
["В чём отличие сущностей и связей ER-модели от предметов ПрО и отношений между ними?",`<p>Предметы ПрО и отношения между ними существуют в реальном мире независимо от нашего сознания. <b>Сущность</b> — это <b>абстрактное представление</b> единичного объекта ПрО, построенное на основании некоторого <b>понятия</b>, существенного с точки зрения задач ПрО; это <b>знак</b> в знаковой системе, а не сам предмет. С точки зрения разных понятий можно построить <b>несколько абстракций-сущностей одного и того же объекта</b>.</p>
<p>Аналогично <b>связь</b> — единичный экземпляр отношения (в философско-логическом смысле) между <b>сущностями</b>, а не между самими предметами; множество связей строится на основании понятия об <b>n-ках предметов</b> и рассматривается как математическое отношение на множествах сущностей.</p>`],
["Какого типа отношение существует между предметами и их сущностями?",`<p>Отношение типа <b>1:M</b> — один предмет ПрО может быть представлен несколькими сущностями (абстракциями в контексте разных понятий), но каждая сущность представляет один и только один предмет. То есть отображение «сущность → предмет» является полным функциональным, а обратное — нефункциональным.</p>`],
["Как соотносится определение атрибута, данное Ченом, с определением этого же термина во второй главе настоящего пособия?",`<p>Во <b>второй главе</b> атрибут — это <b>именованный домен</b>, представляющий семантически значимые объекты (столбец отношения), т. е. форма данных.</p>
<p>У <b>Чена</b> атрибут — это <b>отображение</b>, ставящее в соответствие сущностям или связям одиночные значения или кортежи значений: ООО — множество сущностей или связей, ОЗО — множество значений (аналог домена) или их Декартово произведение. Это определение <b>шире</b>: оно не требует функциональности (отсюда многозначные атрибуты) и допускает отображения в Декартово произведение. Общее — оба определения связывают имя, домен (множество значений) и объект-носитель; у Чена акцент перенесён с формы хранения на закон соответствия, что ближе к понятию семантически значимого отображения из главы 2.</p>`],
["Чем отличается представление связей в БД ER-модели и реляционной модели?",`<p>В <b>ER-модели</b> для связывания сущностей используются <b>специальные уникальные (внутрисистемные) указатели</b>; связь — самостоятельный элемент данных, который может иметь собственные атрибуты и роли. Это присуще всем моделям данных, кроме реляционной.</p>
<p>В <b>реляционной модели</b> связи представляются <b>дублированием значений ключевых атрибутов</b> (первичный ключ одного отношения переносится как внешний ключ в другое), т. е. через значения данных, а не через указатели.</p>`],
["По каким правилам строится ER-диаграмма?",`<p>Схема БД — граф, вершины которого: множества сущностей (<b>прямоугольники</b>), множества связей (<b>ромбы</b>), множества значений (<b>овалы</b>); имена указываются внутри фигур. <b>Неориентированные рёбра</b> соответствуют ролям множеств сущностей во множестве связей и соединяют их; помечаются именами ролей по необходимости. <b>Ориентированные дуги</b> представляют атрибутные отображения: выходят из множества сущностей или связей и входят в одно или несколько множеств значений (дуга может разделяться на несколько концов); дуги <b>всегда</b> помечаются именами атрибутов. Ограничения целостности показываются пометками МаксКЧ на рёбрах ролей (буквы M, N, P означают ∞), двойным прямоугольником слабых сущностей, метками E или ID в ромбе и стрелкой на зависимое множество.</p>`],
["В каких различных формах может быть представлено в ER-модели некоторое явление ПрО?",`<p>В трёх формах (<b>проблема триализма</b>): как <b>атрибут</b> множества сущностей; как <b>множество связей</b>; как <b>множество сущностей</b>. Пример с браком: атрибут «Замужем/Женат?» у ЧЕЛОВЕКА; множество связей БРАК с ролями Муж и Жена; множество сущностей БРАК.</p>`],
["Как осуществлять выбор подходящей формы?",`<p>По требуемой информативности, в порядке возрастания функциональности форм:</p>
<ul><li>если достаточно знать, <b>состоит человек в браке или нет</b>, — можно взять <b>атрибут</b>;</li>
<li>если интересует, <b>с кем конкретно</b> заключён брак, — нужно <b>множество связей</b>; при этом характеристики явления можно описать атрибутами множества связей, не меняя формы;</li>
<li>если нужно представлять <b>связи этого явления с другими явлениями</b> (например, РОЖДЕНИЕ В БРАКЕ), — необходимо <b>множество сущностей</b>, поскольку в связи могут вступать только сущности.</li></ul>
<p>Но это не значит, что все явления следует трактовать как сущности: излишняя бинаризация скрадывает семантику, а избыточные формы дороже.</p>`],
["Приведите свои примеры рекурсивных связей, связей степени большей 2.",`<p><b>Рекурсивные:</b> УПРАВЛЕНИЕ (роли Начальник, Подчинённый) на множестве СЛУЖАЩИЙ; РОЖДЕНИЕ (роли Родитель, Ребёнок) на множестве ЧЕЛОВЕК; ПРЕДПОСЫЛКА между ДИСЦИПЛИНАМИ (роли Пререквизит, Курс).</p>
<p><b>Степени больше 2:</b> тернарное рекурсивное РОЖДЕНИЕ (Отец, Мать, Ребёнок) на ЧЕЛОВЕК; НАПРАВЛЕНИЕ НА АНАЛИЗ (ВРАЧ, АНАЛИЗ, ПАЦИЕНТ); ПОСТАНОВКА ДИАГНОЗА (ВРАЧ, ПАЦИЕНТ, ДИАГНОЗ); ПОСТАВКА (ПОСТАВЩИК, ДЕТАЛЬ, ПРОЕКТ); ЭКЗАМЕН (ПРЕПОДАВАТЕЛЬ, СТУДЕНТ, ПРЕДМЕТ).</p>`],
["Как вы думаете, почему на ER-диаграммах обычно не показывают атрибуты и множества значений?",`<p>Потому что, несмотря на наличие в нотации выразительных средств для всех структурных элементов, показ атрибутов и множеств значений <b>резко перегружает диаграмму</b> и снижает наглядность: у каждого множества сущностей и связей может быть много атрибутных дуг. Их выносят в традиционный <b>текстовый синтаксис</b> (как в параграфе 2.5), а на диаграмме оставляют главное — типы объектов ПрО и их взаимосвязи, где хорошо видна <b>информативность схемы</b> (пути между множествами сущностей).</p>`],
["Какие формы предложил Чен для представления БД в своей модели? Опишите их.",`<p><b>Графовая форма — ER-диаграмма</b>: граф с прямоугольниками (множества сущностей), ромбами (множества связей), овалами (множества значений), рёбрами-ролями и дугами-атрибутами. С точки зрения наглядности отражения семантики данных она не имеет себе равных.</p>
<p><b>Табличная (текстовая) форма</b>: множества сущностей и множества связей описываются текстом — имя и перечень атрибутов с множествами значений в функциональной форме (Фамилия: ПАЦИЕНТ → Строки; Номер койки: РАЗМЕЩЕНИЕ → ЦПЧ; Адрес: ПАЦИЕНТ → Строки × ЦПЧ). Связи представляются либо кортежами (в смысле математики, с учётом порядка), либо множествами пар «роль : сущность» (кортежами в смысле моделирования данных) — во втором случае порядок сущностей необязателен.</p>`],
["Что является данными, когда рассматривается метасхема?",`<p>Метасхема — это ER-диаграмма, предметной областью которой является <b>идеальный мир самой ER-модели</b>; по ней строится <b>репозиторий</b> CASE-инструмента. Поэтому <b>данными</b> в ней становятся <b>элементы конкретных ER-схем приложений</b>: конкретные множества сущностей, множества связей, множества значений, роли и атрибуты проектируемых схем. То есть то, что на обычном уровне является <b>типами</b> (схемой БД), на уровне метасхемы становится <b>знаками</b> (сущностями и связями репозитория).</p>`],
["В чём особенности синтаксиса ограничений целостности на значения атрибутов в ER-модели?",`<p>Задание традиционно и осуществляется в <b>текстовой нотации</b>; для атрибутных отображений используется <b>функциональная форма</b> — Рост(e), Пол(a). Для декларации используется язык <b>исчисления предикатов первого порядка</b> с переменными, пробегающими по множествам сущностей или связей и принимающими значениями соответственно сущности или связи. Если квантор явно не указан, предполагается <b>квантор всеобщности ∀</b>. Пример: ∀e ∈ ЧЕЛОВЕК (Рост(e) &gt; 50 AND Рост(e) &lt; 300). Область действия — как правило, одно множество сущностей или одно множество связей. Способы: указанием множества значений, сравнением с константой или значением атрибута, перечислением значений, более сложным логическим выражением.</p>`],
["Поясните особенности понятия «ключ» в ER-модели.",`<p><b>Ключ сущности</b> (опр. 3.2.6) — группа атрибутов, такая, что отношение между множеством сущностей и Декартовым произведением соответствующих множеств значений есть отношение типа <b>1:1</b> или <b>1:M</b> (последнее — для многозначных атрибутов); в обоих случаях требуется <b>функциональность отображения во множество сущностей</b>. Объявляется описателем <b>KEY</b>, в текстовой нотации подчёркивается.</p>
<p>Особенности: наличие ключа <b>не является обязательным</b> требованием (среди естественных атрибутов ключей может не оказаться); ключей у одного множества сущностей может быть <b>несколько</b>; кроме ключей сущностей есть <b>ключи связей</b>; возможна идентификация сущности <b>с участием её связи</b> с другой сущностью (ID-зависимость).</p>`],
["Почему в ER-модели неуместно использование первичных ключей?",`<p>Потому что у сущностей есть <b>уникальные внутрисистемные указатели</b>, с помощью которых происходит идентификация сущностей в БД и реализуются связи между ними. Из-за этого теряется <b>основное назначение первичных ключей</b> — идентификация объектов БД при их взаимодействии между собой. Поэтому особого смысла выделять среди многочисленных ключей сущности первичный нет, хотя иногда это понятие в ER-модель вводят.</p>`],
["Объясните и приведите примеры всех способов идентификации связей.",`<p><b>Определение 3.2.7 — три способа:</b></p>
<ol><li><b>Только по сущностям, в ней участвующим</b> (одной, нескольким или всем). Пример: ВРАЧ-ПАЦИЕНТ — нужны сущности обоих множеств; АНАЛИЗ ПАЦИЕНТА — достаточно сущности типа АНАЛИЗ (так как отображение АНАЛИЗ → ПАЦИЕНТ функционально). Для связей степени &gt; 2 возможно, что достаточно нескольких, но не всех сущностей.</li>
<li><b>По сущностям и значениям</b> одного или нескольких атрибутов множества связей. Пример: РАЗМЕЩЕНИЕ — сущность типа ПАЛАТА + значение атрибута Номер койки; БРАК в БД ЗАГС (тип M:N) — одна сущность ЧЕЛОВЕК (в любой роли) + Дата регистрации брака.</li>
<li><b>Только по значениям</b> одного или нескольких атрибутов множества связей. Пример: БРАК — по значению атрибута Серия и номер свидетельства (или по комбинации атрибутов Серия свидетельства и Номер свидетельства).</li></ol>`],
["Что представляют собой E-зависимость и ID-зависимость?",`<p><b>E-зависимость (зависимость существования, опр. 3.2.8)</b> — явное представление ограничения по существованию: отображение из одного множества сущностей в другое полностью определено. Зависимое множество называется <b>множеством слабых сущностей</b>, ассоциированное с ним множество связей — <b>множеством слабых связей</b>. Пример: АНАЛИЗ → ПАЦИЕНТ, ПАЛАТА → БОЛЬНИЦА, ДИАГНОЗ → ПАЦИЕНТ.</p>
<p><b>ID-зависимость (зависимость по идентификации, опр. 3.2.9)</b> — частный случай зависимости существования: сущности зависимого множества не просто обязаны иметь связи с сущностями другого множества, но и <b>не могут быть идентифицированы без них</b>. Это ещё один способ уникальной идентификации сущностей. Пример: ПАЛАТА ID-зависима от БОЛЬНИЦЫ в контексте БОЛЬНИЧНОЙ ПАЛАТЫ — ключей среди атрибутов ПАЛАТЫ нет, но сущность идентифицируется комбинацией сущности БОЛЬНИЦА и значения Номер палаты.</p>
<p><b>ID-зависимость одновременно является зависимостью существования; обратное не обязательно.</b> На диаграмме: слабые сущности — прямоугольник двойными линиями, метка <b>E</b> (или <b>ID</b>) в ромбе, стрелка на зависимое множество.</p>`],
["Чем отличаются множество слабых сущностей и множество регулярных сущностей?",`<p><b>Множество слабых сущностей</b> — это ООО полностью определённого отображения в контексте некоторого множества связей: его сущности <b>не могут существовать</b> без связи с сущностями другого множества (ограничение по существованию). <b>Множество регулярных сущностей</b> — множество, не обладающее такой зависимостью.</p>
<p>Важно: слабость/регулярность определяется <b>в контексте конкретного множества связей</b>. Одно и то же множество сущностей может быть слабым в одном контексте и регулярным в другом: ПАЛАТА слабая в контексте БОЛЬНИЧНОЙ ПАЛАТЫ, но регулярная в контексте ПЕРСОНАЛА ПАЛАТЫ. Множества слабых связей могут быть любого вида (бинарные и n-арные, 1:1, 1:M, M:N); при M:N удаление регулярной сущности не обязательно влечёт удаление слабых, так как они могут быть связаны с другими регулярными сущностями.</p>`],
["Поясните, как расставлять пометки на рёбрах ролей ER-диаграммы в случае множества связей степени больше 2-х.",`<p>Пометка указывает <b>МаксКЧ</b> отображения (буквы M, N, P означают ∞). В бинарном случае одной пометки на конце ребра достаточно. Для связей степени больше двух одной пометки мало: для <b>тернарного</b> случая достаточно по <b>две пометки на разных концах рёбер</b>, чтобы охарактеризовать МаксКЧ всех отображений.</p>
<p>Для степени больше 3 рекомендуется делать по <b>две пометки на каждом ребре</b>: одна (возле множества связей) — для отображения, <b>определяемого ролью</b>; другая (ближе к множеству сущностей) — для отображения, <b>определяющего роль</b>. Если ограничиваются одной пометкой, обычно указывают МаксКЧ отображения, <b>определяющего роль</b> (именно так поступают в бинарном случае).</p>
<p>Пример (роль Врач в НАПРАВЛЕНИИ НА АНАЛИЗ): отображение АНАЛИЗ × ПАЦИЕНТ → ВРАЧ функционально, поэтому рядом с множеством ВРАЧ ставим «1»; обратное ВРАЧ → АНАЛИЗ × ПАЦИЕНТ нефункционально, поэтому рядом с множеством связей ставим «M».</p>`],
["Укажите особенности навигационного манипулирования данными в ER-модели.",`<p>Основные элементы данных — <b>сущности и связи</b>, организованные в множества; значения самостоятельной ценности не имеют и используются только в контексте сущностей и связей. Поэтому в языке достаточно предусмотреть <b>указатели текущих сущностей и связей</b>, пробегающие по соответствующим множествам, с возможностью неоднократного одновременного определения для <b>параллельных независимых сканирований</b>.</p>
<p>Набор из 15 операций: 1–6 — создание, изменение и удаление сущностей и связей (все элементы графа знаков: вершины и дуги), причём при создании связи указываются сущности для всех ролей; 7–14 — селекция сущности или связи <b>всеми видами селекции</b> с обязательным включением селекции по указателю текущей (по текущей; по текущей и данным; по текущей и связям; по текущей, данным и связям); 15 — выборка значений атрибутов для текущей сущности или связи. Селекция по связям позволяет переходить от сущности к связи, в которой она участвует, и обратно.</p>`],
["Какие формы может принимать подграф запроса на языке CABLE?",`<p><b>Линейный маршрут</b> — цепочка точек (бусинок) от исходного множества к целевому: чередующиеся множества сущностей и множества связей. Частный случай — <b>одна вершина</b>, когда исходное и целевое множества совпадают.</p>
<p><b>Дерево</b> — в запросе несколько ветвей: <b>листья</b> задают исходные множества, <b>корень</b> — целевое множество. В вершинах слияния двух и более путей выполняются <b>теоретико-множественные операции</b> — объединение, пересечение или разность подмножеств, полученных при прохождении по каждому маршруту.</p>`],
["В каких случаях можно явно задавать в запросе теоретико-множественные операции?",`<p>Когда граф запроса является <b>деревом</b>, т. е. когда в некоторой вершине <b>сливаются два и более маршрута</b>. Именно в такой точке слияния и указывается, какая операция применяется к подмножествам, полученным по каждой ветви: <b>объединение, пересечение или разность</b>. Пример: пациенты, которые одновременно лежат в больнице Святой Елены (ветвь через ПАЛАТУ) и делали анализы в лаборатории «Друг желудка» (ветвь через АНАЛИЗ) — в вершине ПАЦИЕНТ выполняется пересечение.</p>`],
["Поясните критерии качества семантических моделей.",`<ol><li><b>Модель должна обладать достаточной общностью и ясностью</b> для того, чтобы в ней можно было легко представить любые явления и законы моделируемого мира (выразительная мощность, близость к человеческому восприятию).</li>
<li><b>Разрыв между этой моделью и моделями, реализуемыми в СУБД, не должен быть большим</b>; желательно, чтобы можно было воспользоваться максимально формальными правилами преобразования структур и ограничений целостности из одной модели в другую (транслируемость, поддержка CASE).</li></ol>
<p>Развитие ER-модели (Чен → EER → Баркер → IDEF1X) шло по пути <b>резкой потери качества по первому критерию</b> и всё лучшего удовлетворения <b>второго</b>: концепции IDEF1X практически не отличаются от моделей реляционных СУБД, и такую модель можно назвать семантической уже с большой натяжкой.</p>`],
["Нарисуйте общую схему модификаций ER-модели Чена. Какие концепции добавлялись или удалялись на каждом из этапов этих модификаций?",`<p><b>Схема модификаций:</b></p>
<p><b>ER-модель Чена</b><br>&nbsp;&nbsp;<b>+</b> специализации и категоризации<br>= <b>Enhanced ER-модель (EER-модель)</b></p>
<p><b>EER-модель</b><br>&nbsp;&nbsp;<b>−</b> множества связей степени больше 2<br>&nbsp;&nbsp;<b>−</b> атрибуты множеств связей<br>&nbsp;&nbsp;<b>−</b> многозначные атрибуты<br>&nbsp;&nbsp;<b>−</b> атрибутные отображения в Декартово произведение множеств значений<br>= <b>ER-модель Баркера</b> (Oracle Designer)</p>
<p><b>ER-модель Баркера</b><br>&nbsp;&nbsp;<b>−</b> бинарные множества связей типа M:N<br>&nbsp;&nbsp;<b>−</b> представление связей с помощью внутрисистемных указателей (необходимо дублировать атрибуты множеств сущностей)<br>= <b>ER-модель IDEF1X</b> (ERwin)</p>
<p>За исходную основу взяты структурные понятия ER-модели Чена. Лишь <b>EER-модель привнесла новые выразительные возможности</b>, не нарушив полноту и простоту восприятия концепций Чена. Каждая последующая модификация <b>нещадно отбрасывала</b> те или иные концепции, ухудшая способности модели по выражению семантики ПрО: развитие шло по пути резкой потери качества по первому критерию семантической модели и всё лучшего удовлетворения второго. Дело дошло до того, что основные концепции IDEF1X практически ничем не отличаются от моделей данных реляционных СУБД.</p>`],
["Чем чревато использование невыразительных семантических моделей?",`<p>Бедный язык описания семантики ПрО уже на начальной фазе формализации <b>вынуждает человека принимать «чисто технические» решения</b> (вводить вспомогательные множества сущностей вместо связей степени &gt; 2, разворачивать многозначные атрибуты, вручную сводить M:N и т. д.). Совмещение двух принципиально разных мыслительных процессов — выяснения семантики ПрО и определения схемы БД на абстрактном языке СУБД — это ещё полбеды. Хуже то, что принятые технические решения <b>должны быть по-хорошему проанализированы заново</b> в реляционной схеме, иначе можно получить <b>не самую эффективную схему БД</b>. Кроме того, часть семантики теряется <b>невосполнимо</b> (как при бинаризации и сведении сложных отображений к простым).</p>`],
["В каких случаях используются специализации и категоризации?",`<p>Когда между множествами сущностей нужно задать отношения типа <b>«подкласс-суперкласс»</b>. Цели: исключить дублирование определения общих атрибутов и типов связей нескольких «родственных» типов сущностей (они выносятся на уровень суперкласса и <b>наследуются</b> подклассами); восстановить в БД <b>единство объекта ПрО</b>, который иначе рассматривался бы как несвязанные абстракции-сущности; постепенно увеличивать сложность схемы (специализация) или работать с большими схемами на разных уровнях абстракции (генерализация).</p>
<p><b>Специализация</b> применяется, когда подклассы выделяются из одного суперкласса по отличительным характеристикам (нисходящий подход); возможно множественное наследование. <b>Категоризация</b> применяется, когда подкласс должен объединять <b>несколько разных суперклассов</b>, а каждая сущность категории соответствует лишь одной сущности одного из них (выборочное наследование).</p>`],
["Какие ограничения целостности касаются специализаций и категоризаций?",`<p><b>Ограничение непересечения (disjoint constraint, опр. 3.2.13):</b> если подклассы специализации не пересекаются, каждый объект может быть представлен сущностью только одного подкласса; если пересекаются — один объект может быть представлен сущностями сразу нескольких подклассов.</p>
<p><b>Ограничение участия (participation constraint, опр. 3.2.14):</b> при <b>полном</b> участии каждый объект, представленный сущностью суперкласса, должен быть представлен сущностью хотя бы одного подкласса; при <b>частичном</b> — не обязательно.</p>
<p>Свойства независимы, поэтому возможны 4 комбинации: полные пересекающиеся; частичные пересекающиеся; полные непересекающиеся; частичные непересекающиеся.</p>
<p><b>Для категоризации</b> также различают полное и частичное участие: при полном каждый объект всех суперклассов должен быть представлен сущностью данной категории, при частичном — не обязательно. Кроме того, каждый объект, представленный сущностью категории, должен иметь сущность <b>одного и только одного</b> суперкласса категоризации.</p>`],
["Опишите графическую нотацию, применяемую для представления специализаций и категоризаций на EER-диаграммах.",`<p>Специализация/категоризация изображается как связь суперкласса с подклассами через специальный узел (кружок), от которого идут дуги к подклассам; дуги помечаются знаком <b>⊂</b> (подмножество), указывающим направление наследования от суперкласса к подклассу. Вид ограничения непересечения показывается символом в кружке: <b>d</b> (disjoint) — непересекающиеся подклассы, <b>o</b> (overlapping) — пересекающиеся. Ограничение участия показывается линией, соединяющей суперкласс с кружком: <b>двойная линия</b> — полное участие, <b>одинарная</b> — частичное. Для <b>категоризации</b> кружок помечается символом <b>u</b> (union): к нему подходят дуги от <b>нескольких суперклассов</b>, а от него — одна дуга к категории.</p>`],
["Докажите, что понятия «специализация» и «категоризация» не тождественны.",`<ol><li><b>Число суперклассов.</b> В специализации подклассы порождаются <b>одним</b> суперклассом; в категоризации категория порождается <b>несколькими разными</b> суперклассами.</li>
<li><b>Характер наследования.</b> В специализации подкласс наследует атрибуты и типы связей своего суперкласса (при множественном наследовании — <b>от всех</b> суперклассов); категория обладает <b>выборочным наследованием</b>: каждая её сущность наследует атрибуты и связи <b>только одного</b> суперкласса.</li>
<li><b>Обязательность сущности суперкласса.</b> В специализации каждый объект подкласса обязан иметь сущность суперкласса специализации; в категоризации — сущность <b>одного и только одного</b> из суперклассов.</li>
<li><b>Метасхема EER-модели.</b> Кардинальные числа различаются: множество сущностей может неоднократно участвовать в разных <b>специализациях</b> (и как суперкласс, и как подкласс), а <b>категорией</b> (подклассом категоризации) оно может быть лишь <b>однажды</b>.</li></ol>
<p>Следовательно, понятия не тождественны, и множественное наследование в специализациях нельзя отождествлять с категоризацией.</p>`],
["Какие изменения произошли в метасхеме EER-модели по сравнению с метасхемой ER-модели?",`<p>В метасхеме EER-модели появились новые множества сущностей <b>СПЕЦИАЛИЗАЦИЯ</b> и <b>КАТЕГОРИЗАЦИЯ</b>, а также соответствующие множества связей <b>СУПЕРКЛАСС</b> и <b>ПОДКЛАСС</b> между ними и множеством сущностей МНОЖЕСТВО СУЩНОСТЕЙ. Отличаются кардинальные числа вновь образовавшихся отображений: конкретное множество сущностей может <b>неоднократно</b> использоваться в разных специализациях (и в роли суперкласса, и в роли подкласса), а категорией оно может быть <b>лишь однажды</b>. В остальном между метасхемами полное сходство, что подтверждает: концепции ER-модели Чена остались в EER-модели незыблемыми.</p>`],
["Каких структурных понятий мы лишаемся при переходе от EER-модели к ER-модели Баркера?",`<ul><li>множества связей степени больше двух;</li>
<li>атрибуты множеств связей;</li>
<li>многозначные атрибуты;</li>
<li>атрибутные отображения в Декартово произведение множеств значений;</li>
<li>категоризации (в нотации Баркера их нет), а из специализаций допустимы только <b>полные и непересекающиеся</b>.</li></ul>`],
["Какими структурными понятиями ER-модели Баркера мы вынуждены их заменять?",`<ul>
<li><b>Множество связей степени n</b> → вспомогательное <b>множество сущностей</b> и <b>n бинарных множеств связей</b>. Одно из отображений каждого такого множества связей (для которого новое множество сущностей является ООО) будет <b>полным функциональным</b>; типы обратных им отображений совпадают с типами отображений, определяемых ролями исходного множества связей.</li>
<li><b>Атрибуты множества связей</b> → универсальное решение: замена множества связей <b>множеством сущностей</b> и бинарными множествами связей, однозначные атрибуты становятся атрибутами нового множества сущностей. Другое решение — добавить атрибуты множества связей в то множество сущностей, роль которого определяет функциональное отображение (идеально, если оно к тому же полно).</li>
<li><b>Многозначный атрибут</b> → самостоятельное <b>множество сущностей</b> с атрибутом для значений и бинарное множество связей типа <b>M:1</b> с множеством-владельцем; если владельцем было множество связей, его придётся превратить во множество сущностей.</li>
<li><b>Атрибутные отображения в Декартово произведение</b> → элементарные атрибуты, атрибуты-агрегаты или и то, и другое одновременно.</li></ul>`],
["Опишите графическую нотацию Баркера.",`<p><b>Множества сущностей</b> — прямоугольники с закруглёнными углами; внутри имя множества и имена атрибутов с некоторыми ОЦ. Символы слева от имён атрибутов: <b>#</b> — атрибут участвует в уникальной идентификации сущностей; <b>*</b> — обязательный атрибут (NOT NULL); <b>○</b> — необязательный (NULL).</p>
<p><b>Бинарные множества связей</b> — ребро с двумя концами, каждый соответствует одной роли (имена ролей — пометки на концах). Примитивы концов:</p>
<ul><li><b>пунктирная линия</b>, выходящая из множества сущностей — в контексте этой связи сущности регулярны (МинКЧ = 0);</li>
<li><b>сплошная линия</b> — сущности слабые (МинКЧ = 1);</li>
<li><b>одиночный конец</b> у множества сущностей — оно является ОЗО функционального отображения (МаксКЧ = 1);</li>
<li><b>вилочкообразный («воронья лапка») конец</b> — ОЗО нефункционального отображения (МаксКЧ = ∞);</li>
<li><b>«|»</b> (поперечный штрих) — ID-зависимость;</li>
<li><b>«◊»</b> (ромбик) — указанный конец связи <b>неперемещаемый</b>.</li></ul>
<p><b>Специализации</b>: только полные и непересекающиеся; изображаются как вложенные в прямоугольник суперкласса прямоугольники подклассов; каждое множество сущностей может лишь однажды выступить как в роли суперкласса, так и в роли подкласса (хотя может совмещать обе роли).</p>
<p><b>Неудобство:</b> информация о количественных характеристиках <b>одного</b> отображения разбросана по разным концам ребра (МинКЧ — у одного множества сущностей, МаксКЧ — у другого).</p>`],
["Укажите правила трансформации схемы БД из ER-модели Баркера в реляционную модель.",`<ul>
<li>каждое <b>множество сущностей порождает отношение</b>;</li>
<li><b>атрибуты множества сущностей переносятся</b> в отношение;</li>
<li>если у множества сущностей <b>не было ключей</b> среди естественных атрибутов, система генерирует для его отношения <b>суррогатный ключ</b> (имя = комбинация имени отношения и суффикса «_ID»);</li>
<li>множества связей типа <b>1:1 и 1:M</b> реализуются <b>дублированием ключей</b> и объявлением <b>внешних ключей</b>;</li>
<li>множества связей типа <b>M:N</b> порождают <b>дополнительное отношение</b> и <b>пару внешних ключей</b> в нём.</li></ul>
<p>Эти правила автоматически применяет преобразователь схемы Oracle Designer, сохраняя результат в репозитории; затем генератор БД передаёт схему СУБД на языке SQL.</p>`],
["Охарактеризуйте ER-модель в нотации IDEF1X.",`<p>Нотация IDEF1X (Design/IDEF, ERwin) — <b>самая бедная</b> модификация ER-модели. К изъятиям нотации Баркера (нет связей степени &gt; 2, атрибутов связей, многозначных атрибутов, отображений в Декартово произведение) добавлены требования:</p>
<ul><li>бинарные множества связей типа <b>M:N</b> необходимо сводить <b>вручную</b> к дополнительному множеству сущностей и паре множеств связей типа 1:M;</li>
<li>необходимо <b>дублировать первичные ключи</b> множеств сущностей (формируя внешние ключи) для представления связей типа 1:M, то есть проектировщик <b>отказывается от внутрисистемных указателей</b> и явно оперирует первичными и внешними ключами; он сам должен заботиться о создании суррогатных ключей, безошибочном дублировании атрибутов и принятии решений о реализации зависимостей существования и идентификации.</li></ul>
<p>Указанные требования фактически <b>превращают ER-модель в реляционную</b>: назвать её семантической можно уже с большой натяжкой. Достоинство — простота реализации CASE-средства и минимальный разрыв с моделью СУБД (второй критерий качества), недостаток — крайне бедный язык описания семантики ПрО (первый критерий).</p>`]
]},

{
id:"m41", num:"4.1", title:"Обзор СУБД-ориентированных моделей", icon:"🗂️", tag:"Глава 4",
theory:[
{h:"Откуда взялся этот класс моделей",html:`
<p>Название класса объясняется тем, что, в отличие от семантических моделей (ориентированных на <b>человека</b>), эти модели предназначены для <b>реального создания БД во внешней памяти</b> компьютеров, поскольку реализованы в виде программных продуктов — СУБД. Каждый разработчик по-своему интерпретировал концепции, поэтому в системах реализованы свои <b>диалекты</b>; СУБД-ориентированные модели — это своеобразное <b>обобщение моделей данных конкретных СУБД</b>.</p>
<p>Сначала появлялись экспериментальные, затем коммерческие системы с новыми концепциями, а потом сообщество исследователей стандартизовало схожие подходы. Так появились <b>иерархическая, сетевая, объектно-ориентированная и объектно-реляционная</b> модели.</p>
<div class="key"><b>Реляционную модель ждала другая судьба:</b> она родилась в голове американского математика <b>Эдгара Кодда</b> (Edgar Frank Codd, 1969), увидевшего в математическом понятии «отношение» перспективную форму данных. Вслед за ним в моделирование данных пришли теория множеств, теория отношений, логика высказываний, логика предикатов первого порядка. Моделирование данных из технической инженерной дисциплины <b>превратилось в приложение математики</b>.</div>
<p><b>Дореляционные системы</b> (иерархические и сетевые СУБД) первоначально <b>не основывались на абстрактных моделях</b>: доступ производился на уровне записей, пользователи осуществляли <b>явную навигацию</b> с помощью языков программирования, расширенных функциями СУБД; интерактивный доступ поддерживался только созданием прикладных программ. Понятие модели данных вошло в обиход только вместе с <b>реляционным подходом</b>; абстрактные представления ранних систем появились позже на основе анализа общих признаков.</p>
<p><b>Поколения СУБД:</b> 1-е — иерархические и сетевые; 2-е — реляционные; 3-е — объектно-ориентированные (ООСУБД) и объектно-реляционные (ОРСУБД).</p>`},
{h:"Иерархическая модель данных",html:`
<p>Схема БД состоит из нескольких <b>типов записей</b>, один из которых определён как <b>корневой (входной)</b>. Каждый тип записей состоит из элементарных типов полей, некоторые могут быть <b>ключами</b>, однозначно идентифицирующими запись.</p>
<ul>
<li>Между типами записей определяются типы связей <b>«один ко многим»</b> (иногда «один к одному»): элемент «один» — <b>исходный (родительский)</b> тип, элемент «много» — <b>порождённый (дочерний)</b>.</li>
<li>Тип записей может быть <b>порождённым только в одном типе связей</b> (для каждого типа записей существует только один исходный тип).</li>
<li>Каждый тип записей может быть <b>исходным во многих</b> типах связей; корневой тип может быть только исходным.</li>
<li>Обычно между двумя типами записей может быть только один тип связей.</li>
<li>Иерархическая БД состоит из <b>упорядоченного набора нескольких экземпляров одного типа дерева</b>.</li>
<li>Автоматически поддерживается <b>целостность ссылок</b> между предками и потомками. Основное правило: <b>никакой потомок не может существовать без своего родителя</b>.</li>
</ul>
<p>Поскольку каждая дочерняя запись может иметь связь не более чем с одной родительской, приходится прибегать к <b>дублированию типов записей и их экземпляров</b> (в медицинской ПрО дублируются ПАЦИЕНТ и ЛАБОРАТОРИЯ).</p>
<p><b>Типичные операторы:</b> найти указанное дерево БД; перейти от одного дерева к другому; перейти от одной записи к другой по иерархии; перейти к другой записи того же типа в порядке обхода иерархии; вставить новую запись в указанную позицию; удалить текущую запись.</p>
<p><b>Типичный представитель:</b> <b>IMS</b> (Information Management System) фирмы <b>IBM</b>, первая версия — <b>1968 г.</b></p>`},
{h:"Сетевая модель данных",html:`
<p>Сетевой подход — <b>расширение иерархического</b>: потомок может иметь <b>любое число предков</b>, но в контексте <b>разных типов связей</b> (в пределах одного типа связей по-прежнему обязательно функциональное отображение между дочерними и родительскими записями).</p>
<p>Любая запись может быть одновременно и родительской, и дочерней и участвовать в любом числе взаимосвязей. Сетевая БД состоит из набора экземпляров типов записей и набора экземпляров типов связей.</p>
<p><b>Для типа связей L с типом записей предка P и потомка C выполняются два условия:</b></p>
<ul><li>каждый экземпляр типа P является предком не более чем в одном экземпляре L;</li>
<li>каждый экземпляр типа C является потомком не более чем в одном экземпляре L.</li></ul>
<p><b>Особых ограничений на формирование типов связей нет:</b> тип записей потомка в L₁ может быть типом записей предка в L₂ (как в иерархии); данный тип P может быть предком в любом числе типов связей; он же может быть потомком в любом числе типов связей; может существовать любое число типов связей с одними и теми же типами предка и потомка (правила родства в них могут различаться); типы записей X и Y могут быть предком и потомком в одном типе связей и потомком и предком — в другом; предок и потомок могут быть одного типа записей.</p>
<p>Связи (как и в иерархической модели) реализуются с помощью <b>указателей</b>. Сетевую БД можно представить как <b>граф</b>: записи — узлы, связи — рёбра.</p>
<p><b>Операции:</b> найти конкретную запись в наборе однотипных; перейти от предка к первому потомку по связи; перейти к следующему потомку; перейти от потомка к предку; создать / уничтожить / модифицировать запись; включить запись в набор связей предка; исключить из набора; перевести запись из набора связей одного предка в набор другого.</p>
<p><b>Типичный представитель:</b> <b>IDMS</b> (Integrated Database Management System) компании Cullinet Software. Архитектура основана на предложениях <b>DBTG</b> (Data Base Task Group) комитета <b>CODASYL</b>, ответственного за язык Кобол; отчёт DBTG опубликован в <b>1971 г.</b></p>`},
{h:"Реляционная модель (обзор)",html:`
<p>Реляционные СУБД — <b>доминирующий тип</b> ПО для технологии БД. Годовой объём продаж — 15–20 млрд долларов (или 50 млрд вместе с инструментами разработки), ежегодный прирост — 25%. Это <b>второе поколение</b> СУБД, основанное на реляционной модели, предложенной <b>Эдгаром Ф. Коддом в 1969 году</b>.</p>
<p>Все данные логически структурированы внутри <b>отношений (таблиц)</b>; каждое отношение имеет имя и состоит из именованных <b>атрибутов (столбцов)</b>; каждый <b>кортеж (строка)</b> содержит по одному значению каждого атрибута.</p>
<div class="key">Большое преимущество — <b>простота логической структуры</b>, за которой скрывается серьёзный теоретический фундамент, которого не было у первого поколения СУБД (сетевых и иерархических).</div>`},
{h:"Объектно-ориентированная модель (ООБД)",html:`
<p>Базовая концепция объектно-ориентированной технологии: всё ПО должно всегда, когда возможно, создаваться на основе <b>стандартных и повторно используемых компонентов</b>.</p>
<p>Традиционно создание ПО и управление БД были разными дисциплинами: технология БД была сконцентрирована на <b>статических</b> концепциях хранения, а технология создания ПО моделировала <b>динамические</b> аспекты. С появлением третьего поколения (ООСУБД и ОРСУБД) дисциплины слились, что позволило <b>параллельно моделировать данные и процессы их обработки</b>.</p>
<p>Разработка ООБД началась в <b>середине 80-х годов</b> — из-за потребностей приложений, отличных от обработки данных: САПР, автоматизированное производство, технология программирования, системы, основанные на знаниях, мультимедийные системы. Сейчас на рынке свыше <b>25 систем ООБД</b>: GemStone (Servio), ONTOS (Ontos), ObjectStore (Object Design). Многие появились ещё во второй половине 80-х и <b>до сих пор не вступили в пору зрелости</b>.</p>
<p><b>Базовые понятия парадигмы ООБД:</b> объект, идентифицируемость, класс, наследование, перегрузка, отложенное связывание.</p>
<ul>
<li>Любая сущность реального мира представляется одним понятием — <b>объектом</b>; с ним ассоциируются <b>состояние</b> (значения свойств-атрибутов) и <b>поведение</b> (методы).</li>
<li>Значениями свойств могут быть примитивные значения и <b>непримитивные объекты</b> — объекты определяются <b>рекурсивно</b>.</li>
<li>У каждого объекта есть определяемый системой <b>уникальный идентификатор</b>.</li>
<li>Объекты с одинаковыми свойствами и поведением группируются в <b>классы</b>; объект может быть экземпляром <b>только одного</b> класса.</li>
<li>Классы организуются в <b>иерархии</b>; подкласс наследует свойства и методы суперкласса и может иметь свои. <b>Множественное наследование</b> (ORION) — несколько суперклассов; <b>одиночное</b> — один.</li>
<li><b>Перегрузка</b> — замена домена свойств новым доменом или замена одной реализации метода другой.</li>
</ul>
<p><b>Достоинства ООБД:</b> более непосредственное представление сложных объектов; пользователи могут определять абстракции; облегчается проектирование некоторых связей; устраняется потребность в определяемых пользователями ключах; поддерживается новый набор предикатов сравнения; в ряде случаев устраняется потребность в соединениях; иногда выше производительность; поддержка версий и длительных транзакций; разработана объектная алгебра.</p>
<p><b>Недостатки ООБД:</b> отсутствие интероперабельности между РБД и ООБД; минимальная оптимизация запросов; отсутствие стандартной алгебры запросов; отсутствие средств обеспечения запросов; отсутствие поддержки представлений; проблемы с безопасностью; отсутствие поддержки динамических изменений определений классов; ограниченная поддержка декларативных ОЦ; ограниченные возможности настройки производительности; недостаточная поддержка сложных объектов; ограниченная интеграция с существующими ОО-системами программирования; ограниченный выигрыш в производительности.</p>`},
{h:"Объектно-реляционная модель (ОРСУБД)",html:`
<p>Основное противоречие между объектным и реляционным мирами связано с <b>декомпозиционной природой</b> хранения информации в нормализованной реляционной схеме.</p>
<p><b>Аналогия сторонников объектов:</b> «Ставя машину в гараж, вы паркуете её как объект, который уже собран и готов к повторному использованию. Вы же не разбираете машину на части, маркируя каждую и расставляя их на полках только для того, чтобы вновь собрать их на следующее утро». <b>Встречный вопрос:</b> «Будете ли вы хранить свою одежду комплектно, сшив предметы вместе, или же поставите обувь в одно место, носки в другое, а галстуки повесите в третье?»</p>
<p>Наряду с <b>революционным</b> подходом (всё или ничего) ООБД существует <b>эволюционный</b> — объектно-реляционная модель: не отвергая каноны реляционной модели, она предлагает <b>объектные расширения</b> как средство преобразования реляционного представления в объектно-ориентированное; это важный механизм построения <b>двусторонних мостов</b>. По этому принципу развивают продукты Oracle, IBM, Microsoft, Borland, Informix.</p>
<p><b>Преимущества ОРСУБД:</b></p>
<ul><li><b>повторное и совместное использование компонентов</b> — сервер дополняется стандартными функциями, выполняемыми централизованно и не входящими в состав каждого приложения (например, пространственный тип данных с функциями расстояния между точками и т. д.); повышается производительность труда разработчиков и конечных пользователей;</li>
<li>возможность воспользоваться <b>обширным объёмом накопленных знаний и опыта</b> реляционных приложений: организации не хотят тратить средства на дорогостоящий переход к системе принципиально нового типа; переход происходит <b>эволюционным путём</b>, можно начать с пробных проектов. Стандарт <b>SQL3</b> (с объектными расширениями) разработан с учётом обратной совместимости с <b>SQL2</b>.</li></ul>
<p><b>Недостатки ОРСУБД:</b> <b>сложность</b> и связанные с ней дополнительные расходы; утрата простоты и ясности реляционной модели; расширения предназначены для незначительного количества приложений; искажение объектной терминологии (вместо объектной модели — определяемые пользователем типы данных); <b>большой семантический разрыв</b> между двумя технологиями; невозможность выразить средствами SQL весь набор связей и правил поведения объектов реального мира.</p>
<p><b>Требования к языку БД</b> — максимальная простота использования и относительно простая структура и синтаксис команд. Исходный стандарт SQL (<b>1989</b>) им, по-видимому, удовлетворял; версия <b>1992</b> года выросла со <b>120 примерно до 600 страниц</b>; объём <b>SQL3</b> стал ещё более впечатляющим — похоже, эти требования организациями по стандартизации даже не рассматриваются.</p>`},
{h:"Война манифестов",html:`
<p>Реляционную технологию критикуют со дня рождения: сначала — что это «всего лишь теория» и коммерческую систему на реляционных принципах построить «совершенно невозможно»; затем — что продукты слишком медленны для OLTP; теперь — что она не соответствует новым требованиям приложений (неструктурированные данные: изображение, звук, свободный текст; сложные операции — сканирование изображений, сжатие звука).</p>
<table><tr><th>Манифест</th><th>Год</th><th>Авторы / позиция</th></tr>
<tr><td><b>Манифест объектно-ориентированных систем баз данных</b> (The Object-Oriented Database System Manifesto)</td><td>1989</td><td>Люди с опытом ОО-систем. Перечислял правила, которым должна подчиняться система, чтобы называться ООСУБД; призван внести порядок в запутанный мир ООСУБД. Авторы полагали, что будущим БД нужны не реляционные, а ОО-основы.</td></tr>
<tr><td><b>Манифест систем баз данных третьего поколения</b> (Third-Generation Database System Manifesto)</td><td>1990</td><td>Реакция на первый; авторы с реляционной предысторией, в т. ч. <b>Майкл Стоунбрейкер</b> (Ingres) и <b>Джеймс Грей</b> (DEC). Новая модель не нужна — достаточно расширить реляционную модель объектными понятиями. Определяли набор характеристик для всех будущих СУБД.</td></tr>
<tr><td><b>Третий Манифест</b> (The Third Manifesto)</td><td>—</td><td><b>Хью Дарвен и Крис Дейт</b>. Попытка дать формальное и полное определение <b>новой версии реляционной модели</b>, называемой <b>D</b>; она совместима с классической моделью Кодда, но за счёт более точного определения некоторых понятий (особенно <b>доменов</b>) соответствует новым требованиям приложений.</td></tr></table>
<div class="tip">Первые два манифеста <b>не пытались</b> определить новую модель или язык — они просто перечисляли <b>требования</b> (минимальные характеристики) к СУБД. Третий Манифест — иная точка зрения: он определяет модель.</div>
<p><b>Заключение главы:</b> СУБД-ориентированные модели первого поколения практически вышли из употребления, а модели нового поколения находятся в стадии становления и с практической точки зрения не достигли достаточного уровня зрелости. Поэтому детально рассматривается лишь <b>реляционная модель</b>.</p>`}
],

exam:[
["Какие поколения СУБД традиционно выделяют в технологии БД? Какие модели данных относятся к каждому из этих поколений СУБД?",`<ul>
<li><b>Первое поколение</b> — дореляционные системы: <b>иерархическая</b> и <b>сетевая</b> модели данных (IMS фирмы IBM, IDMS компании Cullinet). Первоначально они не основывались на абстрактных моделях: доступ производился на уровне записей, пользователи осуществляли явную навигацию; абстрактные представления появились позже на основе анализа общих признаков.</li>
<li><b>Второе поколение</b> — <b>реляционная</b> модель данных, предложенная Э. Ф. Коддом в 1969 году (реляционные СУБД).</li>
<li><b>Третье поколение</b> — <b>объектно-ориентированная</b> модель (ООСУБД) и <b>объектно-реляционная</b> модель (ОРСУБД).</li></ul>
<p>Понятие модели данных фактически вошло в обиход специалистов только вместе с реляционным подходом.</p>`],
["Охарактеризуйте каждую из СУБД-ориентированных моделей данных. Укажите их достоинства и недостатки.",`<p><b>Иерархическая.</b> Схема — несколько типов записей, один корневой (входной); связи «один ко многим»: элемент «один» — исходный (родительский) тип, «много» — порождённый (дочерний). Тип записей может быть порождённым только в одном типе связей; корневой — только исходный. БД — упорядоченный набор экземпляров одного типа дерева. <i>Достоинства:</i> простота, автоматическая поддержка целостности ссылок (никакой потомок не существует без родителя), эффективность на древовидных ПрО. <i>Недостатки:</i> у записи только один родитель, поэтому приходится дублировать типы записей и их экземпляры; навигационный доступ на уровне записей; отсутствие теоретического фундамента.</p>
<p><b>Сетевая.</b> Расширение иерархической: потомок может иметь любое число предков, но в контексте разных типов связей; любая запись может быть и родительской, и дочерней. БД — граф (записи — узлы, связи — рёбра), связи реализуются указателями. <i>Достоинства:</i> более адекватное представление связей M:N, отсутствие лишнего дублирования. <i>Недостатки:</i> сложность схемы и навигации, доступ на уровне записей, жёсткая привязка к указателям.</p>
<p><b>Реляционная.</b> Все данные логически структурированы внутри отношений (таблиц); отношение имеет имя и состоит из именованных атрибутов; каждый кортеж содержит по одному значению каждого атрибута. <i>Достоинства:</i> простота логической структуры, мощный теоретический фундамент (теория множеств, теория отношений, логика предикатов), спецификационные языки, доминирование на рынке. <i>Недостатки (по критике):</i> декомпозиция объектов, трудности с неструктурированными данными (изображение, звук, свободный текст) и сложными приложениями.</p>
<p><b>Объектно-ориентированная.</b> Любая сущность представляется объектом с состоянием (атрибуты) и поведением (методы); уникальный системный идентификатор; классы и иерархии классов с наследованием; перегрузка; отложенное связывание. <i>Достоинства:</i> непосредственное представление сложных объектов, пользовательские абстракции, отсутствие потребности в пользовательских ключах и иногда в соединениях, новый набор предикатов сравнения, поддержка версий и длительных транзакций, объектная алгебра. <i>Недостатки:</i> отсутствие интероперабельности с РБД, минимальная оптимизация запросов, нет стандартной алгебры запросов и средств обеспечения запросов, нет представлений, проблемы с безопасностью, нет динамического изменения определений классов, ограниченная поддержка декларативных ОЦ и настройки производительности, ограниченный выигрыш в производительности.</p>
<p><b>Объектно-реляционная.</b> Эволюционный подход: объектные расширения над реляционной моделью как мост между ОО-приложениями и реляционными БД. <i>Достоинства:</i> повторное и совместное использование компонентов (стандартные функции на сервере), использование накопленного опыта реляционных приложений, постепенный переход, обратная совместимость SQL3 с SQL2. <i>Недостатки:</i> сложность и дополнительные расходы, утрата простоты и ясности реляционной модели, искажение объектной терминологии, большой семантический разрыв между технологиями, невозможность выразить в SQL весь набор связей и правил поведения объектов.</p>`],
["Попытайтесь опровергнуть позицию автора, который отдаёт на сегодняшний момент пальму первенства в классе СУБД-ориентированных моделей данных реляционной модели.",`<p><b>Позиция автора:</b> модели первого поколения практически вышли из употребления, модели нового поколения находятся в стадии становления и не достигли зрелости, поэтому практически полезной остаётся реляционная модель.</p>
<p><b>Контраргументы:</b></p>
<ul>
<li><b>Ограниченность первой нормальной формы.</b> Реляционная модель требует атомарности значений, поэтому сложные объекты (САПР, мультимедиа, геоинформационные системы, системы, основанные на знаниях) приходится <b>декомпозировать</b> и каждый раз собирать заново — это неестественно и дорого (аналогия с разбираемой на ночь машиной).</li>
<li><b>Семантическая бедность.</b> Реляционная модель знает лишь домены, возможные и внешние ключи; поведение объектов (методы) в ней не представимо, а декларативные ОЦ не покрывают всех закономерностей ПрО — приходится писать триггеры.</li>
<li><b>Несоответствие новым типам данных.</b> Неструктурированные данные (изображение, звук, свободный текст) и сложные операции над ними (сканирование изображений, сжатие звука) плохо укладываются в реляционную парадигму.</li>
<li><b>Разрыв с ОО-языками программирования.</b> Приложения давно пишутся в объектном стиле, и постоянное преобразование объектов в кортежи и обратно — накладные расходы, которых нет в ООБД.</li>
<li><b>Практика вендоров.</b> Oracle, IBM, Microsoft, Borland, Informix развивают именно <b>объектно-реляционные</b> продукты, а стандарт SQL3 включает объектные расширения — значит, чистая реляционная модель уже признана недостаточной самим рынком.</li>
<li><b>Нарушение свойств на практике.</b> Многие РСУБД допускают кортежи-дубликаты (мультимножества), не поддерживают домены, требуют суррогатных ключей — то есть «чистой» реляционной модели в коммерческих системах и так нет.</li></ul>
<p><b>Ответ в защиту автора (для полноты):</b> ООБД за два десятилетия не вступили в пору зрелости, не имеют стандартной алгебры запросов, оптимизации, представлений и средств безопасности, а ОРСУБД сохраняют реляционное ядро. Поэтому на сегодняшний момент реляционная модель остаётся единственной, у которой есть и строгая теория, и зрелые инструменты, и накопленный опыт проектирования.</p>`]
]},

{
id:"m42", num:"4.2", title:"Реляционная модель: структуры, ОЦ, операции", icon:"📊", tag:"Глава 4",
theory:[
{h:"4.2.1 Основные структурные понятия",html:`
<p><b>Основные структурные понятия реляционной модели:</b> тип данных, домен, атрибут, кортеж, отношение.</p>
<ul>
<li><b>Тип данных</b> полностью аналогичен понятию типа данных в языках программирования. Обычно допускаются символьные, числовые данные, битовые строки, специализированные числовые данные («деньги»), темпоральные данные (дата, время, интервал). Развивается расширение абстрактными типами данных (Ingres/Postgres).</li>
<li><b>Домен</b> — множество допустимых значений; более специфичен для БД (аналогия — подтипы в языках программирования). В общем виде задаётся базовым типом данных и произвольным логическим выражением: если оно истинно для элемента типа, элемент принадлежит домену. Интуитивно — <b>допустимое потенциальное множество значений данного типа</b>. Семантическая нагрузка: <b>данные сравнимы, только если относятся к одному домену</b> («Номера палат» и «Регистрационные номера пациентов» — оба целые, но несравнимы). В большинстве РСУБД понятие домена <b>не используется</b>.</li>
</ul>
<div class="def"><b>Определение 4.2.1.1. Схема отношения</b> — именованное множество пар «имя атрибута, имя домена» (или типа, если домен не поддерживается). <b>Степень («арность»)</b> схемы отношения — мощность этого множества.</div>
<div class="def"><b>Определение 4.2.1.2. Схема БД (в структурном смысле)</b> — набор именованных схем отношений.</div>
<div class="def"><b>Определение 4.2.1.3. Кортеж</b>, соответствующий данной схеме отношения, — множество пар «имя атрибута, значение», которое содержит одно вхождение каждого имени атрибута, принадлежащего схеме отношения. Значение — допустимое значение домена данного атрибута. Попросту говоря, кортеж — набор именованных значений заданных типов.</div>
<div class="def"><b>Определение 4.2.1.4. Отношение</b> — множество кортежей, соответствующих одной схеме отношения. Говорят «отношение-схема» и «отношение-экземпляр», или <b>заголовок</b> и <b>тело</b> отношения.</div>
<div class="def"><b>Определение 4.2.1.5. Реляционная база данных</b> — набор отношений, имена которых совпадают с именами схем отношений в схеме БД.</div>
<div class="tip">Схема отношения ближе всего к <b>структурному типу данных</b> в языках программирования; было бы логично определять схему отдельно, а потом отношения с этой схемой, но в реляционных БД это не принято: имя схемы всегда совпадает с именем отношения-экземпляра.</div>`},
{h:"Отношение по Кодду и свойства отношений",html:`
<div class="def"><b>Определение 4.2.1.6 (Кодд).</b> Для заданных множеств S<sub>1</sub>, S<sub>2</sub>, …, S<sub>n</sub> (не обязательно различных) <b>R является отношением</b> на этих n множествах, если представляет собой множество кортежей степени n, у каждого из которых первый элемент взят из S<sub>1</sub>, второй — из S<sub>2</sub> и т. д. S<sub>j</sub> называют <b>j-м доменом R</b>. Отношение R имеет <b>степень n</b>. Отношения степени 1 — <b>унарные</b>, 2 — <b>бинарные</b>, 3 — <b>тернарные</b>, 4 — <b>кватернарные</b>, n — <b>n-арные</b>.</div>
<p><b>Свойства «математического» n-арного отношения:</b> порядок кортежей не существен; все кортежи различны; <b>порядок значений атрибутов в кортежах существен</b> — он соответствует порядку доменов.</p>
<p>Позже «математический» взгляд заменили представлением отношения в смысле <b>определения Дейта (2.2.15)</b>. В результате отношения реляционной модели обладают свойствами:</p>
<ol>
<li><b>Отсутствие кортежей-дубликатов</b> — следует из определения отношения как множества. Отсюда наличие у каждого отношения <b>первичного ключа</b> (в крайнем случае — полный набор атрибутов); требуется <b>минимальность</b>. Во многих практических РСУБД это свойство нарушается: такие отношения являются <b>мультимножествами</b>.</li>
<li><b>Отсутствие упорядоченности кортежей</b> — даёт дополнительную гибкость СУБД при хранении и выполнении запросов. Результат SELECT с сортировкой — вообще говоря, не отношение, а упорядоченный список кортежей.</li>
<li><b>Отсутствие упорядоченности атрибутов</b> — схема есть множество пар «имя атрибута, имя домена»; для ссылки всегда используется имя атрибута. Теоретически позволяет удалять атрибуты, но в большинстве систем это не допускается.</li>
<li><b>Атомарность значений атрибутов</b> — среди значений домена не может быть множеств и агрегатов. Принято говорить, что допускаются только <b>нормализованные отношения</b>, или отношения в <b>первой нормальной форме</b>.</li>
</ol>`},
{h:"Простейшие правила перехода от ER-схемы к реляционной схеме",html:`
<ol>
<li><b>Каждое множество сущностей</b> представляется самостоятельным отношением; однозначные атрибуты становятся атрибутами отношения; ключи множества сущностей являются возможными ключами отношения; при необходимости в качестве первичного ключа используется <b>суррогатный</b> атрибут.</li>
<li><b>Бинарные множества связей типа 1:1 или 1:M без атрибутов</b> представляются <b>дублированием первичного ключа 1-отношения в M-отношение</b>. (1-отношение — построенное для множества сущностей, возле которого стояла пометка «1»; для 1:1 выбор M-отношения произволен.)</li>
<li><b>Бинарные множества связей типа M:N без атрибутов</b> представляются самостоятельными отношениями, куда дублируются первичные ключи отношений, построенных для множеств сущностей.</li>
<li><b>Множества связей с атрибутами</b> представляются самостоятельными отношениями, куда дублируются первичные ключи; однозначные атрибуты множества связей становятся атрибутами этого отношения.</li>
<li><b>Множества связей степени больше 2</b> представляются самостоятельными отношениями, куда дублируются первичные ключи отношений множеств сущностей; однозначные атрибуты связей становятся атрибутами отношения. (Отличие от правила 3 — число ключевых атрибутов равно степени связи.)</li>
<li><b>Каждый многозначный атрибут множества сущностей</b> представляется отдельным отношением, куда дублируется первичный ключ отношения множества сущностей; второй атрибут — собственно значение.</li>
<li><b>Каждый многозначный атрибут множества связей</b> представляется отдельным отношением, куда дублируется первичный ключ отношения множества связей; второй атрибут — собственно значение.</li>
</ol>
<p>Примеры из медицинской ПрО: правило 2 добавило Код больницы в ПАЛАТА и ВРАЧ, Регистрационный номер — в ДИАГНОЗ и АНАЛИЗ, Код лаборатории — в АНАЛИЗ, Код больницы + Номер палаты — в ПЕРСОНАЛ. Правило 3 породило БОЛЬНИЦА-ЛАБОРАТОРИЯ и ВРАЧ-ПАЦИЕНТ. Правило 4 — РАЗМЕЩЕНИЕ (с атрибутом Номер койки). Правило 6 — ТЕЛЕФОН БОЛЬНИЦЫ и ТЕЛЕФОН ЛАБОРАТОРИИ.</p>
<div class="tip">Эффективность результирующей схемы существенно зависит от <b>выразительной мощности семантической модели</b> и <b>полноты набора правил</b> трансформации.</div>`},
{h:"Представления (views)",html:`
<div class="def"><b>Определение 4.2.1.7. Базовое отношение</b> — отношение, кортежи которого <b>физически хранятся</b> в базе данных.</div>
<div class="def"><b>Определение 4.2.1.8. Представление</b> (англ. view) — динамический результат одной или нескольких реляционных операций над базовыми отношениями с целью создания некоторого иного отношения. Представление является <b>виртуальным отношением</b>, которое реально в БД не существует, но создаётся по требованию пользователя в момент обращения к нему.</div>
<p>С точки зрения пользователя представление — постоянно существующее отношение, с которым работают как с базовым; представление можно определять и на основе других представлений. Любые операции над представлением автоматически транслируются в операции над отношениями, на основании которых оно создано. Представления имеют <b>динамический характер</b>: изменения в базовых отношениях немедленно отражаются на содержимом представления.</p>`},
{h:"4.2.2 ОЦ: NULL и два правила целостности",html:`
<p>Поскольку каждый атрибут связан с доменом, для множества допустимых значений определяются <b>ограничения домена</b>. Помимо этого задаются <b>два важных правила целостности</b> — <b>целостность сущностей</b> и <b>ссылочная целостность</b>.</p>
<div class="def"><b>Определение 4.2.2.1. Неопределённое значение (NULL)</b> указывает, что значение атрибута в настоящий момент <b>неизвестно или неприемлемо</b> для этого кортежа. NULL — способ обработки неполных или необычных данных.</div>
<p>NULL не принадлежит никакому типу данных и может присутствовать среди значений любого атрибута (если явно не запрещено). По определению:</p>
<p><code>a op NULL = NULL</code>; <code>NULL op a = NULL</code>; <code>a lop NULL = unknown</code>; <code>NULL lop a = unknown</code>, где op — двуместная операция, lop — операция сравнения.</p>
<p><b>unknown</b> — третье значение булевского типа: <code>NOT unknown = unknown</code>; <code>true AND unknown = unknown</code>; <code>true OR unknown = true</code>; <code>false AND unknown = false</code>; <code>false OR unknown = unknown</code>.</p>
<div class="tip">NULL — <b>не</b> нулевое численное значение и не строка пробелов: нули и пробелы — это значения, а NULL обозначает <b>отсутствие</b> значения. Поэтому термин «значение NULL» можно использовать лишь с оговорками. Кодд считал NULL составной частью модели, другие специалисты считают его включение преждевременным.</div>
<p><b>Требование целостности сущностей:</b> любой кортеж любого отношения должен быть отличим от любого другого кортежа этого отношения, т. е. <b>любое отношение должно обладать первичным ключом</b>. Формулировка для базовых отношений: <b>ни один атрибут первичного ключа не может содержать NULL</b> (иначе получилось бы, что не все его атрибуты необходимы для уникальной идентификации, что противоречит определению первичного ключа).</p>
<p><b>Требование целостности по ссылкам (ссылочная целостность):</b> если в отношении существует <b>внешний ключ</b>, то его значение должно либо соответствовать значению потенциального (как правило, первичного) ключа некоторого кортежа в его базовом отношении, либо полностью состоять из значений <b>NULL</b>.</p>
<p><b>Корпоративные ограничения целостности</b> — дополнительные правила поддержки целостности, определяемые пользователями или администраторами БД (например, «в одном отделении не может работать больше 20 сотрудников»).</p>`},
{h:"Реляционные ключи",html:`
<div class="def"><b>Определение 4.2.2.2. Суперключ</b> (superkey) — атрибут или множество атрибутов, которое единственным образом идентифицирует кортеж данного отношения. Может содержать дополнительные, необязательные для идентификации атрибуты.</div>
<div class="def"><b>Определение 4.2.2.3. Потенциальный ключ</b> (candidate key) — суперключ, который не содержит подмножества, также являющегося суперключом данного отношения. Два свойства: <b>уникальность</b> (значение ключа единственным образом идентифицирует кортеж) и <b>неприводимость</b> (никакое допустимое подмножество ключа не обладает свойством уникальности).</div>
<div class="tip">Никакой конкретный набор кортежей <b>не доказывает</b>, что атрибут — потенциальный ключ (отсутствие дубликатов сейчас не значит, что их не может быть). Но наличие дубликатов <b>доказывает обратное</b>. Нужно знать смысл атрибутов в «реальном мире».</div>
<p>Если ключ состоит из нескольких атрибутов — <b>составной ключ</b>.</p>
<div class="def"><b>Определение 4.2.2.4. Первичный ключ</b> (primary key) — потенциальный ключ, выбранный для уникальной идентификации кортежей внутри отношения. Потенциальные ключи, не выбранные первичным, называются <b>альтернативными ключами</b>.</div>
<p><b>Два принципа выбора первичного ключа:</b> 1) <b>семантический</b> — все атрибуты первичного ключа не должны содержать неопределённого значения ни в одном кортеже; 2) <b>эффективности</b> — выбирать ключ с минимальным количеством атрибутов и минимальной суммарной длиной значений.</p>
<div class="def"><b>Определение 4.2.2.5. Суррогатный ключ</b> (surrogate key) — искусственный атрибут отношения, не имеющий связей с какой-либо естественной характеристикой явлений ПрО и вводимый в схему исключительно для организации связей кортежей с кортежами других отношений. Назначение — уникальная внутрисистемная идентификация кортежей; СУБД обеспечивает механизм генерации уникальных значений.</div>
<p><b>Преимущества суррогатных ключей:</b> <b>единообразие</b> (стандартный префикс/суффикс + имя отношения, единый тип INTEGER); <b>компактность</b>; <b>отсутствие потребности в изменениях</b>, которые могут затронуть много отношений (при ошибочно введённых значениях естественных ключей, сдублированных в другие отношения).</p>
<div class="def"><b>Определение 4.2.2.6. Внешний ключ</b> (foreign key) — атрибут или множество атрибутов внутри отношения, который соответствует потенциальному (как правило, первичному) ключу некоторого (может быть, того же самого) отношения и является его подмножеством.</div>
<p><b>Правило равенства:</b> кортеж с определённым значением внешнего ключа связан с другим кортежем, если значение внешнего ключа совпадает со значением первичного ключа во втором кортеже. Уникальность во втором отношении (целостность сущностей) гарантирует <b>функциональность</b> соответствующего отображения.</p>`},
{h:"CREATE TABLE (нотация Oracle)",html:`
<p><b>Основные компоненты команды CREATE TABLE:</b> имя таблицы (и схемы), список столбцов с <b>типами данных</b>, <b>inline_constraint</b> (ограничения на уровне столбца), <b>out_of_line_constraint</b> (ограничения на уровне таблицы, позволяют использовать группы столбцов), <b>references_clause</b> (ссылочная целостность внешнего ключа).</p>
<p><b>Типы данных Oracle:</b> CHAR(size) — строки фиксированной длины (правые пробелы хранятся, 1–2000 байт); VARCHAR2(size) — переменной длины (правые пробелы не хранятся, 1–4000); NCHAR/NVARCHAR2 — то же для национального алфавита; NUMBER[(precision,[scale])] — числа (precision 1–38, scale от −84 до 127); LONG — символьные данные до 2 ГБ; LONG RAW / RAW(size) — двоичные; DATE — от 1 января 4712 г. до н. э. до 31 декабря 9999 г.; BLOB / CLOB / NCLOB — большие данные до 4 ГБ; BFILE — путь к внешнему файлу; ROWID — уникальный адрес строки; UROWID — универсальный логический адрес строки.</p>
<p><b>Ограничения целостности:</b> <code>constraint_name</code> — уникальное имя (если опущено, используется системное); <code>NOT NULL</code> запрещает NULL; <code>NULL</code> (по умолчанию) разрешает; <code>UNIQUE</code> определяет потенциальный ключ; <code>PRIMARY KEY</code> определяет первичный ключ; <code>CHECK(condition)</code> — условие, которому должны удовлетворять все строки (логическое выражение с точностью до имён столбцов; inline может содержать имя одного столбца, out_of_line — нескольких).</p>
<p><b>references_clause:</b> <code>schema</code> — имя схемы; <code>object</code> — имя таблицы, на ключ которой ссылается внешний ключ; <code>column</code> — столбцы её первичного или потенциального ключа; <code>ON DELETE</code>: если конструкция опущена — Oracle не разрешит удалить используемое значение; <b>CASCADE</b> — автоматически удалит строки ссылающейся таблицы; <b>SET NULL</b> — заменит значения на NULL.</p>`},
{h:"Триггеры",html:`
<div class="def"><b>Определение 4.2.2.7. Триггер</b> (trigger) — программа на языке программирования сервера (для Oracle — PL/SQL), которая <b>автоматически выполняется СУБД в момент наступления определённого события</b>. Это именованный блок PL/SQL с разделами объявления, выполнения и обработки исключительных ситуаций, но, в отличие от процедуры, выполняется <b>неявно</b> при каждом возникновении триггерного события и <b>не имеет параметров</b>. Приведение в действие называют <b>запуском (firing)</b>, или активизацией.</div>
<p><b>Цели использования триггеров:</b> проверка правильности введённых данных и сложных ОЦ, которые трудно поддерживать декларативно; косвенные модификации данных, сопутствующие действиям пользователей (например, при денормализации схемы); выдача предупреждений (например, по электронной почте); накопление информации <b>аудита</b> (кто и какие изменения внёс).</p>
<p>Триггеры базируются на модели <b>«событие-условие-действие» (Event-Condition-Action, ECA)</b>.</p>
<p><b>События в Oracle:</b> операторы INSERT, UPDATE, DELETE к таблице (или представлению); операторы CREATE, ALTER, DROP к любому объекту схемы; запуск БД или останов экземпляра Oracle; регистрация пользователя в системе или выход; конкретное или любое сообщение об ошибке.</p>
<p><b>Типы триггеров:</b> <b>строковые</b> (row-level, FOR EACH ROW) — выполняются для каждой затронутой строки; <b>операторные</b> (statement-level) — один раз для всего события; <b>INSTEAD OF</b> — активизируются <b>вместо</b> исходного оператора SQL, обеспечивают модификацию представлений, которые нельзя изменить напрямую.</p>
<p><b>NEW и OLD:</b> <code>:NEW.&lt;имя столбца&gt;</code> — новое значение, <code>:OLD.&lt;имя столбца&gt;</code> — старое. Ссылки на старые значения неприменимы для вставки, на новые — для удаления. <b>BEFORE</b> — до события, <b>AFTER</b> — после.</p>
<p><b>Порядок запуска триггеров:</b></p>
<ol><li>табличный триггер BEFORE на уровне оператора;</li>
<li>для каждой строки: а) триггер BEFORE на уровне строки; б) блокировка данных и выполнение действия команды SQL; в) проверка ограничений целостности; г) триггер AFTER на уровне строки;</li>
<li>табличный триггер AFTER на уровне оператора.</li></ol>
<div class="tip">Триггеры BEFORE активизируются <b>перед</b> проверкой ОЦ, поэтому они не должны вносить дополнительных изменений, способных нарушить целостность.</div>
<p><b>Тело триггера не может содержать:</b> операторы обработки транзакций (COMMIT, ROLLBACK); операторы установления соединения (CONNECT, DISCONNECT); операторы определения схемы и управления ею (создание/удаление таблиц); операторы управления сеансом (SET SESSION CHARACTERISTICS, SET ROLE, SET TIME ZONE).</p>
<p><b>Компоненты CREATE TRIGGER:</b> <code>schema</code> — имя схемы; <code>trigger</code> — имя триггера; <b>BEFORE</b> / <b>AFTER</b> / <b>INSTEAD OF</b> — время выполнения относительно основного действия; <code>dml_event_clause</code> (для DML-команд), <code>ddl_event</code> (для DDL), <code>database_event</code> (для системных событий); <b>WHEN</b> — дополнительное условие, при истинности которого триггер выполняется; тело на PL/SQL; <b>FOR EACH ROW</b> — триггер уровня строки.</p>
<p>Ограничения: BEFORE и AFTER нельзя использовать в триггерах для представлений; в BEFORE можно изменять NEW-значения и нельзя OLD; в AFTER нельзя изменять ни те, ни другие; INSTEAD OF допустим только для представлений, значения читать можно, изменять — нет. Порядок выполнения нескольких триггеров одного типа на одно событие <b>не определён</b>.</p>`},
{h:"4.2.3 Навигационные операции: курсоры PL/SQL",html:`
<p>Навигационный стиль манипулирования реляционными данными используется <b>исключительно в программных интерфейсах</b> с РСУБД. Принцип общий: СУБД передаётся <b>спецификационный</b> запрос на выборку, которому удовлетворяет несколько строк; в памяти программы отводится место для значений текущей строки; операторами цикла организуется <b>построчное сканирование</b> результирующей выборки. Нужна возможность <b>параллельного независимого сканирования</b> одной и той же или разных таблиц. По такому принципу строятся интерфейсы с драйверами ODBC, OLE DB, ADO; отличия — в терминологии и способах представления инструментов.</p>
<p><b>PL/SQL</b> — основной язык программирования сервера Oracle; процедуры, функции, триггеры хранятся и выполняются на сервере. Аппарат <b>курсоров</b> добавляет к спецификационным командам SQL возможность построчного сканирования.</p>
<p><b>Два типа курсоров:</b> <b>неявные</b> — организуются системой для всех команд SQL, селектирующих одну строку; <b>явные</b> — необходимы для запросов, возвращающих несколько строк.</p>
<p><b>Команды аппарата курсоров:</b></p>
<ul>
<li><code>CURSOR cursor_name [(parameter…)] [RETURN return_type] IS select_statement;</code> — <b>объявление</b> в области DECLARE. Обязательны имя курсора и команда SELECT; необязательны параметры и возвращаемый тип.</li>
<li><code>OPEN cursor_name [(parameter…)];</code> — выполняется SELECT, формируется результирующая таблица, указатель ставится на первую строку. При FOR UPDATE в SELECT блокируются все строки результата. Чтения при OPEN не происходит.</li>
<li><code>FETCH cursor_name [BULK COLLECT] INTO var_name…;</code> — читает данные текущей строки и перемещает указатель на следующую; для каждого столбца нужна своя совместимая переменная. BULK COLLECT читает все столбцы целиком в коллекции.</li>
<li><code>CLOSE cursor_name;</code> — закрывает курсор; результирующая таблица и указатель становятся недоступны. Повторное открытие возможно, но неизменность результата не гарантирована.</li>
</ul>
<p><b>Четыре атрибута курсора</b> (синтаксис: «имя курсора»«атрибут»):</p>
<table><tr><th>Атрибут</th><th>Значение</th></tr>
<tr><td><b>%ISOPEN</b></td><td>TRUE, если курсор открыт, FALSE — если нет</td></tr>
<tr><td><b>%FOUND</b></td><td>NULL — перед первым FETCH; TRUE — после успешного FETCH; FALSE — если FETCH не сумел выдать строку</td></tr>
<tr><td><b>%NOTFOUND</b></td><td>Обратно %FOUND: NULL перед первым FETCH; FALSE после успешного; TRUE — если строка не выдана</td></tr>
<tr><td><b>%ROWCOUNT</b></td><td>Общее число строк, извлечённых после открытия курсора (0 сразу после OPEN)</td></tr></table>
<p>Для %FOUND, %NOTFOUND и %ROWCOUNT до открытия и после закрытия курсора возникает исключительная ситуация <b>INVALID_CURSOR</b>.</p>
<p><b>Схема использования курсоров:</b></p>
<p><code>DECLARE … CURSOR cursor1 IS SELECT Фамилия, З/П FROM ПЕРСОНАЛ WHERE Должность='СИДЕЛКА';<br>
BEGIN OPEN cursor1; LOOP FETCH cursor1 INTO p_name, p_sal; EXIT WHEN cursor1%NOTFOUND; -- обработка одной записи<br>
END LOOP; CLOSE cursor1; END;</code></p>
<p>Типы переменных задаются конструкцией <code>%TYPE</code>, применяемой к столбцу таблицы; выход из безусловного цикла (LOOP … END LOOP) обеспечивается оператором EXIT с условием по атрибуту %NOTFOUND.</p>`}
],
