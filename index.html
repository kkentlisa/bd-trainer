<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3aa76d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="БД-Тренажёр">
<meta name="mobile-web-app-capable" content="yes">
<title>БД-Тренажёр — моделирование данных</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fb; --bg2:#ffffff; --card:#ffffff; --ink:#14212e; --ink2:#5a6b7d;
  --line:#e2e9f1; --brand:#3aa76d; --brand2:#2f8f5c; --brandsoft:#e6f6ed;
  --blue:#3d7dea; --bluesoft:#e8f0fe; --violet:#7a5cf0; --violetsoft:#efeaff;
  --amber:#f0a132; --ambersoft:#fff3e0; --red:#e0544d; --redsoft:#fdecec;
  --shadow:0 2px 0 var(--line), 0 10px 24px rgba(20,33,46,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161d; --bg2:#161d26; --card:#18202a; --ink:#e9eef4; --ink2:#9aabbc;
    --line:#26313d; --brandsoft:#16352a; --bluesoft:#152337; --violetsoft:#211b3d;
    --ambersoft:#33270f; --redsoft:#3a1c1b;
    --shadow:0 2px 0 var(--line), 0 10px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11161d; --bg2:#161d26; --card:#18202a; --ink:#e9eef4; --ink2:#9aabbc;
  --line:#26313d; --brandsoft:#16352a; --bluesoft:#152337; --violetsoft:#211b3d;
  --ambersoft:#33270f; --redsoft:#3a1c1b;
  --shadow:0 2px 0 var(--line), 0 10px 24px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Nunito,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .4em}
h1{font-size:1.65rem;font-weight:900;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.05rem;font-weight:800}
p{margin:0 0 .8em}
b,strong{font-weight:800}
code,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.93em;background:var(--bluesoft);padding:.08em .35em;border-radius:6px}

/* ---------- layout ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg2);
  border-bottom:1px solid var(--line);}
.topin{max-width:940px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:900;letter-spacing:-.02em;font-size:1.05rem;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0}
.logo .dot{width:26px;height:26px;border-radius:9px;background:linear-gradient(140deg,var(--brand),#5ec98d);display:grid;place-items:center;color:#fff;font-size:15px}
.spacer{flex:1}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:.9rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.iconbtn{background:var(--bg);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;font-size:15px}
main{max-width:940px;margin:0 auto;padding:18px 16px 110px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- cards / path ---------- */
.hero{background:linear-gradient(140deg,var(--brand),#4fc08d);color:#fff;border-radius:22px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.hero h1{color:#fff;margin-bottom:6px}
.hero p{margin:0;opacity:.92;font-weight:600}
.herorow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem}
.sect-title{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-weight:900;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.sect-title::after{content:"";flex:1;height:1px;background:var(--line)}

.node{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-bottom-width:3px;border-radius:18px;padding:14px 16px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease}
.node:hover{transform:translateY(-2px)}
.node .av{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--brandsoft)}
.node .tt{font-weight:800}
.node .sub{color:var(--ink2);font-size:.85rem;font-weight:600}
.node .pc{font-weight:900;font-size:.8rem;color:var(--ink2)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:7px}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s ease}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-bottom-width:3px;border-radius:14px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:.92rem}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand2)}

.tcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.tcard h3{margin-bottom:.5em;color:var(--brand2)}
:root[data-theme="dark"] .tcard h3,:root:not([data-theme="light"]) .tcard h3{color:#66d19a}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .tcard h3{color:var(--brand2)}}
.tcard ul,.tcard ol{margin:0 0 .8em;padding-left:1.25em}
.tcard li{margin-bottom:.35em}
.tcard table{width:100%;border-collapse:collapse;font-size:.92rem;margin-bottom:.8em}
.tcard td,.tcard th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tcard th{background:var(--bg);font-weight:800}
.scrollx{overflow-x:auto}
.def{background:var(--bluesoft);border-left:4px solid var(--blue);border-radius:10px;padding:10px 12px;margin:0 0 .9em}
.def b{color:var(--blue)}
.tip{background:var(--ambersoft);border-left:4px solid var(--amber);border-radius:10px;padding:10px 12px;margin:0 0 .9em;font-size:.95rem}
.key{background:var(--brandsoft);border-left:4px solid var(--brand);border-radius:10px;padding:10px 12px;margin:0 0 .9em}
.mark{background:var(--brandsoft);border-radius:5px;padding:0 3px;font-weight:800}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;border:0;border-bottom:4px solid var(--brand2);
  border-radius:16px;padding:13px 22px;font-weight:900;cursor:pointer;letter-spacing:.01em;transition:filter .12s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom:3px solid var(--line)}
.btn.grey{background:var(--ink2);border-bottom-color:#43566a}
.btn.red{background:var(--red);border-bottom-color:#b8413b}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- quiz ---------- */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qbar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.qbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#6dd79f);transition:width .35s}
.hearts{font-size:1.05rem;letter-spacing:2px}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.qtype{font-size:.75rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.qtext{font-size:1.12rem;font-weight:800;margin-bottom:14px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;background:var(--bg2);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;
  padding:12px 14px;margin-bottom:10px;cursor:pointer;font-weight:600;transition:.12s}
.opt:hover{border-color:var(--brand)}
.opt.sel{border-color:var(--blue);background:var(--bluesoft)}
.opt.ok{border-color:var(--brand);background:var(--brandsoft)}
.opt.bad{border-color:var(--red);background:var(--redsoft)}
.blanks{font-size:1.05rem;line-height:2.1;font-weight:600}
.slot{display:inline-block;min-width:110px;border-bottom:3px dashed var(--ink2);text-align:center;margin:0 4px;padding:2px 8px;cursor:pointer;font-weight:800;color:var(--blue)}
.slot.filled{border-bottom-style:solid;border-color:var(--brand);background:var(--brandsoft);border-radius:8px 8px 0 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.word{background:var(--bg2);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:800;font-size:.95rem}
.word.used{opacity:.3;pointer-events:none}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .word{width:100%;text-align:left}
.word.matched{background:var(--brandsoft);border-color:var(--brand);opacity:.55;pointer-events:none}
.word.pick{border-color:var(--blue);background:var(--bluesoft)}
.ord{list-style:none;padding:0;margin:0}
.ord li{background:var(--bg2);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:700;display:flex;gap:10px;align-items:center}
.ord li .n{width:26px;height:26px;border-radius:9px;background:var(--brandsoft);display:grid;place-items:center;font-weight:900;font-size:.85rem;flex:none}
.ord li .mv{margin-left:auto;display:flex;gap:4px}
.mvb{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:900}
input.txt{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);font-weight:700;font-size:1rem}
input.txt:focus{outline:none;border-color:var(--blue)}
.feed{position:sticky;bottom:0;margin:14px -18px -18px;padding:16px 18px;border-radius:0 0 20px 20px;font-weight:800;display:none}
.feed.on{display:block;animation:pop .25s}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.feed.good{background:var(--brandsoft);color:var(--brand2)}
.feed.bad{background:var(--redsoft);color:var(--red)}
.feed .ex{font-weight:600;font-size:.93rem;margin-top:6px;color:var(--ink)}

/* ---------- flashcards ---------- */
.fcwrap{perspective:1200px}
.fc{position:relative;min-height:230px;cursor:pointer}
.fc .side{background:var(--card);border:1px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:22px;min-height:230px;
  display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);backface-visibility:hidden;transition:transform .5s}
.fc .front{transform:rotateY(0)}
.fc .back{position:absolute;inset:0;transform:rotateY(180deg);overflow:auto;align-items:flex-start;text-align:left}
.fc.flip .front{transform:rotateY(-180deg)}
.fc.flip .back{transform:rotateY(0)}
.fc .q{font-size:1.15rem;font-weight:800}
.fc .a{font-weight:600;line-height:1.55;width:100%}

/* ---------- exam ---------- */
.exq{background:var(--card);border:1px solid var(--line);border-bottom-width:3px;border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.exq > .qq{display:flex;gap:10px;padding:14px 16px;cursor:pointer;font-weight:800;align-items:flex-start}
.exq .num{background:var(--violetsoft);color:var(--violet);border-radius:9px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:900;font-size:.85rem;flex:none}
.exq .aa{display:none;padding:0 16px 14px 54px;font-weight:500;border-top:1px dashed var(--line);margin-top:2px;padding-top:12px}
.exq.open .aa{display:block}
.exq .mk{display:flex;gap:8px;margin-top:12px}
.mini{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:6px 12px;font-weight:800;font-size:.85rem;cursor:pointer}
.mini.ok{background:var(--brandsoft);border-color:var(--brand);color:var(--brand2)}
.mini.no{background:var(--redsoft);border-color:var(--red);color:var(--red)}
.exq.known{border-left:4px solid var(--brand)}
.exq.unknown{border-left:4px solid var(--red)}

/* ---------- result ---------- */
.result{text-align:center;padding:30px 18px}
.result .big{font-size:3rem}
.ring{width:130px;height:130px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.5rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:999px;font-weight:800;z-index:99;opacity:0;pointer-events:none;transition:.3s;font-size:.92rem}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);z-index:30;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.bbin{max-width:940px;margin:0 auto;display:flex;gap:4px}
.bb{flex:1;background:none;border:0;border-radius:14px;padding:7px 4px;cursor:pointer;display:grid;gap:2px;justify-items:center;font-weight:800;font-size:.7rem;color:var(--ink2)}
.bb.on{color:var(--brand);background:var(--brandsoft)}
.bb span.i{font-size:1.2rem}
.muted{color:var(--ink2)}
.small{font-size:.88rem}
.center{text-align:center}
@media (max-width:560px){
  body{font-size:16px}
  .pairs{grid-template-columns:1fr}
  main{padding:14px 12px 110px}
  .topin{padding:9px 12px}
  .stat{padding:4px 9px;font-size:.82rem}
}
</style>
</head>
<body>
<div class="topbar"><div class="topin">
  <button class="logo" onclick="go('home')"><span class="dot">◆</span> БД-Тренажёр</button>
  <span class="spacer"></span>
  <span class="stat" title="Серия дней">🔥 <b id="sStreak">0</b></span>
  <span class="stat" title="Очки опыта">⭐ <b id="sXp">0</b></span>
  <button class="iconbtn" id="themeBtn" title="Тема">🌗</button>
</div></div>

<main>
  <section id="v-home" class="view on"></section>
  <section id="v-lesson" class="view"></section>
  <section id="v-quiz" class="view"></section>
  <section id="v-review" class="view"></section>
  <section id="v-stats" class="view"></section>
</main>

<div class="bottombar"><div class="bbin">
  <button class="bb on" data-nav="home" onclick="go('home')"><span class="i">🏠</span>Курс</button>
  <button class="bb" data-nav="review" onclick="go('review')"><span class="i">🔁</span>Повторение</button>
  <button class="bb" data-nav="stats" onclick="go('stats')"><span class="i">📊</span>Прогресс</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const DATA=[
/* ============================ ГЛАВА 1 ============================ */
{
id:"m1", num:"1", title:"Введение в технологию баз данных", icon:"🗄️", tag:"Глава 1",
theory:[
{h:"Что такое технология и технология БД",html:`
<div class="def"><b>Технология</b> (греч. techne — искусство, мастерство, умение) по БСЭ — это совокупность приёмов и способов получения, обработки или переработки сырья, материалов, полуфабрикатов или изделий, осуществляемых в различных отраслях промышленности, в строительстве и т. д.; а также научная дисциплина, разрабатывающая и совершенствующая такие приёмы и способы.</div>
<p><b>Информационная технология</b> предлагает аппаратно-программные системы для управления информацией, а соответствующие научные дисциплины обеспечивают технологическую базу для их создания.</p>
<div class="def"><b>Технология баз данных</b> — это технология, регламентирующая процесс создания и эксплуатации информационных систем, в которых для долговременного хранения информации используется <b>база данных</b>, а управляет ею некоторая <b>система управления базами данных (СУБД)</b>.</div>
<div class="tip">Фрагмент реального или идеального мира, о котором хранится информация, называют <b>предметной областью (ПрО)</b>.</div>`},
{h:"7 условий, при которых имеет смысл применять технологию БД",html:`
<p>Создавать систему БД следует при выполнении <b>всех</b> перечисленных условий:</p>
<ol>
<li>Нужно <b>долговременное хранение</b> информации о некоем фрагменте реального или идеального мира (о ПрО).</li>
<li>Система создаётся для <b>информационных потребностей нескольких людей</b>, в том числе тех, кто не в состоянии воспринимать этот мир своими органами чувств.</li>
<li>Нужна не «бесформенная куча», а <b>хорошо структурированное хранилище</b>, где каждый бит «лежит на своей полке» и непротиворечиво связан с остальными.</li>
<li>Моделируемый мир <b>динамичен</b>, поэтому специальные пользователи должны вносить изменения в его информационное описание.</li>
<li>Большинство пользователей удовлетворяет потребности в информации, <b>обращаясь к системе</b>, в которой есть механизмы удобного извлечения и преобразования информации.</li>
<li><b>Производная информация</b> получается из первичной простыми универсальными преобразованиями, <b>без разработки специальных алгоритмов</b>.</li>
<li>Информация вводится, хранится и предъявляется преимущественно в <b>алфавитно-цифровой форме</b>.</li>
</ol>
<div class="tip">Ситуация осложняется тем, что технология БД часто применяется в сочетании с другими информационными технологиями.</div>`},
{h:"Особенность термина «модель» в технологии БД",html:`
<p>В большинстве отраслей знаний «комплекс взглядов, представлений, идей, дающий целостное представление о закономерностях и связях определённой области действительности» называют <b>теорией (методологией моделирования)</b>, а <b>модель</b> — это идеализированное представление области действительности.</p>
<div class="key">В технологии БД произошла <b>замена смысла термина</b>: слово «<b>модель данных</b>» обозначает <b>теорию моделирования</b>, а результатом моделирования является <b>сама БД</b>. Этот казус сложился исторически при появлении первых моделей БД и сохраняется в большинстве публикаций.</div>`},
{h:"Назначение и состав модели данных",html:`
<div class="def"><b>Основное назначение модели данных (МД)</b> — обеспечение процесса <b>интерпретации (осмысления)</b> данных и превращения их в информацию.</div>
<p>В каждой модели данных имеются <b>три компонента</b>:</p>
<ul>
<li>правила порождения допустимых <b>структур данных</b>;</li>
<li>правила порождения <b>ограничений целостности</b> данных;</li>
<li>набор <b>операций</b> над данными.</li>
</ul>
<p>На основании правил определяется <b>схема БД</b> (основные понятия ПрО и их взаимосвязи), а операции нужны, чтобы первоначально наполнить схему непротиворечивыми данными, поддерживать их в адекватном ПрО состоянии и обеспечивать получение информации.</p>
<p><b>Пример для реляционной модели:</b> БД — совокупность отношений (таблиц); каждое отношение соответствует одному типу объектов и задаёт одинаковый набор атрибутов (столбцов); структуру отношения олицетворяет поименованная шапка пустой таблицы.</p>
<p><b>Ограничения целостности</b> (иногда — бизнес-правила) — условия, которым должны удовлетворять данные в телах таблиц. Пример: значениями атрибута <i>Рост</i> отношения <i>ЧЕЛОВЕК</i> могут быть целые числа от 50 до 300 — это предостережёт от многих ошибок ввода. Но окончательно проблему не решат никакие средства автоматизации: <b>только человек</b> в состоянии определить, какие факты об объектах ПрО истинны.</p>
<div class="key">Задача системы — запоминание соответствия данного его интерпретации (имени отношения и имени атрибута) и совместное их предоставление по запросам. Именно <b>интерпретация превращает значения данных в информацию</b>. Тела таблиц без наименований и шапок — просто бессмысленная совокупность символов машинного алфавита.</div>`},
{h:"Процессы и участники технологии БД",html:`
<p>Схема технологии БД включает <b>роли людей</b>, <b>программно-аппаратные средства</b> (прямоугольники), <b>информационные потоки</b> (дуги со стрелками) и <b>хранилище</b> (цилиндр внутри СУБД: «Схема БД» + «База данных»).</p>
<table><tr><th>Участник</th><th>Инструмент</th><th>Процесс</th></tr>
<tr><td>Проектировщик схемы БД</td><td>CASE-система</td><td>Проектирование схемы БД: семантическая схема ПрО → логическая схема БД</td></tr>
<tr><td>Пользователь БД</td><td>Диалоговая система пользователей</td><td>Ведение БД: данные ↔ интерпретации ↔ информация</td></tr>
<tr><td>Администратор БД</td><td>Диалоговая система администратора</td><td>Установка и администрирование, работа с физической схемой БД</td></tr></table>
<p>Одну роль может исполнять несколько человек (например, отдел администрирования), а в маленькой автономной системе все роли играет один человек.</p>
<p><b>Разработка специализированного ПО с бизнес-логикой ПрО</b> — необязательный процесс: он не рассматривается в курсе, так как (1) не нужен, если ведение БД идёт универсальными диалоговыми инструментами, и (2) относится к технологии создания ИС на универсальных языках (Visual Basic, Java, C++, C#, Delphi и т. д.).</p>`},
{h:"Проектирование схемы БД и CASE-системы",html:`
<p><b>Проектирование схемы БД — самый первый, самый важный и обязательный процесс.</b> От качества схемы существенно зависят простота остальных процессов и успех всей системы.</p>
<p>Проектировщик изучает ПрО сам и с помощью экспертов, формализует знания в виде <b>семантической схемы ПрО</b>, построенной по той или иной <b>семантической модели данных</b>, концепция которой максимально близка человеческому восприятию мира.</p>
<div class="def"><b>CASE</b> (Computer Aided Software/System Engineering) — программная система для проектирования и реализации других программных систем.</div>
<p>При выборе семантической модели решающи <b>два фактора</b>:</p>
<ul><li><b>мощность языка</b> — богатые выразительные способности, позволяющие полностью описать семантику ПрО;</li>
<li><b>поддержка модели CASE-средством</b>, обеспечивающим автоматическую трансляцию схемы ПрО на язык СУБД-ориентированной модели или логической модели конкретной СУБД.</li></ul>
<p>При отсутствии CASE-инструмента трансляцию делают вручную, зная <b>методику перевода</b> — набор правил преобразования структур и ОЦ. Часто лучше вообще не использовать CASE (но с мощной семантической моделью), чем применять CASE со слабой моделью и примитивными правилами трансформации.</p>
<p><b>Дальше по жизненному циклу:</b> администратор устанавливает систему у заказчика и администрирует её на уровне физической схемы (схемы хранения данных и интерпретаций на диске); его основная обязанность — обеспечение эффективной бесперебойной работы БД, невзирая на выход из строя аппаратуры и программ. Пользователи выступают в двух ролях — <b>«писателей»</b> (оперативно и точно отражают изменения ПрО) и <b>«читателей»</b> (удовлетворяют информационные потребности).</p>`},
{h:"Архитектуры систем БД",html:`
<ul>
<li><b>Мэйнфреймовая</b> — единый компьютер с множеством терминалов; сейчас встречается очень редко; поскольку используется один компьютер, напоминает однопользовательскую.</li>
<li><b>Однопользовательская (автономная)</b> — вся система БД управляется одним компьютером, на котором расположены и БД, и СУБД, и диалоговая система пользователя.</li>
<li><b>Клиент-серверная (двухуровневая)</b> — множество компьютеров в сети: <b>клиенты</b> обрабатывают прикладные программы и ведут диалоги с пользователями, <b>серверы</b> обрабатывают БД. Возникла из-за объединения микрокомпьютеров в рабочие группы: несколько процессоров дают производительность, но требуют координации.</li>
<li><b>Трёхуровневая</b> — сервер БД, сервер приложений (чаще всего web-сервер) и браузер/клиент. Каждый уровень может работать на отдельном компьютере под своей ОС, но может быть реализован и на одном компьютере.</li>
</ul>
<div class="tip">Если два сервера обрабатывают <b>одну</b> БД — это уже не клиент-серверная, а система <b>распределённой обработки БД</b>. В клиент-серверной каждый сервер управляет своей БД.</div>
<p><b>Три функции web-сервера:</b> 1) принимает запросы и генерирует отклики в формате HTTP; 2) на нём располагается и выполняется код бизнес-логики приложения; 3) генерирует SQL-запросы к БД и принимает отклики от сервера БД.</p>
<p><b>Три функции браузера:</b> 1) является HTTP-клиентом (генерирует запросы на страницы и действия); 2) содержит сценарный интерпретатор для запуска сценариев на клиентской машине; 3) материализует представления, преобразуя HTML или другой язык разметки в содержимое окна на экране.</p>
<p><b>Мониторы транзакций (TPM)</b> — программные системы эффективного управления информационно-вычислительными ресурсами в распределённой системе; опираются на трёхуровневую модель «клиент-сервер». Важнейшие характеристики: масштабируемость, поддержка функциональной полноты и целостности приложений, максимальная производительность при невысокой стоимости, поддержка целостности данных в гетерогенной среде. Примеры: ACMS (DEC), CICS (IBM), TOP END (NCR), PATHWAY (Tandem), ENCINA (Transarc), TUXEDO System (USL).</p>`},
{h:"Транзакция, OLTP и OLAP",html:`
<div class="def"><b>Транзакция</b> (англ. transaction) — логически неделимая единица работы с данными (обычно включает несколько операций над БД), которая должна выполняться <b>атомарным</b> образом: либо выполняются все изменения, либо ни одного, если произойдёт сбой. Транзакция или полностью выполняется, или полностью отменяется.</div>
<p><b>OLTP</b> (On-Line Transaction Processing) — системы оперативной обработки транзакций. Каждая транзакция вносит незначительные изменения в <b>оперативные</b> данные предприятия. Размер БД — от нескольких мегабайт до терабайт и даже петабайт. <b>Весь курс посвящён именно этому классу систем.</b></p>
<p><b>OLAP</b> (On-Line Analytical Processing) — оперативная аналитическая обработка. Для анализа создаётся <b>хранилище данных</b> — аналитическая БД со сведениями из разных источников (в т. ч. оперативных БД), накопительными и сводными данными. Из оперативных БД данные попадают в аналитическую через <b>очистку, архивацию, агрегацию</b>. Лицам, принимающим корпоративные решения, нужен доступ не только к текущим, но и к историческим данным.</p>
<p>В OLAP серверы используют <b>многомерные структуры</b> — многомерные <b>кубы</b> данных, визуально представляемые динамически изменяемыми таблицами (оси — строки, столбцы, иногда третья ось — закладки/слои).</p>
<table><tr><th>Термин</th><th>Смысл</th></tr>
<tr><td>Измерение</td><td>показывается на оси; на одной оси может быть несколько измерений (тогда приводятся все комбинации)</td></tr>
<tr><td>Меры куба</td><td>значения в ячейках — значения арифметического показателя (деньги, кг, метры)</td></tr>
<tr><td>Члены</td><td>возможные значения данных в измерении; могут образовывать иерархию (день, неделя, месяц)</td></tr>
<tr><td>drag and drop</td><td>перетаскивание элементов диалога по экрану</td></tr>
<tr><td>drill-down / drill-up</td><td>перемещение по уровням иерархии членов измерения: с агрегированного на детальный и наоборот</td></tr></table>
<div class="tip">Специфика задач OLTP и OLAP настолько существенна, что решать их одной БД и СУБД крайне неэффективно — лучше применять специальные БД и СУБД для каждого случая.</div>`},
{h:"Цепочка представлений о ПрО (уровни проектирования)",html:`
<p>Многослойный «пирог» представлений на пути от объективной реальности к БД:</p>
<div class="scrollx"><table>
<tr><th>Представление</th><th>Область знаний</th><th>Программная система</th><th>Модель данных</th><th>Теория</th></tr>
<tr><td>Представление в голове человека</td><td>Философия / Логика</td><td>—</td><td>—</td><td>Логика высказываний, Логика предикатов 1-го порядка</td></tr>
<tr><td>Семантическая схема</td><td>Семантическое моделирование</td><td>CASE: ERWIN, Design IDEF, Oracle Designer</td><td>«Сущность-Связь», «Сущность-Связь-Отображение»</td><td>Теория семантически значимых отображений</td></tr>
<tr><td>СУБД-ориентированная схема</td><td>Моделирование данных</td><td>—</td><td>Реляционная, объектно-реляционная, объектно-ориентированная</td><td>Теория множеств, теория отношений, реляционная теория</td></tr>
<tr><td>Логическая схема БД</td><td>Использование СУБД</td><td>СУБД: MS Access, MS SQL, Oracle</td><td>Реляционная модель MS Access / MS SQL / Oracle</td><td>—</td></tr>
<tr><td>Физическая схема БД</td><td>Разработка и администрирование системы БД</td><td>—</td><td>Объектно-реляционная модель Oracle</td><td>—</td></tr>
</table></div>
<p>Каждая СУБД имеет <b>две</b> модели данных: <b>логическую</b> (обращена к человеку, даёт языковые и диалоговые инструменты) и <b>физическую</b> (обращена к средствам хранения данных в оперативной и внешней памяти; её редко кто знает, кроме разработчиков СУБД).</p>
<div class="key">Семантические модели ближе всего к человеческому миропониманию, но <b>нет СУБД, поддерживающих их непосредственно</b>, поэтому ограничиться семантической схемой нельзя.</div>`},
{h:"Структура курса",html:`
<ol><li>Введение в технологию баз данных</li>
<li>Основные понятия: 2.1 Данные и модели данных · 2.2 Структуры · 2.3 Ограничения целостности · 2.4 Операции · 2.5 Демонстрационная предметная область</li>
<li>Семантические модели данных: 3.1 Принципы семантического моделирования · 3.2 ER-модель · 3.3 ERM-модель</li>
<li>СУБД-ориентированные модели данных: 4.1 Обзор · 4.2 Реляционная модель (… 4.2.5 Теория реляционных БД и классическая методика проектирования)</li>
<li>Семантическая методика проектирования реляционных схем БД</li></ol>
<p>Анализ конкретных моделей всюду идёт по схеме <b>«структуры — ограничения целостности — операции»</b>.</p>`}
],

exam:[
["Укажите отличительные особенности технологии БД, выделяющие её среди технологий вообще и информационных технологий, в частности.",`<p><b>Технология вообще</b> — совокупность приёмов и способов получения, обработки или переработки сырья, материалов, полуфабрикатов или изделий, а также научная дисциплина, разрабатывающая и совершенствующая такие приёмы и способы (БСЭ).</p>
<p><b>Информационная технология</b> отличается предметом: она предлагает аппаратно-программные системы для управления <b>информацией</b>, а научные дисциплины обеспечивают технологическую базу для их создания.</p>
<p><b>Технология БД</b> — это информационная технология, регламентирующая процесс создания и эксплуатации информационных систем, в которых для <b>долговременного хранения</b> информации используется <b>база данных</b>, а управляет ею некоторая <b>СУБД</b>. Её отличает использование СУБД той или иной <b>модели данных</b> — концепции представления объектов мира и их взаимосвязей; интерпретации данных не фиксируются в программах, а хранятся на диске вместе с данными; структурированность хранилища и поддержание целостности данных ограничениями целостности.</p>`],
["Каковы предпосылки использования технологии БД?",`<p>Технологию БД следует применять при выполнении <b>всех</b> условий:</p><ol>
<li>нужно долговременное хранение информации о ПрО;</li>
<li>система создаётся для информационных потребностей нескольких людей, в том числе тех, кто не может воспринимать этот мир органами чувств;</li>
<li>нужна не «бесформенная куча», а хорошо структурированное хранилище, где каждый бит информации «лежит на своей полке» и непротиворечиво связан с остальными;</li>
<li>моделируемый мир динамичен, и специальные пользователи должны вносить изменения в его информационное описание;</li>
<li>большая часть пользователей удовлетворяет информационные потребности, обращаясь к системе, где есть механизмы удобного извлечения и преобразования информации;</li>
<li>производная информация должна получаться из первичной простыми универсальными преобразованиями, без разработки специальных алгоритмов;</li>
<li>информация вводится, хранится и предъявляется преимущественно в алфавитно-цифровой форме.</li></ol>`],
["В чём особенности термина «модель» в технологии БД?",`<p>В большинстве отраслей знаний целостное представление о закономерностях области действительности называют <b>теорией (методологией моделирования)</b>, а <b>модель</b> — идеализированное представление области действительности в рамках этой теории.</p>
<p>В технологии БД произошла замена смысла: словом «<b>модель данных</b>» обозначают <b>теорию моделирования</b>, а <b>результатом</b> моделирования является <b>сама база данных</b>. Казус сложился исторически при появлении первых моделей БД и сохраняется в большинстве публикаций.</p>`],
["Каково основное назначение моделей данных?",`<p>Обеспечение процесса <b>интерпретации (осмысления)</b> данных и превращения их в <b>информацию</b>. Эффективность применения технологии БД существенно определяется тем, насколько понятна человеку сущность данных и представляемой ими информации; модели данных служат средством достижения такого понимания.</p>`],
["Перечислите составные части любой модели данных.",`<ul><li>правила порождения допустимых <b>структур данных</b>;</li><li>правила порождения <b>ограничений целостности</b> данных;</li><li>набор <b>операций</b> над данными.</li></ul>`],
["Каково назначение структур данных, ограничений целостности и операций над данными?",`<p><b>Структуры данных</b> определяют схему БД — основные понятия ПрО и их взаимосвязи; пока не определена как минимум структура данных, система не позволит вводить данные, поскольку при создании, изменении и удалении обязательно указывается, элементом какой структуры они являются.</p>
<p><b>Ограничения целостности</b> задают условия, которым должны удовлетворять данные, и поддерживают БД в целостном, непротиворечивом состоянии, максимально соответствующем состоянию ПрО (например, Рост ∈ [50, 300] предостерегает от ошибок ввода).</p>
<p><b>Операции</b> нужны, чтобы первоначально наполнить схему непротиворечивыми данными, поддерживать их в адекватном ПрО состоянии и обеспечивать получение необходимой информации.</p>`],
["Укажите основные процессы в системах БД, кто и какие задачи в них реализует.",`<ul>
<li><b>Проектирование схемы БД</b> — проектировщик схемы БД: изучает ПрО сам и с помощью экспертов, строит семантическую схему ПрО, с помощью CASE-системы (или вручную) переводит её в логическую схему БД. Это первый, важнейший и обязательный процесс.</li>
<li><b>Установка и администрирование системы БД</b> — администратор БД: устанавливает систему у заказчика, администрирует её на уровне физической схемы (схемы хранения данных и их интерпретаций на диске); обеспечивает эффективную бесперебойную работу БД, невзирая на возможный выход из строя аппаратуры и программ.</li>
<li><b>Ведение БД (применение системы)</b> — пользователи БД в двух ролях: «писатели» оперативно и точно отражают изменения ПрО, «читатели» удовлетворяют свои информационные потребности, обращаясь к системе.</li>
<li>Необязательный процесс — <b>разработка специализированного ПО</b> с бизнес-логикой ПрО (диалоговой системы пользователей) на универсальных языках программирования.</li></ul>`],
["Для чего предназначены CASE-системы?",`<p><b>CASE</b> (Computer Aided Software/System Engineering) — программная система для проектирования и реализации других программных систем. В технологии БД CASE-система позволяет: 1) просто и естественно для проектировщика ввести семантическую схему ПрО; 2) <b>автоматически перевести</b> её на язык СУБД-ориентированной модели или логической модели конкретной СУБД. В идеале перевод не сопровождается потерей информации, и каждый элемент семантической схемы находит отражение в логической модели СУБД (в крайнем случае — в процедурной форме). Часто лучше вообще не использовать CASE (с мощной семантической моделью), чем применять CASE со слабой моделью и примитивными правилами трансформации.</p>`],
["Перечислите и кратко охарактеризуйте архитектуры систем БД.",`<ul>
<li><b>Мэйнфреймовая</b> — единый компьютер (большая ЭВМ) с многочисленными терминалами пользователей; система БД одновременно ведёт диалог со всеми через терминалы; сейчас встречается очень редко; поскольку компьютер один, напоминает однопользовательскую.</li>
<li><b>Однопользовательская (автономная)</b> — вся система БД управляется одним компьютером, на нём расположены и БД, и СУБД, и диалоговая система пользователя.</li>
<li><b>Клиент-серверная (двухуровневая)</b> — множество компьютеров, объединённых в сеть: клиенты обрабатывают прикладные программы и ведут диалоги с пользователями, серверы обрабатывают БД. Если два сервера обрабатывают одну БД — это система распределённой обработки БД.</li>
<li><b>Трёхуровневая</b> — сервер БД, сервер приложений (web-сервер или монитор транзакций TPM) и браузер/клиент. Между web-сервером и сервером БД передаются SQL-операторы и реляционные данные, между web-сервером и браузером — web-страницы, клиентский код и данные. Каждый уровень может работать на отдельном компьютере под своей ОС, но возможна реализация и на одном компьютере.</li></ul>`],
["В чём основные различия OLTP- и OLAP-систем БД?",`<table><tr><th></th><th>OLTP</th><th>OLAP</th></tr>
<tr><td>Назначение</td><td>оперативная обработка транзакций</td><td>оперативная аналитическая обработка</td></tr>
<tr><td>Данные</td><td>оперативные, текущее состояние ПрО</td><td>хранилище данных: сведения из разных источников, накопительные и сводные, исторические данные</td></tr>
<tr><td>Операции</td><td>большой поток коротких транзакций актуализации</td><td>запросы на выборку проекций многомерных кубов</td></tr>
<tr><td>Пользователи</td><td>операторы</td><td>аналитики, лица, принимающие корпоративные решения</td></tr>
<tr><td>Структуры</td><td>отношения (таблицы)</td><td>многомерные структуры — кубы (измерения, меры, члены, иерархии)</td></tr></table>
<p>Данные попадают из оперативных БД в аналитическую через очистку, архивацию и агрегацию. Специфика задач настолько существенна, что решать их одной БД и СУБД крайне неэффективно.</p>`],
["Какие формы представлений о ПрО выделяют в технологии БД? Охарактеризуйте каждую из них.",`<ol>
<li><b>Представление в голове человека</b> — исключительно неформализованные зрительные, слуховые, обонятельные, осязательные образы; область знаний — философия/логика; формальные системы — логика высказываний и логика предикатов первого порядка.</li>
<li><b>Семантическая схема</b> — первое формальное представление ПрО, строится в семантической модели данных (ER, ERM), максимально близкой человеческому восприятию; ПО — CASE-системы (ERWIN, Design IDEF, Oracle Designer); теория — теория семантически значимых отображений.</li>
<li><b>СУБД-ориентированная схема</b> — схема на языке обобщённой модели конкретного класса СУБД (реляционной, объектно-реляционной, объектно-ориентированной); теории — теория множеств, теория отношений, реляционная теория.</li>
<li><b>Логическая схема БД</b> — схема на языке логической модели конкретной СУБД (MS Access, MS SQL, Oracle); обращена к человеку и предлагает языковые и диалоговые инструменты.</li>
<li><b>Физическая схема БД</b> — схема хранения данных и их интерпретаций на диске; обращена к средствам хранения в оперативной и внешней памяти, ориентирована на эффективность; её редко кто знает, кроме разработчиков СУБД.</li>
<li><b>База данных</b> — конечный результат, хранящийся в памяти компьютера.</li></ol>`]
]},

{
id:"m21", num:"2.1", title:"Данные и модели данных", icon:"💡", tag:"Глава 2",
theory:[
{h:"Данные и информация",html:`
<div class="def"><b>Определение 2.1.1. Данные</b> (лат. data, от ед. ч. datum — факт) — это факты реального мира и идеи, представленные в формализованном виде, позволяющем передавать или обрабатывать их при помощи некоторого процесса и соответствующих технических средств.</div>
<div class="def"><b>Определение 2.1.2. Информация</b> — приращение знаний человека, которое может быть получено на основе данных.</div>
<p>Изначальное средство представления информации — <b>естественный язык</b>, но он не всегда лучший: 1) в силу универсальности менее эффективен, чем специализированные средства; 2) ориентирован на вольный стиль и не обеспечивает нужной точности; 3) обработка его текстов на компьютере связана с принципиальными трудностями.</p>
<div class="key">Данные без интерпретаций <b>«мертвы»</b>. Данные 120 и 30 ничего не говорят человеку; его интересует информация.</div>`},
{h:"Семиотика: три этапа получения информации",html:`
<div class="def"><b>Определение 2.1.3. Семиотика</b> (греч. semeion — знак, признак) — комплекс научных учений, изучающих свойства семиотических (знаковых) систем, основное назначение которых — выражать некоторое содержание.</div>
<p><b>Знак</b> понимается широко: объект произвольной природы, которому при определённых условиях (знаковой ситуации) сопоставлено некоторое значение — конкретный физический предмет или абстрактное понятие.</p>
<div class="def"><b>Определение 2.1.4. Синтактика</b> — раздел семиотики, изучающий внутренние свойства систем знаков безотносительно к интерпретации (синтаксис — правила построения знаков и знакосочетаний).</div>
<div class="def"><b>Определение 2.1.5. Семантика</b> — раздел семиотики, рассматривающий отношение знаков к обозначаемому (содержание знаков), т. е. соотношения между знаками и их интерпретациями, независимо от того, кто служит «адресатом».</div>
<div class="def"><b>Определение 2.1.6. Прагматика</b> — раздел семиотики, изучающий восприятие выражений знаковой системы в соответствии с разрешающими способностями воспринимающего; исследует связь знаков с «адресатом», полезность и ценность для интерпретатора.</div>
<p><b>Пример «120 и 30»:</b> синтаксис — это целые положительные числа в 10-тичной системе; семантика — интерпретация «первое число — рост в см, второе — возраст в годах»; прагматика — то, какое приращение знаний получит конкретный адресат (неопытный узнает, что такие люди встречаются; опытный построит гипотезы: карлик, горбун…; зная, что человек живёт в Африке, выдвинет гипотезу «пигмей»).</p>
<p><b>В схеме передачи информации:</b> «писатель» наблюдает ПрО и создаёт знаки в БД; синтактика определяет правила построения БД; семантика изучает отношения между знаками и объектами реального мира; прагматика осуществляется в голове у «читателя».</p>`},
{h:"Три класса систем по расположению интерпретаций",html:`
<p>В информационных системах данные всегда долговременно хранятся на диске, а вот интерпретации могут находиться в разных местах:</p>
<ol>
<li><b>Интерпретациями владеет только человек</b> — пример: обычный калькулятор (только человек знает, складывает он рубли или яблоки).</li>
<li><b>Интерпретации указаны в программе</b> — пример: программа печати ведомости на зарплату (в файле массив строк, первые 20 символов — фамилия, следующие 5 — зарплата; форму отчёта придаёт специально написанная программа). Так строили ИС в «доСУБДэшную» эпоху: для каждого файла свои программы.</li>
<li><b>Интерпретации тоже хранятся на диске</b> в виде специальным образом организованных данных — это <b>системы БД</b>. Именно поэтому СУБД универсальны: интерпретации задаются один раз при проектировании схемы БД, ассоциируются с данными при вводе, и связь остаётся неразрывной.</li>
</ol>
<div class="tip">В результате такой эволюции изменилась роль данных: их уже нельзя рассматривать как совокупность битов, они приобретают интеллектуальную окраску — их можно расценивать как семантически значимое представление реального мира, как взгляд на мир.</div>`},
{h:"Атомарная единица информации (АЕИ)",html:`
<div class="def"><b>АЕИ</b> определяется четвёркой: <b>&lt;Идентификатор объекта, Наименование признака, Значение признака, [Время]&gt;</b>.</div>
<p>Каждая АЕИ задаёт истинность факта: «объект, на который указывает идентификатор, имеет определённое значение признака, заданного именем, в конкретное время». К признакам относятся и свойства, и характеристики, и отношения — поэтому сколь угодно сложные ПрО можно представить множеством таких четвёрок.</p>
<p><b>Время</b> в квадратных скобках — может быть опущено; остальные три элемента обязательны, без любого из них информация не образуется. Моделей с идеальной работой с <b>темпоральными</b> данными не существует; большинство БД хранит одно (текущее) состояние ПрО — такие БД называют <b>оперативными</b>. Поэтому далее под АЕИ понимают <b>тройку</b>: &lt;Идентификатор объекта, Наименование признака, Значение признака&gt;.</p>
<p><b>Пример:</b> &lt;Джон, Рост в см, 180&gt;, &lt;Джон, Вес в кг, 90&gt;, &lt;Джек, Рост в см, 190&gt;.</p>
<p><b>Категориальная модель:</b> избавляясь от избыточности АЕИ (дублирования наименований признаков и идентификаторов), строим таблицы признаков (Рост, Вес), а затем собираем значения всех признаков однотипных объектов в одну таблицу — она описывает объекты одной <b>категории</b> (ЧЕЛОВЕК). Категория — основное структурное понятие категориальной модели.</p>`},
{h:"Схема БД, БД и структурное определение модели данных",html:`
<div class="def"><b>Определение 2.1.8.</b> Совокупность именованных категорий и их признаков, а также ограничений на допустимые данные называется <b>схемой БД</b>.</div>
<div class="def"><b>Определение 2.1.9.</b> Совокупность данных, структура и значения которых соответствуют конкретной схеме, называется <b>базой данных (БД)</b>.</div>
<div class="def"><b>Определение 2.1.10. (Структурное определение МД)</b> Модель данных определяется двумя множествами <b>G</b> и <b>O</b>: G — множество правил порождения схем, O — множество операций над данными. Во множестве G выделяются два подмножества: <b>G<sub>s</sub></b> (правила порождения структур данных) и <b>G<sub>c</sub></b> (правила порождения ограничений целостности).</div>
<p><b>Пример правил G<sub>s</sub> для категориальной модели:</b> БД — совокупность таблиц; каждая таблица хранит информацию об объектах одной категории, имя таблицы — имя категории; для каждой категории определяется набор признаков, их имена составляют шапку таблицы; каждый объект — строка таблицы.</p>
<p><b>Пример правил G<sub>c</sub>:</b> допустимые значения признаков ограничиваются указанием типа, перечислением значений, сравнением с константой.</p>
<p><b>Пример множества O:</b> INSERT, UPDATE, DELETE, SELECT.</p>
<div class="def"><b>Определение 2.1.11.</b> Управление БД осуществляется <b>СУБД</b>, каждая из которых предлагает свои языковые и диалоговые формы для множеств G и O: <b>язык определения данных (ЯОД)</b> и <b>язык манипулирования данными (ЯМД)</b>. Иногда выделяют отдельный <b>язык определения ограничений целостности (ЯООЦ)</b>, но чаще ОЦ задаются вместе со структурой в командах ЯОД.</div>
<p>Правила множества G порождают схемы <b>S<sub>i</sub></b>, каждой из которых в разные моменты времени могут соответствовать различные состояния БД <b>D<sub>j</sub></b>. Дерево «М → S<sub>i</sub> → D<sub>j</sub>» иллюстрирует связь понятий «модель данных», «схема БД», «состояние БД».</p>`}
],

exam:[
["Объясните, почему человека интересуют не данные, а информация.",`<p>Данные — это факты и идеи в формализованном виде; сами по себе они «мертвы». Такие данные, как 120 и 30, ничего не говорят человеку. Человеку нужно <b>приращение знаний</b>, т. е. информация, а она получается только тогда, когда данные снабжены <b>интерпретацией</b> и восприняты адресатом с учётом его прежних знаний (прагматика). Именно интерпретация превращает значения данных в информацию.</p>`],
["Что кроме данных необходимо для получения информации?",`<p>Необходимы <b>интерпретации</b> данных (смысл: имя типа/категории, имя признака) и <b>адресат</b> с его знаниями, воспринимающий сообщение. В естественном языке данные и интерпретации указываются совместно; в системах БД интерпретации задаются один раз при проектировании схемы БД и хранятся на диске вместе с данными.</p>`],
["Перечислите и охарактеризуйте три этапа процесса образования информации из данных.",`<ol>
<li><b>Синтаксический анализ</b> — распознаются внутренние свойства знаков (например, что 120 и 30 — целые положительные числа, записанные арабскими цифрами в 10-тичной системе). Никакие семантические отношения с объектами ПрО на этом этапе не возникают.</li>
<li><b>Семантический анализ</b> — данным сопоставляются интерпретации («первое число — рост человека в сантиметрах, второе — возраст в годах»), образуется содержание (смысл) сообщения.</li>
<li><b>Прагматика</b> — восприятие сообщения адресатом: окончательный результат (приращение знаний) существенно зависит от знаний, которые он имел на момент получения сообщения.</li></ol>`],
["Какие разделы семиотики изучают эти этапы?",`<p><b>Синтактика</b> — изучает внутренние свойства систем знаков безотносительно к интерпретации. <b>Семантика</b> — рассматривает отношение знаков к обозначаемому (соотношения между знаками и их интерпретациями). <b>Прагматика</b> — изучает восприятие выражений знаковой системы в соответствии с разрешающими способностями воспринимающего, связь знаков с адресатом, их полезность и ценность для интерпретатора.</p>`],
["К какому классу информационных систем относятся системы БД?",`<p>К <b>третьему</b> классу — системам, в которых <b>интерпретации хранятся на диске</b> в виде специальным образом организованных данных (наряду с самими данными). Именно это позволило сделать СУБД универсальными программными комплексами для управления БД о любых ПрО.</p>`],
["Опишите, как протекает процесс передачи информации о ПрО с использованием систем БД.",`<p>В ПрО независимо от нашего сознания существуют объекты с характеристиками, вступающие в связи. <b>«Писатель»</b> (человек, обязанный отражать изменения ПрО в БД) узнаёт о существовании объектов и связей и производит первичную формализацию у себя в голове, в частности определяет знаки для идентификации объектов и связей. Затем он обращается к <b>знаковой системе</b> — системе БД: находит в её схеме подходящую подсхему (граф типов) и создаёт в БД новые объекты и связи соответствующих типов; получается подграф знаков, где пунктирные дуги связывают знаки с их типами — именно эти связи указывают, как интерпретировать данные. На этом работа «писателя» закончена.</p>
<p>Далее любой <b>«читатель»</b> может воссоздать представления «писателя» о ПрО, не исследуя её непосредственно, а обращаясь к системе. Синтактика определяет правила построения БД, семантика изучает отношения между знаками и объектами реального мира, прагматика осуществляется в голове у «читателя».</p>`],
["В чём заключается основное назначение модели данных?",`<p><b>Функциональное определение 2.1.7:</b> модель данных — это <b>интеллектуальное средство, позволяющее реализовать интерпретацию данных и таким образом способствующее получению информации</b>. Эпитет «интеллектуальное» применён неспроста: способность к восприятию, хранению и передаче информации — одно из важнейших свойств интеллекта.</p>`],
["Из каких компонентов состоит атомарная единица информации (АЕИ)?",`<p>АЕИ определяется четвёркой: <b>&lt;Идентификатор объекта, Наименование признака, Значение признака, [Время]&gt;</b>. Последний элемент необязателен, поэтому обычно под АЕИ понимают тройку &lt;Идентификатор объекта, Наименование признака, Значение признака&gt;.</p>`],
["Объясните, почему первые три компонента АЕИ являются обязательными.",`<p>Каждая АЕИ задаёт истинность факта «объект, на который указывает идентификатор, имеет определённое значение признака, заданного именем». Если опустить хотя бы один из трёх элементов, <b>информация не образуется</b>: без идентификатора неизвестно, о каком объекте речь; без наименования признака нет интерпретации значения; без значения нет самого факта. Время же можно опустить, так как подавляющее большинство моделей и БД хранят информацию об одном (текущем) состоянии ПрО.</p>`],
["С чем ассоциируются понятия «схема БД» и «база данных» при табличном представлении данных?",`<p><b>Схема БД</b> — совокупность именованных категорий (имён таблиц) и их признаков (имён столбцов, шапок таблиц), а также ограничений на допустимые данные. <b>База данных</b> — совокупность данных (строк таблиц), структура и значения которых соответствуют конкретной схеме. Иногда содержание расширяют: в схему включают программы обработки данных, определения запросов, диалоговых форм; а БД считают всем, что хранится на диске помимо собственно СУБД (тогда БД вбирает в себя и свою схему).</p>`],
["Дайте структурное определение модели данных.",`<p><b>Определение 2.1.10.</b> Модель данных определяется двумя множествами <b>G</b> и <b>O</b>. G — множество правил порождения схем, O — множество операций над данными. Во множестве G выделяются два подмножества: <b>G<sub>s</sub></b> — правила порождения структур данных и <b>G<sub>c</sub></b> — правила порождения ограничений целостности.</p>`],
["Проиллюстрируйте компоненты модели данных на примере категориальной модели.",`<p><b>G<sub>s</sub>:</b> БД — это совокупность таблиц; каждая таблица предназначена для хранения информации об объектах одной категории, имя таблицы — имя категории; для каждой категории определяется набор признаков, их имена составляют шапку таблицы; каждый объект категории представляется строкой таблицы, в столбце признака указывается его значение.</p>
<p><b>G<sub>c</sub>:</b> допустимые значения признаков можно ограничить указанием типа (символьные, числовые, даты), перечислением значений, сравнением значений с константой. Например: Пол ∈ {'мужской','женский'}; Возраст > 0 и < 150.</p>
<p><b>O:</b> INSERT — добавление новой строки; UPDATE — изменение значений признаков в строке; DELETE — удаление строки; SELECT — поиск строк, удовлетворяющих условию.</p>`],
["Что представляет собой СУБД?",`<p><b>Определение 2.1.11.</b> СУБД — специализированные программные средства управления БД на ЭВМ, каждое из которых предлагает свои языковые и диалоговые формы для множеств G и O: <b>язык определения данных (ЯОД)</b> и <b>язык манипулирования данными (ЯМД)</b>; иногда выделяют отдельный <b>язык определения ограничений целостности (ЯООЦ)</b>, но чаще ОЦ задаются вместе со структурой в командах ЯОД. СУБД — универсальные программные комплексы, пригодные для БД о любых ПрО, поскольку интерпретации в них не фиксируются в программах, а хранятся на диске.</p>`]
]},

theory:[
{h:"Знак и тип",html:`
<div class="def"><b>Определение 2.2.1. Знак</b> — это данное (строка символов, число, дата или их агрегат), определяющее конкретный объект, связь объектов или значение характеристики объекта.</div>
<div class="def"><b>Определение 2.2.2. Тип</b> — это именованный класс подобных знаков. Имя типа определяет интерпретацию принадлежащих типу знаков.</div>
<p>Структурный компонент схемы БД — это определения типов (типов объектов ПрО, типов их связей и их характеристик). Типы не изолированы, а образуют <b>взаимосвязанную систему типов</b>. Задача структуризации ПрО — построение такой системы типов средствами конкретной модели.</p>`},
{h:"Абстракция: обобщение и агрегация",html:`
<div class="def"><b>Определение 2.2.3. Абстракция</b> (лат. abstractio — отвлечение): 1) метод научного исследования, при котором не учитываются несущественные стороны и признаки явления; 2) продукт познания (понятие, описание, закон, модель, идеальный объект); 3) познавательная деятельность — процесс абстрагирования.</div>
<p>В технологии БД выделяют <b>два вида абстракции: обобщение и агрегацию</b>.</p>
<div class="def"><b>Определение 2.2.4. Обобщение</b> — абстракция, позволяющая соотнести множество знаков или типов с одним общим типом по отношению «<b>есть некоторый</b>» (англ. is a). Частные случаи: <b>классификация</b> — обобщение знаков до типа (отношение «экземпляр-класс»); <b>генерализация</b> — обобщение типов до типа (отношение «подкласс-суперкласс»).</div>
<div class="def"><b>Определение 2.2.5. Агрегация</b> — абстракция, посредством которой объект конструируется из других, базовых объектов по отношению «<b>есть часть</b>» (англ. part of). Возможна на уровне знаков (сложный знак из более простых) и на уровне типов.</div>
<p><b>Обратные операции:</b> классификации ↔ <b>экземпляризация</b>, генерализации ↔ <b>специализация</b>, агрегации ↔ <b>декомпозиция</b>.</p>
<div class="key">Обобщённый тип обладает всеми признаками, общими для базовых знаков или типов; все признаки обобщённого типа могут быть <b>унаследованы</b> базовыми типами. <b>Агрегация</b> определяет структуру объектов, <b>обобщение</b> — механизм наследования признаков. Иерархия обобщения и иерархия агрегации <b>ортогональны</b> (независимы).</div>
<p><b>Пример:</b> агрегация типов ФАМИЛИЯ, ФАКУЛЬТЕТ, ГРУППА, СТИПЕНДИЯ в тип СТУДЕНТ; СТУДЕНТ — обобщение типов ДНЕВНИК, ВЕЧЕРНИК, ЗАОЧНИК, поэтому последние наследуют признаки.</p>`},
{h:"Формы данных: комплекс, множество, кортеж",html:`
<div class="def"><b>Определение 2.2.6. Множество</b> — собрание правильно идентифицированных объектов, удовлетворяющих условию принадлежности.</div>
<p><b>Свойства множества</b> в классической теории множеств: количество элементов не обязательно фиксировано (может быть бесконечным); на элементах отсутствует какой-либо порядок; элементы-дубликаты не имеют смысла.</p>
<p><b>Операционная семантика</b>: множество реагирует на сообщения <i>добавить: «элемент»</i>, <i>удалить: «элемент»</i>, <i>есть?: «элемент»</i>.</p>
<div class="def"><b>Определение 2.2.7. Комплекс</b> — собрание правильно идентифицированных объектов, удовлетворяющих условию <b>i-принадлежности</b>. Отношение i-принадлежности между элементом x и комплексом Y (x ∈<sub>i</sub> Y) наблюдается тогда и только тогда, когда x находится в i-й позиции комплекса Y.</div>
<p>Комплекс предложен Чайлдсом в <b>теории расширенных множеств</b> (Extended Set Theory), формально учитывающей порядок. В каждой позиции может быть любое (в т. ч. бесконечное) число элементов; в пределах одной позиции порядок не определён; в разных позициях могут быть совпадающие элементы. <b>Аналогия</b> — блок почтовых ящиков в подъезде.</p>
<div class="def"><b>Определение 2.2.8.</b> <b>Множество</b> — это комплекс, все элементы которого находятся в одной (например, первой) позиции. <b>n-местный кортеж</b> — это комплекс, который имеет по одному элементу в каждой позиции от 1 до n.</div>
<div class="tip">Сам комплекс не является структурным понятием ни одной из моделей данных, но способствует правильному восприятию других форм.</div>
<div class="def"><b>Определение 2.2.9. Интенсионал множества</b> (дефиниционное свойство) определяет свойства, общие для всех элементов всех реализаций множества (в математике — условие принадлежности). <b>Экстенсионал множества</b> (репрезентативное свойство) определяет актуальную реализацию множества путём явного указания его элементов.</div>
<p>В условии интенсионала фигурируют сами <b>объекты ПрО</b>, в экстенсионале — <b>знаки</b>, идентифицирующие эти объекты. Пример: интенсионал {a | a — студент, сидящий в 104 ауд.}, экстенсионал {Иванов, Сидоров, Петров, …} — он меняется чуть ли не на каждой паре при неизменном интенсионале.</p>`},
{h:"Домены и атрибуты",html:`
<div class="def"><b>Определение 2.2.10.</b> <b>Домены</b> — однородные множества, из которых черпаются семантически значимые знаки для представления объектов и значений их характеристик.</div>
<p>Однородность бывает:</p>
<ul><li><b>синтаксическая</b> — все элементы удовлетворяют одному синтаксису (домен ЦПЧ, домен строк символов, домен дат);</li>
<li><b>семантическая</b> — в условии принадлежности фигурируют особенности конкретной ПрО (номера телефонов города Томска, даты рождения взрослого населения России, значения характеристики Рост в сантиметрах). Такие домены — подмножества доменов первого типа и предполагают и синтаксическую однородность.</li></ul>
<p>Семантически однородные домены позволяют задавать дополнительные ОЦ на уровне домена и исключают «неразумные» выражения (сравнение Роста с Телефоном).</p>
<div class="def"><b>Определение 2.2.11.</b> <b>Именованные домены, представляющие семантически значимые объекты, называются атрибутами.</b> Атрибуты являются интерпретацией объектов реального мира и их характеристик.</div>
<p><b>Домен — обобщение атрибутов</b>: атрибуты, определённые на общем домене, наследуют его свойства. Атрибуты существуют не сами по себе, а как компоненты других объектов БД: посредством агрегации ассоциируются с другими атрибутами (Фамилия, Адрес, Возраст → агрегат ЛИЧНОСТЬ).</p>
<div class="tip">Слово «домен» в отличие от математики обозначает <b>и область определения, и область значений</b> отображений.</div>`},
{h:"Три определения отношения",html:`
<div class="def"><b>Определение 2.2.12. Математическое отношение</b> — множество, выражающее соответствие между двумя или более множествами. Соответствие между S<sub>1</sub> и S<sub>2</sub> — <b>бинарное отношение</b>, если оно является подмножеством прямого (Декартова) произведения S<sub>1</sub>×S<sub>2</sub>. <b>Порядок элементов кортежа важен.</b> В общем случае R ⊆ S<sub>1</sub>×S<sub>2</sub>×…×S<sub>n</sub> — n-арное отношение.</div>
<p>Пример: S<sub>1</sub>={1,3,8,9}, S<sub>2</sub>={2,3}, R<sub>&lt;</sub>={&lt;1,2&gt;,&lt;1,3&gt;}. Кортеж &lt;1,2&gt; в отношении есть, а &lt;2,1&gt; — нет.</p>
<div class="def"><b>Определение 2.2.13. Интенсионал отношения</b> определяется интенсионалами входящих множеств и общим свойством элементов собственно отношения. <b>Экстенсионал отношения</b> определяет одну из возможных реализаций путём явного указания кортежей.</div>
<div class="def"><b>Определение 2.2.14. (логика)</b> Пусть E<sup>n</sup> = E×…×E — множество всех кортежей. Отображение P : E<sup>n</sup> → {0, 1} называется <b>n-местным отношением (предикатом, логической функцией)</b> над E. Множество A ⊆ E<sup>n</sup> всех кортежей, для которых P = 1, определяет «свойство» кортежей.</div>
<div class="def"><b>Определение 2.2.15. (моделирование данных)</b> Пусть задано множество из n типов или доменов T<sub>i</sub>. Тогда r — <b>отношение</b>, если состоит из двух частей: <b>заголовка</b> (схема, интенсионал отношения) — множества n атрибутов вида A<sub>i</sub> : T<sub>i</sub>, и <b>тела</b> (экстенсионал отношения) — множества m кортежей t, каждый из которых есть множество компонентов вида A<sub>i</sub> : v<sub>i</sub>.</div>
<p><b>Сопоставление определений:</b> человеку ближе определение логики (2.2.14), так как его интересует истинность или ложность факта. В ИС хранят только истинные факты и предполагают <b>гипотезу о замкнутости мира</b> (если кортежа нет в теле отношения — утверждение ложно), поэтому 2.2.12 и 2.2.14 эквивалентны. Определение 2.2.15 отличается от 2.2.12 <b>отсутствием порядка</b> в элементах кортежей, и одно отношение в смысле 2.2.15 соответствует сразу нескольким отношениям в смысле 2.2.12. <b>Именно 2.2.15 используется в базах данных</b> — иначе пришлось бы хранить БРАК и БРАК<sup>-1</sup>, а для отношения степени n — n! перестановок столбцов.</p>
<p>Ещё отличия отношения в моделировании данных от математического: термин применяется к определению <b>агрегированного типа</b> (отношение — тип объектов, соотносящийся с множеством знаков-кортежей); одному интенсионалу в разные моменты времени могут соответствовать разные экстенсионалы; условие попадания кортежа в отношение <b>не может быть выражено формально</b> — это прерогатива человека (главная задача пользователей-«писателей»).</p>`},
{h:"Интерпретация и представление данных",html:`
<p><b>Основной принцип интерпретации:</b> интерпретации наследуются в соответствии с иерархией обобщения. В схеме БД интенсионалы множеств представлены именами типов, которые трактуются как <b>предикаторы</b> (имена) одноместных предикатов-свойств: с типом СТУДЕНТ ассоциируется предикат СТУДЕНТ(x) = Истина, если объект x действительно студент.</p>
<table><tr><th>Модель человека (ПрО)</th><th>Модель данных</th></tr>
<tr><td>Объект</td><td>Кортеж отношения</td></tr>
<tr><td>Тип объектов</td><td>Отношение</td></tr>
<tr><td>Связь</td><td>Кортеж отношения</td></tr>
<tr><td>Тип связей</td><td>Отношение</td></tr>
<tr><td>Характеристика</td><td>Атрибут отношения</td></tr>
<tr><td>Значение характеристики</td><td>Значение атрибута в кортеже</td></tr></table>
<p><b>Представление в виде таблиц:</b> объекты одного типа — отдельная таблица; заголовок таблицы характеризует понятие; строка (кортеж) — конкретный объект; столбец — атрибут. Типы связей тоже представляются таблицами; связи задаются <b>дублированием значений</b> атрибутов объектов — достаточно <b>ключевых атрибутов</b> (ключевой атрибут уникально идентифицирует объект и является его знаком). Данные об объекте приходится дублировать в таблице связей, если у него несколько связей одного типа.</p>
<p><b>Представление в виде графов:</b> граф схемы — <b>граф типов</b>, граф БД — <b>граф знаков</b>. В графе типов именованные вершины — атрибуты и типы объектов; безымянные рёбра, соединяющие атрибуты с типом, — отношение агрегации типов; именованные рёбра — типы связей. В графе знаков вершины — объекты и значения; рёбра, соединяющие значения с объектом, — агрегация знаков; остальные рёбра — связи между объектами (у бинарной связи 2 конца, у связи степени n — n концов). <b>Характерная особенность графового представления — отсутствие каких-либо дубликатов.</b> Часто используют «симбиоз» — граф с вершинами-таблицами.</p>`}
],

exam:[
["Для чего в технологии БД используются знаки и типы?",`<p><b>Знак</b> — это данное (строка символов, число, дата или их агрегат), определяющее конкретный объект, связь объектов или значение характеристики объекта; знаки представляют в знаковой системе сами данные. <b>Тип</b> — именованный класс подобных знаков; <b>имя типа определяет интерпретацию</b> принадлежащих типу знаков. Таким образом, знаки служат для представления фрагментов ПрО в БД, а типы — для задания их интерпретации, единой для множества знаков.</p>`],
["В каких частях системы БД представлены знаки и типы?",`<p><b>Типы</b> представлены в <b>схеме БД</b> (структурный компонент схемы — это определения типов объектов ПрО, типов их связей и их характеристик, образующих взаимосвязанную систему типов). <b>Знаки</b> представлены в <b>самой базе данных</b> (в данных): это строки таблиц, значения атрибутов, вершины графа знаков.</p>`],
["Какие мыслительные процедуры используются при структуризации данных? Уточните, когда применяется каждая из них.",`<p>Используется <b>абстракция</b> в двух видах:</p>
<ul><li><b>Обобщение</b> («есть некоторый», is a): <b>классификация</b> — применяется к знакам, обобщая их до типа (отношение «экземпляр-класс»); <b>генерализация</b> — применяется к типам, обобщая их до типа (отношение «подкласс-суперкласс»).</li>
<li><b>Агрегация</b> («есть часть», part of): объект конструируется из базовых объектов; возможна на уровне знаков (сложный знак из более простых) и на уровне типов (сложный тип из более простых).</li></ul>
<p>Это процедуры <b>синтеза</b> (от частного к общему). К ним есть <b>обратные процедуры анализа</b>: экземпляризация (обратная классификации), специализация (обратная генерализации) и декомпозиция (обратная агрегации).</p>
<p>Агрегация позволяет определить <b>структуру</b> объектов, а обобщение — механизм <b>наследования признаков</b>; иерархии обобщения и агрегации ортогональны (независимы).</p>`],
["Поясните, как абстракции используются для интерпретации данных (знаков).",`<p>Основной принцип: <b>интерпретации наследуются в соответствии с иерархией обобщения</b>. Каждый знак состоит в отношении «есть некоторый» со своим типом, поэтому для него истинно условие принадлежности (интенсионал) множества, в форме которого представлены все знаки этого типа. В схеме БД интенсионалы представлены именами типов, которые можно трактовать как <b>предикаторы</b> одноместных предикатов-свойств: с типом СТУДЕНТ ассоциируется предикат СТУДЕНТ(x), истинный, если объект x действительно студент.</p>
<p>Для сложных знаков-агрегатов и типов-агрегатов механизм работает так же: объект с совокупностью значений характеристик представляется <b>кортежем</b>, набор характеристик объектов одного типа составляет множество <b>атрибутов отношения</b>; имя отношения интерпретирует кортеж, имена атрибутов интерпретируют значения.</p>`],
["Перечислите традиционно используемые в моделях данных формы данных.",`<p><b>Комплекс</b> (корень иерархии, сам структурным понятием моделей не является), его специализации — <b>множество</b> и <b>кортеж</b>; на их основе — <b>домен</b> и <b>отношение</b>; специализация домена — <b>атрибут</b>.</p>`],
["Укажите свойства множеств.",`<ul><li>множества необязательно должны иметь фиксированное количество элементов, они могут быть и бесконечными;</li>
<li>на элементах множества отсутствует какой-либо порядок;</li>
<li>элементы-дубликаты во множестве не имеют смысла.</li></ul>
<p>С точки зрения операционной семантики множество реагирует на сообщения: <i>добавить: «элемент»</i>, <i>удалить: «элемент»</i>, <i>есть?: «элемент»</i>.</p>`],
["Чем отличается комплекс от множества?",`<p>В отличие от множества, элементы комплекса <b>распределены по позициям</b>, определяемым целыми положительными числами (отношение i-принадлежности: x ∈<sub>i</sub> Y, если x находится в i-й позиции комплекса Y). В каждой позиции может быть любое (в т. ч. бесконечное) число различных элементов; в пределах одной позиции порядок не определён; в разных позициях могут быть совпадающие элементы. Множество же — частный случай комплекса, у которого все элементы находятся в одной позиции.</p>`],
["Покажите, что понятия «множество» и «кортеж» являются специализациями понятия «комплекс».",`<p>Согласно определению 2.2.8: <b>множество</b> — это комплекс, все элементы которого находятся в одной (например, первой) позиции — тогда позиции перестают играть роль и остаётся «собрание объектов без порядка». <b>n-местный кортеж</b> — это комплекс, который имеет ровно по одному элементу в каждой позиции от 1 до n — тогда каждой позиции соответствует ровно один элемент, т. е. возникает упорядоченный набор. Оба понятия получаются из комплекса наложением дополнительных ограничений, значит, являются его специализациями.</p>`],
["Дайте определения интенсионала и экстенсионала множества.",`<p><b>Интенсионал множества</b> — дефиниционное свойство: определяет свойства, общие для всех элементов всех реализаций множества (в математике — условие принадлежности). <b>Экстенсионал множества</b> — репрезентативное свойство: определяет актуальную реализацию множества путём явного указания его элементов. В условии интенсионала фигурируют сами объекты ПрО, в экстенсионале — знаки, идентифицирующие эти объекты.</p>`],
["Почему в моделировании данных уместно говорить о нескольких реализациях множества?",`<p>Потому что моделируемые ПрО <b>динамичны</b>: одному и тому же множеству (при неизменном интенсионале) в различные моменты времени могут соответствовать различные экстенсионалы. Пример: множество студентов, сидящих в конкретной аудитории, — его экстенсионал меняется чуть ли не на каждой паре занятий. В абстрактном мире математики это неуместно.</p>`],
["В чём принципиальное отличие элементов, принадлежащих домену и атрибуту?",`<p>Домен — это просто <b>однородное множество</b> знаков (синтаксически или семантически однородное), абстрактное и неинтерпретированное. <b>Атрибут — это именованный домен, представляющий семантически значимые объекты</b>: имя атрибута задаёт <b>интерпретацию</b> его элементов — они представляют конкретные объекты реального мира и их характеристики. Домен является обобщением атрибутов: атрибуты, определённые на общем домене, наследуют его свойства.</p>`],
["Уточните различия определений понятия «отношение» в математике, логике и моделировании данных.",`<p><b>Математика (2.2.12):</b> отношение — множество, выражающее соответствие между множествами, т. е. подмножество прямого (Декартова) произведения; <b>порядок элементов кортежа существен</b>; семантической интерпретации нет.</p>
<p><b>Логика (2.2.14):</b> отношение (предикат, логическая функция) — это отображение P : E<sup>n</sup> → {0,1}; множество A ⊆ E<sup>n</sup> всех кортежей, для которых P = 1, определяет «свойство» кортежей. Человеку это определение ближе, так как его интересует истинность или ложность факта.</p>
<p><b>Моделирование данных (2.2.15):</b> отношение состоит из заголовка (схема, интенсионал — множество атрибутов A<sub>i</sub>:T<sub>i</sub>) и тела (экстенсионал — множество кортежей из компонентов A<sub>i</sub>:v<sub>i</sub>); <b>порядка атрибутов нет</b>; термин применяется к определению агрегированного типа.</p>
<p><b>Сопоставление:</b> в ИС хранят только истинные факты и принимают гипотезу о замкнутости мира, поэтому 2.2.12 и 2.2.14 эквивалентны. Определение 2.2.15 отличается от 2.2.12 отсутствием порядка, и одно отношение в смысле 2.2.15 соответствует сразу нескольким отношениям в смысле 2.2.12; именно поэтому оно используется в БД.</p>`],
["В каком виде задаются в БД интерпретации данных?",`<p>Интерпретации задаются <b>однократно в схеме БД</b> в виде <b>имён типов</b> (имён отношений, категорий) и <b>имён атрибутов</b>, и хранятся на диске вместе с данными. Они сопоставляются с множественными данными и ассоциируются с ними при вводе; при всех манипуляциях эта связь остаётся неразрывной.</p>`],
["Каким формам данных приписываются интерпретации?",`<p>Интерпретации приписываются <b>типам</b>: множествам (их интенсионалы представлены именами типов), <b>отношениям</b> (как типам объектов или типам связей) и <b>атрибутам</b> (именованным доменам). Заданные на уровне типов интерпретации позволяют приписывать семантику отдельным данным и знакам.</p>`],
["Как они используются для интерпретации знаков (данных)?",`<p>По принципу <b>наследования по иерархии обобщения</b>: знак состоит в отношении «есть некоторый» со своим типом, поэтому на него распространяется интенсионал (условие принадлежности) соответствующего множества. Кортеж интерпретируется именем отношения (тип объектов или тип связей), значение в кортеже — именем атрибута; в графовом представлении пунктирные дуги связывают знаки с их типами и указывают, как интерпретировать данные.</p>`],
["Установите соответствие между формами данных и их представлениями в виде таблиц и графов.",`<table><tr><th>Понятие ПрО</th><th>Форма данных</th><th>Таблицы</th><th>Графы</th></tr>
<tr><td>Тип объектов / тип связей</td><td>Отношение</td><td>Таблица (её имя и шапка)</td><td>Именованная вершина графа типов (тип объектов) / именованное ребро (тип связей)</td></tr>
<tr><td>Объект / связь</td><td>Кортеж отношения</td><td>Строка таблицы</td><td>Вершина-объект графа знаков / ребро между вершинами-объектами</td></tr>
<tr><td>Характеристика</td><td>Атрибут отношения</td><td>Столбец таблицы (имя в шапке)</td><td>Именованная вершина-атрибут, соединённая безымянным ребром агрегации с типом объектов</td></tr>
<tr><td>Значение характеристики</td><td>Значение атрибута в кортеже</td><td>Ячейка таблицы</td><td>Вершина-значение графа знаков</td></tr></table>
<p>В таблицах связи задаются <b>дублированием значений ключевых атрибутов</b> (при нескольких связях одного типа данные объекта дублируются); в графах дубликаты отсутствуют вовсе. Часто применяют «симбиоз» — граф с вершинами-таблицами.</p>`]
]},
