id:"m23", num:"2.3", title:"Ограничения целостности", icon:"🔒", tag:"Глава 2",
theory:[
{h:"Что такое ОЦ и зачем они нужны",html:`
<div class="def"><b>Определение 2.3.1. Ограничение целостности (ОЦ)</b> (англ. integrity constraint) можно представлять себе как <b>логическое условие</b>, которое для реализации данного множества, атрибута, отношения или нескольких отношений либо истинно, либо ложно.</div>
<p>Синтаксически ОЦ могут выглядеть как простая декларация фактов, но механизм проверки СУБД всегда использует их как логические условия: его задача — обеспечить, чтобы для <b>любого</b> состояния БД все ОЦ, декларированные в схеме, были истинными.</p>
<p>Особую значимость имеют <b>обобщённые ОЦ</b> — относящиеся к <b>интенсиональным</b> свойствам данных, а не к свойствам конкретной реализации. ОЦ фиксируют в схеме общие закономерности ПрО, которые выполнялись в прошлом, наблюдаются сейчас и будут справедливы в будущем.</p>
<p><b>Две цели введения ОЦ:</b> 1) повышение <b>семантичности</b> модели (адекватность отражения реального мира в схеме); 2) расширение возможностей <b>поддержания целостности</b> (соответствие порождаемых состояний БД требованиям ОЦ).</p>`},
{h:"Классификации способов задания ОЦ",html:`
<p><b>Внутренние и явные ОЦ.</b> <b>Внутренние</b> тесно связаны с правилами структуризации, предполагаются самими формами данных и не требуют дополнительных деклараций (например, отсутствие дубликатов во множестве или отношении); их диапазон весьма узок. <b>Явные</b> ОЦ задаются специальными командами или опциями команд языка СУБД и существенно расширяют возможности передачи закономерностей ПрО.</p>
<div class="tip">Чем больше ограничен диапазон структур данных, на которые ориентирована модель, тем больше видов <b>внутренних</b> ОЦ она предусматривает и тем меньше видов <b>явных</b> ОЦ необходимо и возможно задавать.</div>
<p><b>Декларативные и процедурные ОЦ.</b> <b>Декларативные</b> — декларации свойств данных в командах определения данных или ОЦ; эффективные алгоритмы их проверки реализованы в СУБД и не требуют программирования. <b>Процедурные</b> — программные проверки на языке сервера (триггеры), к ним прибегают при недостаточности выразительных возможностей декларативных ОЦ.</p>
<div class="key"><b>Порядок предпочтительности:</b> 1) декларативные ОЦ → 2) процедурные проверки на сервере (триггеры) → 3) проверки на стороне клиентского приложения (в последнюю очередь). Первые два способа гарантируют верификацию при <b>любых</b> манипуляциях с БД, а клиентские проверки работают, только если пользователь взаимодействует с БД исключительно через это приложение.</div>`},
{h:"Свойства явных ограничений (опр. 2.3.2)",html:`
<p>Пусть C<sub>i</sub> — явное ограничение в схеме S, DBS<sub>k</sub> — состояние БД. Это ограничение будет:</p>
<ol>
<li><b>правильно построено</b>, если соответствует синтаксическим правилам задания ОЦ;</li>
<li><b>удовлетворено состоянием БД</b> DBS<sub>k</sub>, если оно истинно для него;</li>
<li><b>удовлетворяемо</b>, если существует некоторое состояние БД, удовлетворяющее C<sub>i</sub>;</li>
<li><b>недостоверно</b>, если никакое состояние БД не удовлетворяет C<sub>i</sub>;</li>
<li><b>логическим следствием</b> C<sub>1</sub>,…C<sub>n</sub> (т. е. <b>избыточным</b> ограничением), если C<sub>i</sub> удовлетворяют все состояния БД, которые удовлетворяют C<sub>1</sub>,…C<sub>n</sub>;</li>
<li><b>эквивалентно</b> C<sub>j</sub>, если C<sub>i</sub> и C<sub>j</sub> — логические следствия друг друга.</li>
</ol>
<p>Состояние БД <b>удовлетворяет схеме</b>, если удовлетворяет всем её ограничениям. Схема <b>удовлетворяема</b>, если существует состояние БД, удовлетворяющее ей. Схема <b>противоречива</b>, если никакое состояние БД ей не удовлетворяет. <b>Работоспособная схема должна быть удовлетворяема.</b></p>`},
{h:"Типизация ОЦ",html:`
<p>Большинство ОЦ относится к одному из типов:</p>
<ol><li><b>Ограничения на значения атрибутов</b> — область действия: отдельные атрибуты (редко — несколько атрибутов одного отношения). Задают области допустимых значений; разновидностей немного, они просты для понимания и проверки.</li>
<li><b>Ограничения на отображения:</b>
<ul><li><b>а) между атрибутами одного отношения</b> — область действия: одно отношение как агрегат атрибутов;</li>
<li><b>б) между отношениями</b> — охватывают несколько отношений (чаще всего два), отражают закономерности взаимосвязей между кортежами.</li></ul></li></ol>
<div class="key">Все остальные известные ОЦ (<b>ключи</b>, <b>ссылочная целостность</b>, <b>обязательность значения атрибута</b> и многое другое) образуют <b>второй тип</b>. Через понятие отображения можно выразить многие ОЦ, которые раньше выражались только на естественном языке, языке логики предикатов первого порядка или языке программирования.</div>`},
{h:"ОЦ 1-го типа: на значения атрибутов",html:`
<p>Множество допустимых значений атрибутов можно задавать:</p>
<ol>
<li><b>принадлежностью к определённому типу или домену</b> — <code>Рост INTEGER</code></li>
<li><b>сравнением с константой или значением атрибута того же отношения</b> (возможны более сложные выражения) — <code>Рост &gt; 50</code> или <code>Рост &gt; Вес + 110</code></li>
<li><b>диапазоном</b> — <code>Рост BETWEEN 50 AND 300</code></li>
<li><b>перечислением значений</b> — <code>Пол IN {'м', 'ж'}</code></li>
<li><b>более сложным логическим выражением</b>, включающим в виде атомов конструкции 2–4 — <code>(Пол='ж' AND Рост &gt; Вес+110) OR (Пол='м' AND Рост &gt; 180)</code></li>
</ol>
<p>Задача ОЦ первого типа — максимально сузить область допустимых значений и исключить появление недостоверных значений. При этом нельзя забывать об <b>общности</b> ОЦ: им должны удовлетворять <b>все</b> состояния БД.</p>
<div class="tip">ОЦ о принадлежности атрибута типу или домену можно трактовать как <b>структурное определение</b>, <b>внутреннее ОЦ</b> или <b>явное ОЦ</b> — в разных моделях превалируют разные точки зрения. В этом параграфе их трактуют как <b>явные</b>.</div>`},
{h:"Отображение в математике и классификация Кофмана",html:`
<div class="def"><b>Отображение (функция, оператор)</b> есть закон соответствия, сопоставляющий каждому элементу множества A некоторый (единственный) элемент множества B. Запись φ : A → B.</div>
<p>В математике традиции требуют обязательного наличия <b>единственного образа</b> для каждого аргумента (отступление — многозначные функции).</p>
<p><b>Классификация Кофмана</b> (теория нечётких множеств):</p>
<ul>
<li><b>Соответствие Γ</b> между множествами E<sub>1</sub> и E<sub>2</sub> определено, если задан обычный граф G ⊆ E<sub>1</sub>×E<sub>2</sub>. Ограничений нет: у аргумента (прообраза) образа может не быть вовсе или образов может быть произвольное число.</li>
<li><b>Отображение</b> E<sub>1</sub> в E<sub>2</sub> — такое соответствие, которое любому x∈E<sub>1</sub> сопоставляет <b>по крайней мере один</b> y∈E<sub>2</sub>.</li>
<li><b>Функция</b> E<sub>1</sub> в E<sub>2</sub> — такое отображение, которое каждому x∈E<sub>1</sub> сопоставляет <b>один и только один</b> y∈E<sub>2</sub>.</li>
</ul>
<table><tr><th>Классификация Кофмана</th><th>Моделирование данных</th></tr>
<tr><td>Соответствие</td><td>Отображение</td></tr>
<tr><td>Отображение</td><td>Полностью определённое отображение</td></tr>
<tr><td>Функция</td><td>Полное функциональное отображение</td></tr></table>`},
{h:"Семантически значимое отображение",html:`
<p>В моделировании данных сложилась традиция называть <b>самый общий случай соответствия</b> отображением: «Бинарное отношение R множеств S<sub>1</sub> и S<sub>2</sub> определяет два отображения R : S<sub>1</sub>→S<sub>2</sub> и R<sup>-1</sup> : S<sub>2</sub>→S<sub>1</sub>, каждое из которых является обратным по отношению к другому» (Цикритзис и Лоховски). Они же относят SQL к классу языков, основанных на отображениях. Чен в статье по ER-модели говорит о многозначных атрибутах как об <b>атрибутных отображениях</b>.</p>
<div class="def"><b>Определение 2.3.3. Семантически значимое отображение</b> (англ. mapping) — это понятие, определяющее некоторый <b>закон предметной области</b>, по которому каждому объекту моделируемого мира может быть поставлен в соответствие (а может быть, и нет) один или более объектов.</div>
<p>Законы мира объектов представляются в знаковой системе в виде отображений, прообразами и образами которых являются знаки-объекты, знаки-связи и знаки-значения. Эпитет «семантически значимый» дистанцирует нас от абстрактных (математических) отображений и функций.</p>
<ul>
<li><b>Экземпляр отображения φ</b> — каждый факт соответствия по φ одному объекту другого объекта. Все экземпляры одного и того же φ, соответствующие одному объекту-прообразу, называют <b>φ-отображением объекта</b>.</li>
<li><b>Образ</b> (image) объекта x при φ (φ-образ) — объект y, поставленный в соответствие x одним из экземпляров; запись y = φ(x).</li>
<li><b>Прообраз</b> (preimage) — объект x при отображении φ для y.</li>
<li><b>Область φ-образов объекта x</b> — {φ(x)}: может быть пустой (φ неприменимо к x), содержать один объект или много объектов.</li>
</ul>
<table><tr><th>Понятие</th><th>Смысл</th></tr>
<tr><td><b>РООО</b></td><td>реальная область определения отображения — совокупность всех объектов, имеющих образы при φ</td></tr>
<tr><td><b>РОЗО</b></td><td>реальная область значений отображения — совокупность всех φ-образов этих объектов</td></tr>
<tr><td><b>ООО</b> (domain)</td><td>область определения отображения — совокупность объектов, которые в силу смысла закона φ могли иметь в прошлом, имеют в настоящем или смогут иметь в будущем хотя бы один φ-образ</td></tr>
<tr><td><b>ОЗО</b> (codomain)</td><td>область значений отображения — совокупность объектов, которые могли быть, являются или смогут стать φ-образами некоторых объектов</td></tr></table>
<div class="key">Главное отличие отображений объектов реального мира от математических функций — <b>динамичный характер экземпляров</b>: они могут возникать и исчезать, у них могут меняться образы, тогда как y = x² раз и навсегда фиксирует свои экземпляры. Семантика же отображения стабильна, поэтому наряду с динамичными РООО и РОЗО нужны «потенциальные» ООО и ОЗО.</div>
<p><b>Пример:</b> если отображению ДОЧЬ придать юридический смысл, то ООО ДОЧЬ — совокупность всех людей, а ОЗО ДОЧЬ — совокупность всех женщин (ДОЧЬ: ЧЕЛОВЕК → ЖЕНЩИНА).</p>
<p>Отображение РЕБЕНОК эквивалентно <b>инверсии</b> отображения РОДИТЕЛЬ; оба полностью определяются бинарным отношением РОДИТЕЛЬ-РЕБЕНОК. Нотация экземпляра — &lt;образ&gt; = &lt;имя отображения&gt;(&lt;прообраз&gt;), например Саша = ребенок(Сидоров).</p>`},
{h:"Кардинальные числа и типы отображений",html:`
<div class="def"><b>Определение 2.3.4. Кардинальное число</b> (англ. cardinal number) объекта x при отображении φ — обозначение КЧ<sub>φ</sub>(x) — <b>мощность его области образов</b> при этом отображении.</div>
<p>На графе экстенсионала значение КЧ элемента равно количеству инцидентных ему (выходящих из него) дуг экземпляров отображения. Пример: ∀x∈ЧЕЛОВЕК : КЧ<sub>родитель</sub>(x) = 2.</p>
<div class="def"><b>Определение 2.3.5. МинКЧ</b> отображения φ — наименьшее из кардинальных чисел КЧ<sub>φ</sub>(x) объектов x, являющихся экземплярами ООО φ.<br>
<b>Определение 2.3.6. МаксКЧ</b> отображения φ — наибольшее из кардинальных чисел КЧ<sub>φ</sub>(x) объектов x, являющихся экземплярами ООО φ.</div>
<p>Примеры: МинКЧ<sub>родитель</sub> = МаксКЧ<sub>родитель</sub> = 2; МинКЧ<sub>ребенок</sub> = 0, МаксКЧ<sub>ребенок</sub> = ∞ (знак ∞ означает отсутствие ярко выраженной верхней границы).</p>
<div class="key"><b>Определение 2.3.7.</b> Отображение φ называется:<br>
• <b>неограниченным</b>, если МинКЧ = 0, МаксКЧ = ∞;<br>
• <b>полностью определённым</b>, если МинКЧ ≠ 0;<br>
• <b>функциональным</b>, если МаксКЧ = 1, в том числе:<br>
&nbsp;&nbsp;— <b>частичным функциональным</b>, если МинКЧ = 0, МаксКЧ = 1;<br>
&nbsp;&nbsp;— <b>полным функциональным</b>, если МинКЧ = 1, МаксКЧ = 1.</div>
<p><b>Определение 2.3.9.</b> Отображение называется <b>неограниченным</b>, если любой прообраз может или вообще не иметь образа, или иметь произвольное количество образов.</p>
<p><b>Определение 2.3.10.</b> Если для отображения S<sub>1</sub>→S<sub>2</sub> имеем пару КЧ (1, ∞), т. е. каждый объект S<sub>1</sub> отображён по крайней мере в один объект S<sub>2</sub>, отображение называется <b>полностью определённым</b>. Соответствующее ограничение называют <b>ограничением по существованию</b>: для существования объекта в S<sub>1</sub> необходимо, чтобы он был связан с объектом в S<sub>2</sub>. Графически — отсутствие висящих вершин-прообразов. Отображения с МинКЧ = 1 не исчерпывают класс: РОДИТЕЛЬ с МинКЧ = МаксКЧ = 2 тоже полностью определено.</p>
<p><b>Определение 2.3.11.</b> Если МаксКЧ = 1, отображение есть <b>функция</b> в математическом смысле — <b>функциональное отображение</b>: любой объект S<sub>1</sub> отображается не более чем одним объектом S<sub>2</sub>. В графе — не более одной дуги, выходящей из вершины-прообраза.</p>
<p><b>Определение 2.3.12. Частичное функциональное</b> (МинКЧ=0): прообраз может либо не иметь образа, либо иметь не более одного. Пример: РАСПРЕДЕЛЕНИЕ ПО ГРУППАМ (Студент (0,∞) : Группа (0,1)) — студент в академотпуске потерял связь с группой.</p>
<p><b>Определение 2.3.13. Полное функциональное</b> (МинКЧ=1): каждый прообраз должен иметь один и только один образ; из каждого элемента ООО выходит ровно одна дуга. Пример: РОЖДЕНИЕ (Ребенок (0,∞) : Женщина (1,1)) — у каждого ребёнка одна и только одна мать.</p>`},
{h:"Нотации и типы бинарных отношений",html:`
<p><b>Первая (полная) нотация:</b> R(S<sub>1</sub>(0, ∞) : S<sub>2</sub>(0, 1)). Она сообщает: отношение R определено на S<sub>1</sub> и S<sub>2</sub>; запись «S<sub>1</sub>(0, ∞)» означает, что МинКЧ и МаксКЧ отображения <b>S<sub>2</sub>→S<sub>1</sub></b> равны 0 и ∞; «S<sub>2</sub>(0, 1)» — что МинКЧ и МаксКЧ отображения <b>S<sub>1</sub>→S<sub>2</sub></b> равны 0 и 1.</p>
<div class="tip">Правило запоминания: «<b>что считаем, туда и пишем</b>». В ЗАПИСЬ_НА_ЗАНЯТИЯ (СТУДЕНТ (10, 100) : ДИСЦИПЛИНА (4, 6)) числа 10 и 100 относятся к студентам, поэтому пишутся после множества СТУДЕНТ.</div>
<p><b>Определение 2.3.8 (вторая, сокращённая нотация):</b> бинарное отношение, определяющее пару <b>функциональных</b> отображений, есть отношение <b>«один к одному» (1:1)</b>; отношение с одним функциональным и другим нефункциональным отображением — <b>«один ко многим» (1:M)</b> или «многие к одному» (M:1); отношение, определяющее пару <b>нефункциональных</b> отображений, — <b>«многие ко многим» (M:N)</b>.</p>
<p>Вторая нотация используется чаще, но <b>менее информативна</b>: она характеризует лишь МаксКЧ отображений и игнорирует МинКЧ.</p>
<table><tr><th>Пример</th><th>Нотация</th><th>Тип</th></tr>
<tr><td>Занятие (Сотрудник (0,∞) : Студент (0,∞))</td><td>оба неограничены</td><td>M:N</td></tr>
<tr><td>Занятие (Преподаватель (0,∞) : Студент (1,∞))</td><td>S1→S2 полностью определено</td><td>M:N</td></tr>
<tr><td>Распределение по группам (Студент (0,∞) : Группа (0,1))</td><td>частичное функциональное</td><td>M:1</td></tr>
<tr><td>Рождение (Ребенок (0,∞) : Женщина (1,1))</td><td>полное функциональное</td><td>M:1</td></tr>
<tr><td>Совершеннолетие (Человек (0,1) : Паспорт РФ (0,1))</td><td>оба функциональны</td><td>1:1 (взаимнооднозначное)</td></tr></table>
<div class="key">Типы <b>отображений</b> и типы <b>бинарных отношений</b> путать нельзя! Фразы «отображение 1:M» или «функциональное отношение» — <b>вопиющая ошибка</b>, столь же нелепая, как «круглый квадрат».</div>`},
{h:"Сложные отображения",html:`
<div class="def"><b>Определение 2.3.14. Простые отображения</b> — у каждого экземпляра один объект-прообраз и один объект-образ. <b>Сложные отображения</b> — каждый экземпляр имеет более одного объекта-прообраза и/или объекта-образа.</div>
<p><b>Классический пример:</b> «поставка некоторым поставщиком детали для конкретного проекта» — тернарная связь. Три пары взаимообратных отображений:</p>
<ul><li>ПОСТАВЩИК → ДЕТАЛЬ × ПРОЕКТ и ДЕТАЛЬ × ПРОЕКТ → ПОСТАВЩИК</li>
<li>ДЕТАЛЬ → ПОСТАВЩИК × ПРОЕКТ и ПОСТАВЩИК × ПРОЕКТ → ДЕТАЛЬ</li>
<li>ПРОЕКТ → ПОСТАВЩИК × ДЕТАЛЬ и ПОСТАВЩИК × ДЕТАЛЬ → ПРОЕКТ</li></ul>
<p>(× — знак Декартова произведения.)</p>
<div class="tip">Сведение сложных отображений к простым на ранних этапах проектирования (чем грешат многие методики) приводит к <b>невосполнимой потере семантической информации</b>.</div>
<p><b>Пример ПрО «ближайшие родственники»:</b> единственный тип объектов ЧЕЛОВЕК и три отношения — бинарные БРАК и РОДИТЕЛЬ-РЕБЕНОК и тернарное ОТЕЦ-МАТЬ-РЕБЕНОК. Количество концов ребра соответствует степени отношения. У тернарного отношения ролей три, а отображений между типами объектов <b>шесть</b>, и пар (МинКЧ, МаксКЧ) у каждого конца ребра становится две.</p>`},
{h:"ОЦ типа 2А: ключ и обязательность значения",html:`
<p>Любое отношение определяет отображения между атрибутами и является подмножеством Декартова произведения доменов. Многие ОЦ, областью действия которых является отношение, определяются заданием МинКЧ и МаксКЧ отображений между атрибутами.</p>
<div class="def"><b>Определение 2.3.15 (базовое).</b> Если атрибут (группа атрибутов) отношения <b>функционально определяет все другие атрибуты</b> этого отношения, он называется <b>возможным ключом (потенциальным ключом, ключом-кандидатом)</b>. «Функционально определяет» — значит отображения между возможным ключом и любым атрибутом функциональны.</div>
<div class="def"><b>Определение 2.3.16 (следствие).</b> Если атрибут (группа атрибутов) <b>функционально определяет отношение</b>, он называется возможным ключом; т. е. отображение между возможным ключом и самим отношением функционально — возможный ключ уникально идентифицирует кортежи отношения.</div>
<div class="def"><b>Определение 2.3.17 (следствие, опасное).</b> Если атрибут (группа атрибутов) <b>не имеет значений-дубликатов</b> в кортежах отношения, он называется возможным ключом.</div>
<div class="tip"><b>Опасность 2.3.17:</b> анализируется не общий закон ПрО, а конкретный прецедент (экстенсионал). Из того, что сейчас среди Фамилий нет дубликатов, не следует, что атрибут ключевой: в будущем появятся однофамильцы. Лучше использовать первые два определения.</div>
<p>Возможных ключей может быть несколько, но по крайней мере один есть всегда: в крайнем случае его составляют все атрибуты отношения (кортежей-дубликатов быть не может). Если к возможному ключу добавить любые атрибуты, функциональность сохранится — такие группы тоже возможные ключи, но <b>избыточные</b>.</p>
<p><b>Первичный ключ</b> — такой единственный возможный ключ отношения, значения которого являются <b>неизбыточными знаками</b> объектов, представленных кортежами.</p>
<p><b>Неопределённые значения (NULL)</b> используются, когда: либо значение атрибута для кортежа пока не известно, либо данная характеристика неприменима к конкретному объекту и никогда не примет определённого значения.</p>
<div class="def"><b>Определение 2.3.18.</b> Если между <b>первичным ключом</b> отношения и некоторым другим атрибутом этого отношения отображение <b>полностью определено</b> (точнее — полное функциональное), этот атрибут не может иметь неопределённых значений.<br>
<b>Определение 2.3.19 (следствие).</b> Если между <b>отношением</b> и некоторым его атрибутом отображение полностью определено (полное функциональное), этот атрибут не может иметь неопределённых значений.</div>
<p><b>Описатели атрибутов в языках задания ОЦ:</b></p>
<ul><li><code>UNIQUE</code> — для возможных ключей</li>
<li><code>PRIMARY KEY</code> — для первичных ключей</li>
<li><code>NULL</code> — когда возможны неопределённые значения</li>
<li><code>NOT NULL</code> — когда невозможны неопределённые значения</li></ul>
<p>Описатель <code>PRIMARY KEY</code>, как правило, предполагает одновременное действие <code>UNIQUE</code> и <code>NOT NULL</code>. Атрибуты первичного ключа при определении интенсионала часто подчёркивают.</p>`},
{h:"ОЦ типа 2Б: между отношениями (язык БЕТА)",html:`
<p>Для ОЦ типа 2б рассматриваются отображения, ООО и ОЗО которых образуют <b>отношения</b>; они характеризуют закономерности связей между объектами.</p>
<p>Пример схемы: ПРЕПОДАВАТЕЛЬ(<u>№_ПРЕП</u>, ФАМИЛИЯ, …), СТУДЕНТ(<u>№_СТУД</u>, …), ПРЕДМЕТ(<u>№_ПРЕДМ</u>, …), ЭКЗАМЕН(№_ПРЕП, №_СТУД, №_ПРЕДМ, ДАТА, ОЦЕНКА).</p>
<p>На исследовательском языке определения ОЦ <b>БЕТА</b>:</p>
<ul><li><b>ASSERT</b> — привязка значений: <code>ASSERT ЭКЗАМЕН.№_ПРЕП IN ПРЕПОДАВАТЕЛЬ.№_ПРЕП</code>. Означает, что в атрибуте отношения связей не может быть значений, которых нет в атрибуте отношения объектов. Каждое ASSERT <b>неявно задаёт функциональное отображение</b> между отношениями; вместе с NULL/NOT NULL это даёт полную характеристику (частичное или полное функциональное).</li>
<li><b>MAP</b> — явное задание кардинальных чисел: <code>MAP FROM преп IN ПРЕПОДАВАТЕЛЬ TO [0:100] экз IN ЭКЗАМЕН WHERE преп.№_ПРЕП = экз.№_ПРЕП</code>. В квадратных скобках — МинКЧ и МаксКЧ.</li></ul>
<p>Второе утверждение <code>MAP FROM экз IN ЭКЗАМЕН TO [1:1] преп IN ПРЕПОДАВАТЕЛЬ</code> эквивалентно первому ASSERT, если атрибут №_Преп в ЭКЗАМЕН объявлен NOT NULL, поскольку явно констатирует полную функциональность отображения ЭКЗАМЕН → ПРЕПОДАВАТЕЛЬ.</p>
<p>Из декларативных средств SQL к ОЦ этого типа относится понятие <b>внешнего ключа</b>.</p>
<div class="def"><b>Определение 2.3.20. Интенсионал БД</b> — схема БД, включающая определения структур данных и ограничения целостности. <b>Экстенсионал БД</b> — реализации определённых в схеме форм данных: множеств и отношений.</div>`}
],

exam:[
["Что такое ограничение целостности (ОЦ) и для чего они предназначены?",`<p><b>Определение 2.3.1.</b> ОЦ — логическое условие, которое для реализации данного множества, атрибута, отношения или нескольких отношений либо истинно, либо ложно. Механизм проверки СУБД всегда использует ОЦ как логические условия: его задача — обеспечить истинность всех декларированных в схеме ОЦ для <b>любого</b> состояния БД.</p>
<p><b>Назначение — две цели:</b> 1) повышение <b>семантичности</b> модели (адекватность отражения реального мира в схеме); 2) расширение возможностей <b>поддержания целостности данных</b> (соответствие порождаемых состояний БД требованиям ОЦ). Особую значимость имеют обобщённые ОЦ — относящиеся к интенсиональным свойствам данных: они фиксируют закономерности, справедливые в прошлом, настоящем и будущем.</p>`],
["Охарактеризуйте способы задания ОЦ с точки зрения их предпочтительности.",`<ol>
<li><b>Декларативные ОЦ</b> — декларации свойств данных в командах определения данных. Наиболее предпочтительны: эффективные алгоритмы проверки реализованы в СУБД и не требуют дополнительного программирования.</li>
<li><b>Процедурные ОЦ на языке сервера (триггеры)</b> — к ним прибегают при недостаточности выразительных возможностей декларативных ОЦ; язык позволяет алгоритмически выразить любые ОЦ, но по эффективности они уступают аппарату верификации декларативных ОЦ.</li>
<li><b>Программные проверки на стороне клиентского приложения</b> — к ним надо прибегать <b>в последнюю очередь</b>.</li></ol>
<p>Первые два способа гарантируют верификацию состояния БД при любых манипуляциях с ней, тогда как клиентские проверки выполняются, только когда пользователь взаимодействует с БД исключительно через это приложение; при доступе через другие программы они не осуществляются.</p>
<p>Отдельно различают <b>внутренние</b> ОЦ (предполагаются самими формами данных, не требуют деклараций — например, отсутствие дубликатов) и <b>явные</b> (задаются специальными командами). Чем уже диапазон структур модели, тем больше в ней внутренних ОЦ и тем меньше нужно явных.</p>`],
["Какие типы ОЦ выделяются в моделировании данных? Каковы их области действия?",`<ol>
<li><b>Ограничения на значения атрибутов.</b> Область действия — отдельные атрибуты (редко — несколько атрибутов одного отношения). Задают области допустимых значений; их задача — чтобы для каждого кортежа после подстановки значений эти ограничения выполнялись.</li>
<li><b>Ограничения на отображения:</b>
<ul><li><b>а) между атрибутами одного отношения</b> — область действия: одно отношение как агрегат атрибутов (ключи, обязательность значений);</li>
<li><b>б) между отношениями</b> — охватывают несколько отношений (чаще всего два), отражают закономерности взаимосвязей между их кортежами (ссылочная целостность, внешние ключи).</li></ul></li></ol>
<p>Ко второму типу относятся и ключи, и ограничения ссылочной целостности, и обязательность значения атрибута, и многое другое.</p>`],
["Перечислите виды ОЦ на значения атрибутов.",`<ol><li>принадлежностью к определённому типу или домену (<code>Рост INTEGER</code>);</li>
<li>сравнением с константой или значением атрибута того же отношения (<code>Рост &gt; 50</code>, <code>Рост &gt; Вес + 110</code>);</li>
<li>диапазоном (<code>Рост BETWEEN 50 AND 300</code>);</li>
<li>перечислением значений (<code>Пол IN {'м','ж'}</code>);</li>
<li>более сложным логическим выражением, включающим в виде атомов конструкции 2–4.</li></ol>`],
["В чём особенность традиционного определения понятия «отображение» в математике?",`<p>В математике отображение (функция, оператор) — это закон соответствия, сопоставляющий <b>каждому</b> элементу множества A <b>некоторый (единственный)</b> элемент множества B (φ : A → B). Традиции математики требуют <b>обязательного наличия единственного образа для каждого аргумента</b> (отступление от правила — многозначные функции). В теории множеств понятия функции, геометрического отображения, преобразования фигуры объединяются в общее понятие отображения одного множества в другое.</p>`],
["Укажите основные отличия «математического отображения» от «семантически значимого отображения».",`<ul>
<li><b>Общность.</b> Семантически значимое отображение — самый общий случай соответствия (по Кофману): образов у прообраза может не быть вовсе или быть произвольное число. Математическое отображение требует хотя бы одного образа, а функция — ровно одного.</li>
<li><b>Смысл.</b> Семантически значимое отображение определяет <b>закон предметной области</b>; эпитет «семантически значимый» дистанцирует нас от абстрактных математических отображений. Его прообразами и образами являются знаки-объекты, знаки-связи и знаки-значения.</li>
<li><b>Динамичность.</b> Главное отличие — <b>динамичный характер экземпляров</b>: они могут возникать и исчезать, у них могут меняться образы, в то время как функция y = x² раз и навсегда фиксирует свои экземпляры.</li></ul>`],
["Почему в моделировании данных приходится рассматривать реальные и «потенциальные» ООО и ОЗО?",`<p>Потому что <b>экземпляры отображений динамичны</b>, а <b>семантика отображения стабильна</b>. Реальные области (РООО — все объекты, имеющие образы; РОЗО — все их образы) описывают конкретный экстенсионал в данный момент и постоянно меняются. Но ОЦ не должны опираться на конкретный прецедент — они должны носить обобщённый характер и фиксировать сам закон ПрО. Поэтому вводятся «потенциальные» <b>ООО</b> (объекты, которые в силу смысла закона могли иметь в прошлом, имеют в настоящем или смогут иметь в будущем хотя бы один образ) и <b>ОЗО</b> (объекты, которые могли быть, являются или смогут стать образами).</p>`],
["Поясните фразу «бинарное отношение множеств определяет два отображения между ними».",`<p>Бинарное отношение R множеств S<sub>1</sub> и S<sub>2</sub> — это множество пар. Если «поляризовать» множества по полюсам «область определения» — «область значений», получим два отображения: <b>R : S<sub>1</sub> → S<sub>2</sub></b> (S<sub>1</sub> играет роль области определения) и <b>R<sup>-1</sup> : S<sub>2</sub> → S<sub>1</sub></b> (множества меняются ролями). Каждое является <b>обратным</b> по отношению к другому и передаёт ту же самую информацию, только образы становятся прообразами и наоборот. Те же дуги графа, но с соответствующей ориентацией (от прообраза к образу), олицетворяют экземпляры этих отображений. Пример: отношение РОДИТЕЛЬ-РЕБЕНОК полностью определяет отображения РЕБЕНОК и РОДИТЕЛЬ, причём РЕБЕНОК эквивалентно инверсии РОДИТЕЛЯ.</p>`],
["Дайте определения КЧ, МинКЧ и МаксКЧ. К каким элементам относятся эти характеристики?",`<p><b>КЧ<sub>φ</sub>(x)</b> — кардинальное число объекта x при отображении φ — мощность его области образов при этом отображении. Относится к <b>отдельному объекту-прообразу</b> (носит экстенсиональный характер).</p>
<p><b>МинКЧ<sub>φ</sub></b> — наименьшее из кардинальных чисел КЧ<sub>φ</sub>(x) объектов x, являющихся экземплярами ООО φ.</p>
<p><b>МаксКЧ<sub>φ</sub></b> — наибольшее из кардинальных чисел КЧ<sub>φ</sub>(x) объектов x, являющихся экземплярами ООО φ.</p>
<p>МинКЧ и МаксКЧ количественно характеризуют <b>всё отображение в целом</b>, фиксируя особенности самого закона ПрО, а не его прецедентов. Знак «∞» означает отсутствие ярко выраженной верхней границы.</p>`],
["Перечислите и укажите характеристики введённых типов отображений.",`<ul>
<li><b>Неограниченное</b> (0, ∞): любой прообраз может вообще не иметь образа или иметь произвольное количество образов.</li>
<li><b>Полностью определённое</b> (МинКЧ ≠ 0, обычно (1, _)): каждый объект отображён по крайней мере в один объект. Соответствующее ограничение называют <b>ограничением по существованию</b>. В графе нет висящих вершин-прообразов.</li>
<li><b>Функциональное</b> (_, 1): любой объект отображается не более чем одним объектом; в графе из вершины-прообраза выходит не более одной дуги. Частные случаи:
<ul><li><b>частичное функциональное</b> (0, 1) — прообраз либо не имеет образа, либо имеет не более одного;</li>
<li><b>полное функциональное</b> (1, 1) — каждый прообраз имеет один и только один образ; является также специальным случаем полностью определённого отображения.</li></ul></li></ul>
<p>Корень иерархии — понятие «отображение»; его ближайшие потомки — неограниченное, полностью определённое и функциональное.</p>`],
["Какими символическими нотациями можно описать бинарные отношения? Сравните их информативность.",`<p><b>Первая (полная) нотация:</b> R(S<sub>1</sub>(0, ∞) : S<sub>2</sub>(0, 1)). Она сообщает, что отношение R определено на S<sub>1</sub> и S<sub>2</sub>; пара при S<sub>1</sub> задаёт МинКЧ и МаксКЧ отображения S<sub>2</sub>→S<sub>1</sub>, пара при S<sub>2</sub> — МинКЧ и МаксКЧ отображения S<sub>1</sub>→S<sub>2</sub>. Правило: «что считаем, туда и пишем». Нотация даёт <b>исчерпывающую</b> информацию и о самом отношении, и об обоих определяемых им отображениях.</p>
<p><b>Вторая (сокращённая) нотация:</b> 1:1, 1:M (M:1), M:N (определение 2.3.8). Используется чаще, но <b>менее информативна</b>, поскольку характеризует лишь <b>МаксКЧ</b> отображений и игнорирует МинКЧ: например, изменение статуса отображения с неограниченного на полностью определённое тип отношения не меняет.</p>`],
["Укажите отличие сложного отображения от простого отображения.",`<p><b>Простое отображение</b> — у каждого экземпляра есть <b>один</b> объект-прообраз и <b>один</b> объект-образ. <b>Сложное отображение</b> — каждый экземпляр имеет <b>более одного</b> объекта-прообраза и/или объекта-образа (области определения и/или значений являются Декартовыми произведениями множеств). Классический пример — тернарная связь «поставка поставщиком детали для проекта», порождающая три пары взаимообратных сложных отображений. Сведение сложных отображений к простым на ранних этапах проектирования приводит к невосполнимой потере семантической информации.</p>`],
["Дайте три определения возможного ключа.",`<p><b>2.3.15 (базовое).</b> Если атрибут (группа атрибутов) отношения <b>функционально определяет все другие атрибуты</b> этого отношения, он называется возможным (потенциальным) ключом, ключом-кандидатом.</p>
<p><b>2.3.16 (следствие).</b> Если атрибут (группа атрибутов) отношения <b>функционально определяет отношение</b>, он называется возможным ключом, т. е. возможный ключ уникально идентифицирует кортежи отношения.</p>
<p><b>2.3.17 (следствие).</b> Если атрибут (группа атрибутов) отношения <b>не имеет значений-дубликатов</b> в кортежах отношения, он называется возможным ключом. Это определение опасно: анализируется не общий закон ПрО, а конкретный прецедент (экстенсионал), поэтому лучше пользоваться первыми двумя.</p>`],
["Что означает «определённость значения атрибута»?",`<p>Это значит, что атрибут имеет <b>конкретное (не неопределённое, не NULL) значение</b> в кортеже. Неопределённые значения (NULL) используются, когда: либо значение атрибута для кортежа пока не известно, либо характеристика неприменима к объекту и никогда не примет определённого значения. Иногда законы ПрО требуют обязательного наличия определённого значения в каждом кортеже — тогда задаётся описатель <code>NOT NULL</code>. В частности, первичный ключ в каждом кортеже должен иметь определённое уникальное значение, иначе его значения не смогут быть знаками объектов.</p>`],
["Какие особенности каких отображений скрываются в определении возможного ключа и обязательности значений атрибута?",`<p><b>Возможный ключ:</b> за ним стоит <b>функциональность</b> (МаксКЧ = 1) отображений между возможным ключом и любым другим атрибутом отношения (а в определении-следствии — между ключом и самим отношением). Роль РООО играет атрибут-ключ, роль ООО — его домен, роли РОЗО — другие атрибуты.</p>
<p><b>Обязательность значения атрибута:</b> за ней стоит <b>полная определённость</b>, а точнее — <b>полное функциональное</b> отображение (МинКЧ = МаксКЧ = 1) между первичным ключом отношения (или самим отношением) и этим атрибутом: определения 2.3.18 и 2.3.19.</p>
<p>Такой взгляд на ключ и на недопустимость неопределённых значений с точки зрения ограниченных отображений практически никогда не встречается в публикациях — чаще определения даются «на пальцах».</p>`],
["Что ассоциируется с понятиями «интенсионал БД» и «экстенсионал БД»?",`<p><b>Определение 2.3.20.</b> <b>Интенсионал БД</b> представляет собой <b>схему БД</b>, включающую определения структур данных и ограничения целостности. <b>Экстенсионал БД</b> составляют <b>реализации</b> определённых в схеме БД форм данных — множеств и отношений (т. е. сами данные).</p>`]
]},

/* ============================ 2.4 ============================ */
{
id:"m24", num:"2.4", title:"Операции", icon:"⚙️", tag:"Глава 2",
theory:[
{h:"Операция над данными и состояние БД",html:`
<p>Правила (G) применяются к спецификации <b>статических</b> свойств данных, а их <b>динамика</b> выражается с помощью операций.</p>
<p>Не все операции меняют экстенсионал БД (извлечение информации его не меняет). Но динамику системы БД можно связать и с такими операциями, введя дополнительные объекты — <b>индикаторы текущих</b> и другие <b>управляющие элементы</b>. Эти объекты в строгом смысле не относятся к объектам БД, но связаны с ней и совместно с реализацией данных определяют <b>состояние БД</b>.</p>
<p><b>Пример:</b> команда «дать следующую строку» не меняет реализацию БД, но состояние БД изменится, так как изменится значение индикатора текущей.</p>
<div class="def"><b>Определение 2.4.1.</b> <b>Операции над данными</b>, выражаемые средствами языка манипулирования данными, переводят БД из состояния DBS<sub>i</sub> в состояние DBS<sub>i+1</sub> (или в неопределённое состояние), причём изменение состояния происходит или при изменении реализации данных, или при изменении управляющих элементов.</div>
<p>Каждое состояние БД должно соответствовать её схеме: выполнение операций не должно приводить к нарушению свойств данных, отражённых в схеме. Если действие нарушает ОЦ, попытка отвергается, система временно переходит в <b>неопределённое состояние</b>, пользователю передаётся сообщение (текст или код ошибки), после чего БД возвращается в состояние до начала ошибочной операции. Сообщения об ошибках также относятся к управляющим элементам, входящим в <b>расширенное состояние БД</b>.</p>`},
{h:"Действия и селекция",html:`
<div class="def"><b>Определение 2.4.2.</b> Операции обычно задаются в терминах <b>селекции</b> и <b>действия</b>. <b>Действие</b> определяет характер операции, а <b>селекция</b> — критерий отбора данных, над которыми должно быть произведено действие.</div>
<p>Объектом операции должна быть <b>ограниченная часть БД</b>: это удобно пользователям и ограничивает число обращений к внешней памяти. Ограничение достигается селекцией, которая осуществляется вне зависимости от того, какая операция реализуется.</p>
<div class="def"><b>Определение 2.4.3. Пять основных видов действий над данными:</b><br>
а) <b>установка текущих</b> — SET CURRENCY, FIND;<br>
б) <b>включение</b> (добавление новых элементов данных) — INSERT, ADD;<br>
в) <b>обновление</b> (модификация существующих элементов) — UPDATE, MODIFY;<br>
г) <b>удаление</b> (исключение элементов данных) — DELETE, REMOVE;<br>
д) <b>выборка</b> (получение данных из БД) — SELECT, GET.</div>
<p><b>Четыре</b> действия (включение, обновление, удаление, выборка) <b>необходимы</b> в ЯМД любой СУБД: без включения невозможно создать экстенсионал БД, обновление и удаление отражают динамику ПрО, выборка решает основную задачу систем БД. Лишь <b>установка текущих не является необходимой</b> и встречается не во всех языках СУБД.</p>
<div class="def"><b>Определение 2.4.4. Селекция</b> может осуществляться посредством:<br>
а) <b>логической позиции в БД</b> — селекция по текущей;<br>
б) <b>значений данных</b> — селекция по данным;<br>
в) <b>связей между данными</b> — селекция по связям.</div>
<ul>
<li><b>По текущей:</b> FIRST, LAST, NEXT, PREVIOUS или n-й элемент. <code>SET CURRENCY TO NEXT СТУДЕНТ</code>, либо подразумеваемое другим действием <code>GET NEXT СТУДЕНТ</code>. Порядок может быть фиксированным или произвольным (хронологическим, по последовательности включения, по операционным свойствам) — тогда он контролируется СУБД, а не пользователем.</li>
<li><b>По данным:</b> условие на значения атрибутов вида «&lt;имя атрибута&gt; &lt;операция сравнения&gt; &lt;значение&gt;». <code>GET СТУДЕНТ WHERE Пол = 'ж'</code>; сложные критерии — с AND, OR, NOT: <code>GET СТУДЕНТ WHERE Пол = 'ж' AND Стипендия ≠ 0</code>.</li>
<li><b>По связям:</b> в соответствии с логическими связями между данными. <code>GET СТУДЕНТ WHERE СТУДЕНТ.Фамилия = АВТОМОБИЛЬ.Фамилия владельца</code>.</li>
<li><b>Комбинированный способ:</b> <code>GET NEXT СТУДЕНТ WHERE Пол = 'ж' AND СТУДЕНТ.Фамилия = АВТОМОБИЛЬ.Фамилия владельца</code>.</li></ul>`},
{h:"Навигационные и спецификационные операции и языки",html:`
<div class="def"><b>Определение 2.4.5.</b> Существенный признак различения — <b>характер результата единичной директивы селекции</b>. Если результат всегда представлен <b>единственным элементом</b> (значение атрибута, кортеж, сущность, связь), полученным при прохождении по логическому пути (при навигации) в структуре БД, операции называются <b>навигационными</b>. Если операции специфицируют как бы новую <b>подсхему</b>, которой в общем случае соответствует <b>множество элементов</b>, — они называются <b>спецификационными</b>.</div>
<p>Язык, все операции которого навигационные, — <b>навигационный язык</b>; все операции спецификационные — <b>спецификационный язык</b>. Встречаются языки, имеющие и те, и другие операции.</p>
<p><b>Пример запроса</b> «Выдать фамилии студентов факультета информатики» при схеме ФАКУЛЬТЕТ(<u>№ФАК</u>, НАЗВАНИЕ), ГРУППА(<u>№ГРУППЫ</u>, №ФАК), СТУДЕНТ(ФАМИЛИЯ, №ГРУППЫ):</p>
<p><b>Навигационный язык:</b> FIND ФАКУЛЬТЕТ WHERE НАЗВАНИЕ = 'ФАКУЛЬТЕТ ИНФОРМАТИКИ'; FIND FIRST ГРУППА…; цикл по группам; GET FIRST СТУДЕНТ…; цикл по студентам с печатью ФАМИЛИИ; GET NEXT СТУДЕНТ…; FIND NEXT ГРУППА…</p>
<p><b>Спецификационный язык:</b> <code>SELECT ФАМИЛИЯ FROM ФАКУЛЬТЕТ, ГРУППА, СТУДЕНТ WHERE ФАКУЛЬТЕТ.№ФАК = ГРУППА.№ФАК AND ГРУППА.№ГРУППЫ = СТУДЕНТ.№ГРУППЫ AND НАЗВАНИЕ = 'ФАКУЛЬТЕТ ИНФОРМАТИКИ'</code> — одна-единственная команда, результат — таблица с одним столбцом.</p>
<div class="key"><b>Особенности запросов на навигационном языке:</b><br>
• они всегда представляют собой <b>программу</b>;<br>
• для их формулировки требуется язык программирования с <b>условными конструкциями и циклами</b>;<br>
• в них обязательно используется <b>селекция по текущей</b>;<br>
• для них необходимо <b>действие установки текущих</b>.</div>
<p>Понятие текущей — одно из основных в навигации; в спецификационных операциях текущие на пользовательском уровне не видны. Отметим: только для кортежей СТУДЕНТ выполняется действие выборки (GET), в остальных случаях достаточно установки текущей (FIND). Среди спецификационных языков есть и процедурные.</p>`},
{h:"Процедуры базы данных",html:`
<p>Рассмотренные операции следуют схеме «селекция — действие», но есть потребность в операциях по другим схемам или с более глобальными функциями (например, процедурный механизм поддержания целостности, проверяющий большое число элементов данных и не укладывающийся в локальную схему манипулирования).</p>
<div class="def"><b>Определение 2.4.6. Процедура базы данных</b> — последовательность операций, выполняемых при определённых условиях. Общность этих условий обеспечивает возможность автоматического, без вмешательства пользователя, инициирования процедур. Процедура посредством информации состояния «уведомляет» систему и пользователя об успешном или неуспешном завершении.</div>
<p>Процедуры БД <b>специфицируются в схеме</b> и состоят из трёх разделов: <b>условие</b> (проверка достоверности предпосылок действия), <b>действие</b>, <b>уведомление</b> (что передаёт процедура при возврате управления и/или условие возврата). Хранятся и выполняются <b>на сервере</b>.</p>
<p><b>Виды процедур БД:</b></p>
<ol>
<li><b>Функции агрегирования</b> — вычисление значений, не хранящихся в БД: суммы, подсчёт числа экземпляров, минимум и максимум. Во многих моделях являются конструкциями языка данных.</li>
<li><b>Виртуальные атрибуты</b> — любая процедура БД, вычисляющая значение атрибута (например, возраст по текущей дате и дате рождения). Обладает теми же свойствами, что и любой атрибут, но с ним могут быть связаны побочные эффекты и особые ситуации.</li>
<li><b>Триггеры целостности</b> — процедуры для проверки и/или поддержки ОЦ. Не вырабатывают значений данных, а только «уведомляют» систему или принудительно возвращают БД в целостное состояние.</li>
<li><b>Триггеры безопасности</b> — обеспечение контроля над доступом: анализ данных, проверка полномочий и аутентичности пользователя, выработка сообщений для пользователя, журнала или ответственного лица.</li>
<li><b>Операторы доступа</b> — расширение языка данных операциями, первоначально не предусмотренными (сортировка перед выдачей результата, удаление кортежей-дубликатов).</li>
<li><b>Триггеры, запускаемые включением, удалением или обновлением</b> (прикладные триггеры, DML) — инициируются модификацией одних данных и выполняют косвенные модификации других (каскадное удаление связанных кортежей).</li>
<li><b>Системные триггеры</b> — запускаемые другими событиями в БД.</li>
<li><b>Процедуры администратора БД</b> — сбор статистики и другие функции администрирования; не изменяют данные, но могут модифицировать состояние БД.</li>
</ol>
<div class="key"><b>Шесть отличий процедур БД от операций:</b> 1) не следуют схеме «селекция — действие»; 2) их действия могут захватывать весьма большую область БД; 3) с ними может быть связан ряд побочных эффектов, зависящих от данных; 4) их вызовы не выполняются пользователем; 5) они могут реализовать широкий круг действий; 6) они обычно описываются в схеме, тогда как операции включаются в пользовательскую программу.</div>`}
],

exam:[
["Дайте определение «расширенного» состояния БД.",`<p>Текущее состояние БД определяется совокупностью значений хранящихся данных, а также значениями <b>управляющих элементов</b> — индикаторов текущих, сообщений об ошибках и т. п. Эти объекты в строгом смысле не относятся к объектам БД, но связаны с ней и могут изменяться в результате выполнения операций; совместно с конкретной реализацией данных они определяют <b>расширенное состояние БД</b>. Пример: операция «дать следующую строку» не меняет реализацию БД, но состояние изменится, так как изменится значение индикатора текущей.</p>`],
["Что такое операция над данными?",`<p><b>Определение 2.4.1.</b> Операции над данными, выражаемые средствами языка манипулирования данными, переводят БД из состояния DBS<sub>i</sub> в состояние DBS<sub>i+1</sub> (или в неопределённое состояние), причём изменение состояния происходит или при изменении реализации данных, или при изменении управляющих элементов. Каждое состояние БД должно соответствовать её схеме — выполнение операций не должно нарушать свойств данных, отражённых в схеме.</p>`],
["Какие два компонента можно выделить в любой операции над данными?",`<p><b>Определение 2.4.2.</b> <b>Действие</b> — определяет характер операции. <b>Селекция</b> — критерий отбора данных, над которыми должно быть произведено действие. Селекция обеспечивает, чтобы объектом операции была ограниченная часть БД: это удобно пользователям и ограничивает число обращений к внешней памяти.</p>`],
["Какие действия над данными предусмотрены в технологии БД?",`<p><b>Определение 2.4.3 — пять основных видов:</b></p>
<ol><li><b>установка текущих</b> — SET CURRENCY, FIND;</li>
<li><b>включение</b> (добавление новых элементов данных в БД) — INSERT, ADD;</li>
<li><b>обновление</b> (модификация существующих элементов) — UPDATE, MODIFY;</li>
<li><b>удаление</b> (исключение элементов данных из БД) — DELETE, REMOVE;</li>
<li><b>выборка</b> (получение данных из БД) — SELECT, GET.</li></ol>
<p>Четыре из них (включение, обновление, удаление, выборка) необходимы в ЯМД любой СУБД; установка текущих необязательна и встречается не во всех языках.</p>`],
["Какими способами можно селектировать данные для выполнения тех или иных действий с ними?",`<p><b>Определение 2.4.4:</b></p>
<ul><li><b>по логической позиции в БД — селекция по текущей</b>: FIRST, LAST, NEXT, PREVIOUS, n-й элемент (<code>SET CURRENCY TO NEXT СТУДЕНТ</code>, <code>GET NEXT СТУДЕНТ</code>);</li>
<li><b>по значениям данных — селекция по данным</b>: условие вида «&lt;имя атрибута&gt; &lt;операция сравнения&gt; &lt;значение&gt;», возможны сложные условия с AND, OR, NOT (<code>GET СТУДЕНТ WHERE Пол = 'ж'</code>);</li>
<li><b>по связям между данными — селекция по связям</b> (<code>GET СТУДЕНТ WHERE СТУДЕНТ.Фамилия = АВТОМОБИЛЬ.Фамилия владельца</code>).</li></ul>
<p>Возможны комбинации всех трёх видов: <code>GET NEXT СТУДЕНТ WHERE Пол = 'ж' AND СТУДЕНТ.Фамилия = АВТОМОБИЛЬ.Фамилия владельца</code>.</p>`],
["Какие два класса операций и языков манипулирования данными выделяются в технологии БД? Каковы их особенности?",`<p><b>Определение 2.4.5.</b> Признак различения — характер результата единичной директивы селекции.</p>
<p><b>Навигационные операции</b> — результат всегда представлен единственным элементом (значение атрибута, кортеж, сущность, связь), полученным при прохождении по логическому пути (навигации) в структуре БД. Язык, все операции которого навигационные, — <b>навигационный язык</b>. Особенности запросов: они всегда представляют собой программу; требуется язык программирования с условными конструкциями и циклами; обязательно используется селекция по текущей; необходимо действие установки текущих. Понятие текущей — одно из основных в навигации.</p>
<p><b>Спецификационные операции</b> — специфицируют как бы новую подсхему, определяемую на схеме БД, которой в общем случае соответствует множество элементов, существующих в БД. Язык — <b>спецификационный</b> (пример — SQL: одна команда SELECT вместо целой программы). Текущие на пользовательском уровне не видны, селекция по текущей не используется. Среди спецификационных языков есть и процедурные.</p>
<p>Встречаются языки, имеющие как те, так и другие операции.</p>`],
["Что такое процедура БД?",`<p><b>Определение 2.4.6.</b> Процедура базы данных — последовательность операций, выполняемых при определённых условиях. Общность этих условий обеспечивает возможность автоматического, без вмешательства пользователя, инициирования процедур. Действия могут быть весьма разнообразны и не ограничиваться частью БД. Процедура посредством информации состояния «уведомляет» систему и пользователя об успешном или неуспешном завершении. Процедуры специфицируются в схеме, хранятся и выполняются на сервере и состоят из трёх разделов: <b>условия</b>, <b>действия</b> и <b>уведомления</b>.</p>
<p><b>Отличия от операций:</b> 1) не следуют схеме «селекция — действие»; 2) действия могут захватывать большую область БД; 3) возможны побочные эффекты, зависящие от данных; 4) вызовы не выполняются пользователем; 5) реализуют широкий круг действий; 6) описываются в схеме, а не в пользовательской программе.</p>`],
["Какие виды процедур БД вам известны?",`<ol>
<li><b>Функции агрегирования</b> и другие функции и процедуры общего назначения — вычисление сумм, подсчёт числа экземпляров, определение минимума и максимума.</li>
<li><b>Виртуальные атрибуты</b> — процедуры, вычисляющие значение атрибута (возраст по текущей дате и дате рождения).</li>
<li><b>Триггеры целостности</b> — проверка и/или поддержка ОЦ; не вырабатывают значений данных, а уведомляют систему или принудительно возвращают БД в целостное состояние.</li>
<li><b>Триггеры безопасности</b> — контроль над доступом: анализ данных, проверка полномочий и аутентичности пользователя, сообщения пользователю, в журнал или ответственному лицу.</li>
<li><b>Операторы доступа</b> — расширение языка данных операциями, первоначально не предусмотренными (сортировка, удаление кортежей-дубликатов).</li>
<li><b>Триггеры БД, запускаемые операциями DML</b> (INSERT, UPDATE, DELETE) — прикладные триггеры, выполняющие косвенные модификации других данных.</li>
<li><b>Триггеры БД, запускаемые другими событиями</b> — системные триггеры.</li>
<li><b>Процедуры администратора БД</b> — сбор статистики и другие функции администрирования; не изменяют данные, но могут модифицировать состояние БД.</li></ol>`]
]},

{h:"Типы объектов медицинской ПрО",html:`
<p>Эта ПрО касается некоторых аспектов функционирования больниц и используется далее для иллюстрации концепций всех моделей данных. В круглых скобках после названия характеристики иногда приводится её краткое наименование.</p>

<tr><td><b>ВРАЧ-ПАЦИЕНТ</b></td><td>ВРАЧ, ПАЦИЕНТ</td><td>M:N</td><td>—</td></tr>

<tr><td><b>ОБРАБОТКА АНАЛИЗА</b></td><td>ЛАБОРАТОРИЯ, АНАЛИЗ</td><td>1:M</td><td>—</td></tr></table>`},
{h:"Семантика связей (что нужно понимать)",html:`
<ul>
<li><b>БОЛЬНИЦА</b> связана с ПАЛАТА, ВРАЧ и ЛАБОРАТОРИЯ. <b>БОЛЬНИЧНАЯ ПАЛАТА</b> определяет палаты стационаров; <b>ШТАТНЫЙ ВРАЧ</b> описывает вхождение врача в штат больницы; <b>БОЛЬНИЦА-ЛАБОРАТОРИЯ</b> специфицирует отношения больниц с лабораториями, имеющими <b>не утратившие силу разрешения</b> на проведение анализов для пациентов больниц.</li>
<li><b>ПАЛАТА</b> принадлежит только одной больнице, а больница может иметь несколько палат. ПЕРСОНАЛ ПАЛАТЫ — распределение персонала по палатам; РАЗМЕЩЕНИЕ — размещение пациентов в палатах.</li>
<li><b>ПЕРСОНАЛ</b>: функциональность отображения в ПАЛАТЫ означает, что каждый служащий обслуживает <b>не более чем одну палату</b>.</li>
<li><b>ВРАЧ</b>: функциональность отображения в БОЛЬНИЦЫ означает, что каждый врач может состоять в штате <b>не более чем одной больницы</b>. Обобщённый характер связи ВРАЧ-ПАЦИЕНТ подразумевает все возможные виды связей — консультации, посылку на анализы, постановку диагноза, лечение в стационаре; наличие связи говорит, что где-то по какому-то поводу они контактировали.</li>
<li><b>ПАЦИЕНТ</b> не может одновременно лежать в нескольких палатах — отображение функционально. С врачами (универсальный тип связей) может иметь связи с несколькими. Анализов и диагнозов у пациента может быть несколько.</li>
<li><b>ДИАГНОЗ</b> определяет каждую конкретную болезнь <b>одного</b> пациента, поэтому отображение ДИАГНОЗ → ПАЦИЕНТ функционально.</li>
<li><b>ЛАБОРАТОРИЯ</b>: одна лаборатория может обслуживать несколько больниц, а больница — пользоваться услугами нескольких лабораторий (M:N). Отображение АНАЛИЗ → ЛАБОРАТОРИЯ функционально: один анализ обрабатывается целиком в одной лаборатории.</li>
<li><b>АНАЛИЗ</b> ассоциируется с одним направлением на анализы и одной порцией материалов, полученных у одного пациента. Оба его отображения (в ПАЦИЕНТ и в ЛАБОРАТОРИЯ) функциональны.</li>
</ul>`}

{
id:"m31", num:"3.1", title:"Принципы семантического моделирования", icon:"🧠", tag:"Глава 3",
theory:[
{h:"Зачем понадобилось семантическое моделирование",html:`
<p>Семантическое моделирование стало предметом интенсивных исследований с <b>конца 70-х годов</b>. Побудительный мотив: системы БД обладают <b>весьма ограниченными сведениями о смысле</b> хранящихся в них данных — чаще всего они знают, как обращаться с данными определённых простых типов, и понимают простейшие ОЦ. Любая более сложная интерпретация возлагается на пользователя или специализированные программы.</p>
<p>СУБД-ориентированные модели не лишены семантических аспектов: <b>домены, возможные и внешние ключи</b> — примеры семантических аспектов реляционной модели. Разрабатывались и «расширенные» модели (например, расширенная реляционная модель <b>RM/T</b>), которые, тем не менее, несут лишь незначительно большую смысловую нагрузку.</p>
<div class="key">Задача представления смысла данных <b>не имеет окончательного решения</b>; можно ожидать непрекращающегося прогресса по мере углубления понимания проблем.</div>
<p>Идеи семантического моделирования полезны как средство <b>проектирования БД</b> даже при отсутствии их непосредственной поддержки в СУБД — на их основе предложено несколько методик и технологий проектирования.</p>`},
{h:"Четыре этапа семантического моделирования по Дейту",html:`
<ol>
<li><b>Выявление неформальных семантических концепций (понятий)</b> человеческого восприятия и осмысления объектов окружающего мира — множество понятий, полезных при неформальном обсуждении реального мира. <b>Этот этап неформальный</b>, следующие — достаточно формальны.</li>
<li><b>Синтез формальных понятий модели</b>, которые могут использоваться для представления в системе реальных объектов определённых ранее семантических концепций в виде формальных объектов.</li>
<li><b>Определение набора формальных правил для задания ограничений целостности</b>, предназначенных для переноса законов окружающего мира в систему формальных объектов.</li>
<li><b>Определение набора формальных операторов</b> для манипулирования формальными объектами.</li>
</ol>
<div class="tip">С точки зрения проектирования БД <b>операторы — менее важная часть</b> модели по сравнению с объектами и правилами целостности.</div>`},
{h:"Модель человеческого восприятия и проблема триализма",html:`
<p>В философии и логике сложилась естественная модель человеческого восприятия мира: люди без проблем выделяют многочисленные <b>предметы</b> и строят их абстракции в контексте тех или иных <b>понятий</b>. Сами понятия о предметах тоже являются предметами мысли, но абстрактными, обобщающими реальные предметы.</p>
<div class="def">Всё, что можно сказать о предмете, называют его <b>признаками</b>. Признаком может быть наличие или отсутствие у предмета того или иного качества — <b>свойства</b>, <b>значения характеристики</b> или <b>отношения</b> предмета к другим предметам.</div>
<div class="key">Одно и то же явление реального мира может рассматриваться одними людьми в качестве <b>предмета</b>, другими — в качестве <b>характеристики</b>, третьими — в качестве <b>связи</b>. Одна из целей семантического моделирования — <b>поддержка такой гибкости интерпретации</b>.</div>
<p><b>Идеальная семантическая модель</b> должна быть близка по своей концепции человеческому мировосприятию и не сковывать его потребности в описании семантики моделируемого мира.</p>
<p>В главе рассматриваются две семантические модели: <b>«Сущность-Связь» (ER)</b> — занимает главенствующее положение в этом классе, и <b>«Сущность-Связь-Отображение» (ERM)</b> — творческое развитие первой.</p>`}
],

{
id:"m32", num:"3.2", title:"ER-модель «Сущность-Связь»", icon:"🔗", tag:"Глава 3",
theory:[
{h:"3.2.1 Структуры: сущность, связь, роль",html:`
<div class="def"><b>Определение 3.2.1. Сущность</b> (англ. entity) — абстрактное представление единичного объекта ПрО. Абстракция строится на основании некоторого <b>понятия</b> о предметах, существенного с точки зрения задач ПрО. Любое понятие характеризуется <b>содержанием</b> (условием, истинность которого говорит, что объект подпадает под это понятие) и <b>объёмом</b> (классом объектов, удовлетворяющих условию содержания). Каждое понятие определяет своё <b>множество сущностей</b> (entity set), интенсионалом которого является содержание понятия, а экстенсионалом — его объём.</div>
<div class="def"><b>Определение 3.2.2. Связь</b> (англ. relationship) — единичный экземпляр отношения (в философско-логическом смысле) между сущностями. <b>Множество связей</b> (relationship set) можно рассматривать как математическое отношение, определённое в общем случае на n множествах сущностей, а связь — как кортеж этого отношения с n элементами-сущностями. Для множества связей используется не понятие о предметах, а понятие об <b>n-ках предметов</b>.</div>
<div class="def"><b>Определение 3.2.3. Роль</b> (англ. role) — функция, общую для всех сущностей этой роли, которую каждая сущность играет в связи. Указание ролей делает соблюдение порядка сущностей необязательным: вместо кортежей в смысле математики используются множества пар «роль : сущность».</div>
<div class="def"><b>Определение 3.2.4.</b> Информацию об объекте или взаимоотношении получают наблюдением или измерением характеристик и выражают множеством пар «<b>атрибут — значение</b>». Значения классифицируются в <b>множества значений</b> (value set) — то, что в других моделях называют доменом.</div>
<div class="def"><b>Определение 3.2.5. Атрибут</b> (англ. attribute) в ER-модели формально определяется как <b>отображение</b>, ставящее в соответствие сущностям или связям одиночные значения или кортежи значений. ООО — множество сущностей или связей; ОЗО — множество значений или Декартово произведение множеств значений. Отображение <b>не обязано быть функциональным</b> — тогда говорят о <b>многозначных атрибутах</b>.</div>
<div class="key"><b>Типы (схема БД):</b> множества сущностей, множества связей, роли, множества значений, атрибуты. <b>Знаки (данные):</b> сущности, связи и значения. В ER-модели для связывания сущностей используются не значения атрибутов (как в реляционной модели), а <b>специальные уникальные указатели</b> — это присуще всем моделям, кроме реляционной.</div>
<p>Свойства и характеристики в ER-модели представляются одинаково — атрибутами; у свойств просто фиксирована ОЗО — множество истинностных значений (Истина и Ложь).</p>`},
{h:"ER-диаграмма: правила построения",html:`
<p>Схема БД — <b>граф</b>, вершинами которого являются множества сущностей, множества связей и множества значений:</p>
<ul>
<li><b>множества сущностей — прямоугольники</b>;</li>
<li><b>множества связей — ромбы</b>;</li>
<li><b>множества значений — овалы</b>;</li>
<li>имена множеств указываются внутри фигур;</li>
<li><b>неориентированные рёбра</b> соответствуют ролям множеств сущностей во множестве связей и соединяют эти множества; помечаются именами ролей по необходимости;</li>
<li><b>ориентированные дуги</b> представляют атрибутные отображения: выходят из множества сущностей или связей и входят в одно или несколько множеств значений (дуга может разделяться на несколько концов); <b>дуги всегда помечаются именами атрибутов</b>.</li>
</ul>
<p>Часто множества значений и атрибуты на ER-диаграмме <b>не показывают</b>, вынося их в текстовый синтаксис (как в параграфе 2.5) — иначе диаграмма перегружается.</p>
<p><b>Информативность схемы</b> — способность построенной по ней БД предоставлять ту или иную информацию. Пример: в медицинской ПрО между ПАЦИЕНТ и БОЛЬНИЦА видны три пути — через ПАЛАТА (стационар, где он лежит), через ВРАЧ (больницы, в штате которых числятся его врачи), через АНАЛИЗ и ЛАБОРАТОРИЯ (больницы, обслуживаемые лабораториями, обрабатывавшими его анализы).</p>`},
{h:"Проблема триализма и разновидности связей",html:`
<p><b>Триализм</b> — наличие трёх форм представления явления моделируемого мира. Брак между людьми можно мыслить как:</p>
<ol>
<li><b>атрибут</b> множества сущностей ЧЕЛОВЕК (Замужем/Женат? со значениями Истина/Ложь) — если достаточно знать, состоит человек в браке или нет;</li>
<li><b>множество связей</b> БРАК (роли Муж, Жена) — если интересует, с кем конкретно заключён брак; характеристики связи можно добавить, не меняя формы;</li>
<li><b>множество сущностей</b> БРАК — если нужно представлять связи браков с другими явлениями (например, РОЖДЕНИЕ В БРАКЕ). В связи могут вступать <b>только сущности</b>, поэтому роли Муж и Жена трансформируются в множества связей МУЖ В БРАКЕ и ЖЕНА В БРАКЕ.</li>
</ol>
<p>Варианты перечислены в <b>порядке возрастания функциональности и информативности</b>. Но это не значит, что все явления нужно трактовать как сущности.</p>
<div class="tip"><b>Бинаризация</b> — сведение структур данных к множествам знаков и исключительно бинарным отношениям. На первый взгляд упрощает проектирование, но <b>скрадывает важную семантику ПрО, невосполнимую на последующих этапах</b>.</div>
<p><b>Разновидности множеств связей:</b></p>
<ul><li><b>рекурсивные</b> — не все множества сущностей различны: УПРАВЛЕНИЕ (Начальник, Подчинённый) на СЛУЖАЩИЙ; РОЖДЕНИЕ (Родитель, Ребёнок) на ЧЕЛОВЕК; рекурсивное <b>тернарное</b> РОЖДЕНИЕ (Отец, Мать, Ребёнок). Именно здесь особенно актуальны пометки именами ролей;</li>
<li><b>несколько множеств связей между одними и теми же множествами сущностей</b>: вместо обобщённого ВРАЧ-ПАЦИЕНТ — НАПРАВЛЕНИЕ НА АНАЛИЗ и ПОСТАНОВКА ДИАГНОЗА (тернарные), КОНСУЛЬТАЦИЯ и ЛЕЧАЩИЙ ВРАЧ (бинарные). Такая схема информативнее: она отвечает на вопрос «какой врач послал пациента на конкретный анализ?».</li></ul>`},
{h:"Метасхема ER-модели",html:`
<p><b>Метасхема</b> — это ER-диаграмма, предметной областью которой является <b>идеальный мир самой ER-модели</b>. По ней строится <b>репозиторий</b> — специализированная БД CASE-инструмента, в которой хранятся проектируемые ER-схемы приложений.</p>
<ul><li>множества сущностей — представлены в виде множества сущностей;</li>
<li>множества связей — в виде множества сущностей;</li>
<li>множества значений — в виде множества сущностей;</li>
<li>роли — в виде множества сущностей;</li>
<li>атрибуты множеств сущностей и множеств связей — в виде <b>множеств связей</b>.</li></ul>
<p>Также множеством связей АГРЕГАЦИЯ представлены взаимосвязи «часть-целое» между множествами значений; два неподписанных множества связей имеют смысл «играть роль» и «иметь роль».</p>
<div class="tip">Когда рассматривается метасхема, <b>данными</b> становятся элементы конкретных ER-схем приложений (сами множества сущностей, связей, роли, атрибуты — как экземпляры-сущности репозитория).</div>`},
{h:"3.2.2 ОЦ: на значения атрибутов и ключи",html:`
<p><b>ОЦ на значения атрибутов</b> задаются в текстовой нотации на языке <b>исчисления предикатов первого порядка</b> с переменными, пробегающими по множествам сущностей или связей; для атрибутных отображений используется <b>функциональная форма</b>. Если квантор явно не указан, предполагается квантор всеобщности ∀:</p>
<p><code>∀e ∈ ЧЕЛОВЕК (Рост(e) &gt; 50 AND Рост(e) &lt; 300)</code></p>
<ol><li>указанием соответствующего множества значений: <code>Фамилия: ПАЦИЕНТ → Строки</code>;</li>
<li>сравнением с константой или значением атрибута: <code>Назначенное время(a) &lt; 24</code>;</li>
<li>перечислением значений: <code>Пол(a) ∈ {'м','ж'}</code>;</li>
<li>более сложным логическим выражением из конструкций 2–3.</li></ol>
<p>Область действия ОЦ первого типа — как правило, одно множество сущностей или связей.</p>
<div class="def"><b>Определение 3.2.6. Ключ сущности</b> (англ. entity key) — группа атрибутов, такая, что отношение между множеством сущностей и Декартовым произведением соответствующих множеств значений есть отношение типа <b>1:1</b> или <b>1:M</b> (для многозначных атрибутов). В обоих случаях требуется <b>функциональность отображения во множество сущностей</b>.</div>
<p>Объявляется описателем <b>KEY</b>; в текстовой нотации ключи могут подчёркиваться. Наличие ключа <b>не обязательно</b>; ключей может быть несколько.</p>
<div class="key"><b>Почему в ER-модели неуместен первичный ключ:</b> у сущностей есть <b>уникальные внутрисистемные указатели</b>, с помощью которых происходит идентификация сущностей в БД и реализуются связи между ними, поэтому теряется основное назначение первичных ключей — идентификация объектов БД при их взаимодействии между собой.</div>
<p>ОЦ о недопустимости неопределённых значений в публикациях по ER-модели <b>не упоминаются</b>; при желании пробел восполняется введением соответствующих описателей.</p>`},
{h:"Уникальная идентификация связей (опр. 3.2.7)",html:`
<p><b>Множества связей также могут иметь ключи связей</b> (relationship key). Возможны <b>три способа</b> уникальной идентификации связей:</p>
<ol>
<li><b>только по сущностям, в ней участвующим</b> (одной, нескольким или всем);</li>
<li><b>по сущностям и значениям</b> одного или нескольких атрибутов множества связей;</li>
<li><b>только по значениям</b> одного или нескольких атрибутов множества связей.</li>
</ol>
<table><tr><th>Пример</th><th>Способ</th></tr>
<tr><td>ВРАЧ-ПАЦИЕНТ — нужны сущности обоих множеств</td><td>1 (все сущности)</td></tr>
<tr><td>АНАЛИЗ ПАЦИЕНТА — достаточно сущности типа АНАЛИЗ (отображение АНАЛИЗ → ПАЦИЕНТ функционально)</td><td>1 (одна сущность)</td></tr>
<tr><td>РАЗМЕЩЕНИЕ — сущность ПАЦИЕНТ; или ПАЛАТА + значение атрибута Номер койки</td><td>1 и 2</td></tr>
<tr><td>БРАК (в БД ЗАГС, тип M:N) — сущность ЧЕЛОВЕК + Дата регистрации брака</td><td>2</td></tr>
<tr><td>БРАК — Серия и номер свидетельства</td><td>3</td></tr></table>`},
{h:"ОЦ на отображения между множествами сущностей. E- и ID-зависимости",html:`
<p>Бинарное множество связей определяет <b>пару отображений</b>; полная определённость говорит о наличии <b>зависимости существования</b>, а сочетание функциональных и нефункциональных свойств определяет тип — 1:1, 1:M, M:1, M:N.</p>
<p>Для множеств связей степени больше двух применяется аппарат <b>сложных отображений</b>. Пример тернарного НАПРАВЛЕНИЕ НА АНАЛИЗ (ВРАЧ, АНАЛИЗ, ПАЦИЕНТ) — шесть отображений: ВРАЧ→АНАЛИЗ×ПАЦИЕНТ (0,∞); АНАЛИЗ×ПАЦИЕНТ→ВРАЧ (0,1); АНАЛИЗ→ВРАЧ×ПАЦИЕНТ (1,1); ВРАЧ×ПАЦИЕНТ→АНАЛИЗ (0,∞); ПАЦИЕНТ→АНАЛИЗ×ВРАЧ (0,∞); АНАЛИЗ×ВРАЧ→ПАЦИЕНТ (0,1).</p>
<div class="def"><b>Определение 3.2.8.</b> ER-модель позволяет явно представить ограничение по существованию — <b>зависимость существования (E-зависимость)</b>. Зависимое множество сущностей называется <b>множеством слабых сущностей</b> (weak entity set), а ассоциированное с ним множество связей — <b>множеством слабых связей</b> (weak relationship set). Остальные — <b>множества регулярных сущностей</b> и <b>регулярных связей</b>.</div>
<p>В демонстрационной ПрО полностью определены отображения: ПАЛАТА→БОЛЬНИЦА, ДИАГНОЗ→ПАЦИЕНТ, АНАЛИЗ→ПАЦИЕНТ, АНАЛИЗ→ЛАБОРАТОРИЯ. Значит, слабые сущности: ПАЛАТА (в контексте БОЛЬНИЧНАЯ ПАЛАТА), ДИАГНОЗ (ДИАГНОЗ ПАЦИЕНТА), АНАЛИЗ (АНАЛИЗ ПАЦИЕНТА и ОБРАБОТКА АНАЛИЗА). При этом ПАЛАТА в контексте ПЕРСОНАЛ ПАЛАТЫ — <b>регулярное</b> множество сущностей.</p>
<div class="def"><b>Определение 3.2.9. Зависимость по идентификации (ID-зависимость)</b> — частный случай зависимости существования: сущности зависимого множества не просто обязаны иметь связи с сущностями другого множества, но и <b>не могут быть идентифицированы без них</b>. Пример: ПАЛАТА ID-зависима от БОЛЬНИЦА в контексте БОЛЬНИЧНАЯ ПАЛАТА — ключей среди атрибутов ПАЛАТЫ нет, но сущность идентифицируется комбинацией сущности БОЛЬНИЦА и значения Номер палаты.</div>
<p><b>ID-зависимость одновременно является зависимостью существования; обратное не обязательно.</b></p>
<p><b>Обозначения на ER-диаграмме:</b> МаксКЧ отображений указываются пометками на рёбрах ролей (буквы M, N, P означают ∞). Зависимость существования: множество слабых сущностей — прямоугольник <b>двойными линиями</b>, в ромбе слабых связей метка <b>E</b>, стрелка указывает на зависимое множество. ID-зависимость — так же, но в ромбе метка <b>ID</b>.</p>
<p><b>Пометки для связей степени &gt; 2:</b> одной пометки недостаточно; для тернарного случая достаточно по две пометки на разных концах рёбер. Рекомендуется по две пометки на ребре: одна (возле множества связей) — для отображения, <b>определяемого ролью</b>, другая (ближе к множеству сущностей) — для отображения, <b>определяющего роль</b>. Если ограничиваются одной пометкой, указывают МаксКЧ отображения, <b>определяющего роль</b> (как в бинарном случае).</p>`},
{h:"3.2.3 Операции: навигационный язык и CABLE",html:`
<p>Операции — наименее актуальный компонент семантической модели: эти модели применяются при <b>проектировании схемы</b>, БД в них не создаются (ни одна семантическая модель не реализована ни в одной СУБД). Первоначальные публикации по ER-модели не содержали спецификаций языка данных.</p>
<p><b>Синтезированный навигационный язык (15 операций):</b> 1–3 создание/изменение/удаление сущностей; 4–6 создание/изменение/удаление связей; 7–14 селекция сущности или связи по указателю текущей, по текущей и данным, по текущей и связям, по текущей + данным + связям; 15 выборка значений атрибутов для текущей сущности или связи.</p>
<p>Значения самостоятельной ценности не имеют, поэтому достаточно указателей текущих <b>сущностей и связей</b>; нужна возможность неоднократного одновременного их определения для параллельных независимых сканирований.</p>
<div class="def"><b>CABLE</b> (ChAin Based LanguagE) — «язык, основанный на цепочках» — спецификационный язык ER-модели. Акцент на выборке данных; используется концепция <b>цепочек (путей)</b>, включающих множества сущностей и связей. Элемент запроса — <b>бусинка</b>: &lt;Множество сущностей | Множество связей&gt; [.] [&lt;Условие&gt;]. Каждая бусинка задаёт точку маршрута и/или элементарный критерий селекции.</div>
<p>Все компоненты бусинки необязательны: имя множества можно опустить, если имена атрибутов уникальны; если условия нет — множество нужно для однозначной идентификации пути; бусинку можно вообще опустить, если селекции по данным нет и проблема выбора пути не стоит.</p>
<p>При переходе к следующей точке маршрута выполняется <b>селекция по связям</b>, затем к полученному подмножеству применяется условие (<b>селекция по данным</b>).</p>
<p>Запрос может быть не только линейным маршрутом, но и <b>деревом</b>: листья — исходные множества, корень — целевое; в вершинах слияния выполняются <b>теоретико-множественные операции</b> объединения, пересечения или разности.</p>
<p><b>Примеры:</b><br>
1) <code>OUTPUT ВРАЧ.Фамилия SELECT ВРАЧ.Специальность = 'окулист'</code><br>
2) <code>OUTPUT ПАЦИЕНТ.Фамилия SELECT БОЛЬНИЦА.Название='Святая Елена' / ПАЛАТА</code><br>
3) пересечение двух ветвей: (БОЛЬНИЦА → БОЛЬНИЧНАЯ ПАЛАТА → ПАЛАТА → РАЗМЕЩЕНИЕ → ПАЦИЕНТ) ∩ (ЛАБОРАТОРИЯ → ОБРАБОТКА АНАЛИЗА → АНАЛИЗ → АНАЛИЗ ПАЦИЕНТА → ПАЦИЕНТ), далее ПАЦИЕНТ → ВРАЧ-ПАЦИЕНТ → ВРАЧ.</p>`},
{h:"3.2.4 Назначение ER-модели и критерии качества",html:`
<div class="key"><b>Два критерия качества семантической модели:</b><br>
1. Модель должна обладать достаточной <b>общностью и ясностью</b>, чтобы в ней можно было легко представить любые явления и законы моделируемого мира.<br>
2. <b>Разрыв между этой моделью и моделями, реализуемыми в СУБД, не должен быть большим</b>; желательно иметь максимально формальные правила преобразования структур и ОЦ из одной модели в другую.</div>
<p>Модели вида «Сущность-Связь» отвечают задачам анализа и проектирования; они помогают аналитикам контактировать и с пользователями, и с проектировщиками.</p>
<p><b>Цель исследований</b> — довести семантическую методику проектирования до идеала, при котором выявление и полная формализация семантики ПрО осуществляется человеком <b>один раз</b> на первом этапе (анализе ПрО). Дальнейший перевод может происходить: вручную по фиксированным правилам; полностью автоматически CASE-инструментом; в ходе человеко-машинной процедуры под управлением CASE-системы.</p>`},
{h:"3.2.5 EER-модель: специализация и категоризация",html:`
<p><b>Общая схема модификаций:</b><br>
ER-модель Чена <b>+ специализации и категоризации</b> = <b>EER-модель</b> (Enhanced ER);<br>
EER-модель <b>− множества связей степени &gt; 2, − атрибуты множеств связей, − многозначные атрибуты, − атрибутные отображения в Декартово произведение</b> = <b>ER-модель Баркера</b> (Oracle Designer);<br>
ER-модель Баркера <b>− бинарные множества связей типа M:N, − представление связей внутрисистемными указателями</b> (надо дублировать атрибуты) = <b>ER-модель IDEF1X</b> (ERwin).</p>
<div class="def"><b>Определение 3.2.10. Специализация</b> — <b>нисходящий</b> подход к определению множества суперклассов и связанных с ними подклассов.<br>
<b>Определение 3.2.11. Генерализация</b> — <b>восходящий</b> подход (противоположный специализации), позволяющий создать обобщённый суперкласс на основе различных исходных подклассов.</div>
<p>Суперклассы и подклассы исключают дублирование определения общих атрибутов и типов связей: определения выносятся на уровень суперкласса и <b>наследуются</b> подклассами. Подкласс тоже является множеством сущностей и может иметь свои подклассы. Возможно <b>множественное наследование</b> (у подкласса несколько суперклассов в разных специализациях). Каждый объект, представленный сущностью подкласса, обязан иметь и сущность суперкласса; обратное не обязательно.</p>
<div class="def"><b>Определение 3.2.12. Категория</b> (category) — подкласс, включающий сразу несколько разных суперклассов, причём каждая сущность подкласса соответствует лишь одной сущности одного из суперклассов. Процесс порождения — <b>категоризация</b>. Подкласс категории обладает <b>выборочным наследованием</b> (selective inheritance): каждая сущность наследует атрибуты и типы связей только одного суперкласса.</div>
<div class="tip">Не путать категоризацию с множественным наследованием, при котором наследование идёт от <b>всех</b> суперклассов!</div>
<p><b>Ограничения (опр. 3.2.13, 3.2.14):</b></p>
<ul><li><b>Ограничение непересечения</b> (disjoint constraint): если подклассы специализации не пересекаются — каждый объект представлен сущностью только одного подкласса; если пересекаются — может быть представлен сущностями сразу нескольких.</li>
<li><b>Ограничение участия</b> (participation constraint): <b>полное</b> — каждый объект-суперкласс должен быть представлен сущностью хотя бы одного подкласса; <b>частичное</b> — не обязательно.</li></ul>
<p>Свойства независимы, поэтому есть 4 комбинации: полные пересекающиеся; частичные пересекающиеся; полные непересекающиеся; частичные непересекающиеся.</p>
<p>Категоризация тоже детализируется участием: при <b>полном</b> участии каждый объект всех суперклассов должен быть представлен сущностью категории, при <b>частичном</b> — не обязательно.</p>
<p><b>Метасхема EER-модели</b> отличается от метасхемы ER-модели появлением множеств сущностей СПЕЦИАЛИЗАЦИЯ и КАТЕГОРИЗАЦИЯ и множеств связей СУПЕРКЛАСС и ПОДКЛАСС между ними и множеством сущностей МНОЖЕСТВО СУЩНОСТЕЙ. Отличие в КЧ: множество сущностей может многократно участвовать в разных специализациях (и как суперкласс, и как подкласс), а <b>категорией может быть лишь однажды</b>.</p>`},
{h:"Нотация Баркера (Oracle Designer)",html:`
<p>По сравнению с EER-моделью в ней <b>отсутствуют</b>: множества связей степени больше двух; атрибуты множеств связей; многозначные атрибуты; атрибутные отображения в Декартово произведение множеств значений.</p>
<p><b>Технические решения, которые вынужден принимать проектировщик:</b></p>
<ul>
<li><b>связь степени n</b> → вспомогательное множество сущностей и n бинарных множеств связей; одно из отображений каждого (для которого новое множество — ООО) будет полным функциональным;</li>
<li><b>атрибуты множества связей</b> → универсально: замена множества связей множеством сущностей и бинарными связями (однозначные атрибуты становятся атрибутами нового множества сущностей); другое решение — добавить атрибуты в то множество сущностей, роль которого определяет функциональное отображение (идеально, если оно полно);</li>
<li><b>многозначный атрибут</b> → самостоятельное множество сущностей с атрибутом для значений и бинарное множество связей типа M:1 с владельцем;</li>
<li><b>атрибутные отображения в Декартово произведение</b> → элементарные атрибуты и/или атрибуты-агрегаты.</li>
</ul>
<p><b>Графическая нотация:</b> бинарная связь — ребро с двумя концами (по одной роли на конец):</p>
<ul><li><b>пунктирная линия</b> из множества сущностей — сущности регулярны (МинКЧ = 0);</li>
<li><b>сплошная линия</b> — сущности слабые (МинКЧ = 1);</li>
<li><b>одиночный конец</b> у множества сущностей — ОЗО функционального отображения (МаксКЧ = 1);</li>
<li><b>вилочкообразный («воронья лапка») конец</b> — ОЗО нефункционального отображения (МаксКЧ = ∞);</li>
<li><b>«|»</b> (поперечный штрих) — ID-зависимость;</li>
<li><b>«◊»</b> (ромбик) — конец связи <b>неперемещаемый</b> (например, нельзя менять указатель на врача в связи ШТАТНЫЙ ВРАЧ).</li></ul>
<p>Множества сущностей — <b>прямоугольники с закруглёнными углами</b> с именем и атрибутами. Слева от имён атрибутов: <b>«#»</b> — участвует в уникальной идентификации; <b>«*»</b> — обязательный (NOT NULL); <b>«○»</b> — необязательный (NULL).</p>
<p><b>Специализации</b> (категоризаций нет): допустимы только <b>полные и непересекающиеся</b>; изображаются вложенными прямоугольниками подклассов внутри прямоугольника суперкласса; каждое множество сущностей может лишь однажды выступить как в роли суперкласса, так и в роли подкласса (но может совмещать обе роли).</p>
<div class="tip">Сложность нотации Баркера: информация о количественных характеристиках <b>одного</b> отображения разбросана по <b>разным концам</b> ребра. Для ПАЛАТА → БОЛЬНИЦА (полное функциональное) МинКЧ=1 показан сплошной линией у ПАЛАТЫ, а МаксКЧ=1 — одиночным концом у БОЛЬНИЦЫ.</div>`},
{h:"Правила Oracle Designer и нотация IDEF1X",html:`
<p><b>Правила преобразования «ER-схема в нотации Баркера → реляционная схема»</b> (их применяет преобразователь схемы Oracle Designer):</p>
<ul>
<li>каждое множество сущностей порождает <b>отношение</b>;</li>
<li>атрибуты множества сущностей переносятся в отношение;</li>
<li>если у множества сущностей не было ключей среди естественных атрибутов, система генерирует <b>суррогатный ключ</b> (имя = имя отношения + суффикс «_ID»);</li>
<li>множества связей типа <b>1:1 и 1:M</b> реализуются <b>дублированием ключей и объявлением внешних ключей</b>;</li>
<li>множества связей типа <b>M:N</b> порождают <b>дополнительное отношение и пару внешних ключей</b> в нём.</li>
</ul>
<p>Другой компонент (генератор БД) передаёт схему из репозитория конкретной СУБД на языке SQL и создаёт объекты БД на диске.</p>
<p><b>Нотация IDEF1X</b> (Design/IDEF, ERwin) — к изъятиям Баркера добавляются требования:</p>
<ul><li>бинарные множества связей типа <b>M:N</b> необходимо сводить <b>вручную</b> к дополнительному множеству сущностей и паре множеств связей типа 1:M;</li>
<li>необходимо <b>дублировать первичные ключи</b> множеств сущностей (формируя внешние ключи) для представления связей типа 1:M — то есть отказаться от внутрисистемных указателей и явно оперировать первичными и внешними ключами.</li></ul>
<p>Эти требования фактически превращают ER-модель в нотации IDEF1X в <b>реляционную модель</b>.</p>
<div class="key"><b>Основной недостаток моделей Баркера и IDEF1X:</b> они предлагают бедный язык описания семантики ПрО и уже на начальной фазе формализации вынуждают человека принимать «чисто технические» решения. Хуже того, эти решения приходится заново анализировать в реляционной схеме, иначе получится не самая эффективная схема БД. Развитие ER-модели шло по пути резкой потери качества по <b>первому</b> критерию и всё лучшего удовлетворения <b>второго</b>.</div>`}
],
