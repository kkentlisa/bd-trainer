exam:[
["Каковы основные структурные понятия реляционной модели данных?",`<p><b>Тип данных</b> — полностью аналогичен понятию типа данных в языках программирования (символьные, числовые, битовые строки, «деньги», темпоральные данные).</p>
<p><b>Домен</b> — множество допустимых значений; задаётся базовым типом данных и логическим выражением; интуитивно — допустимое потенциальное множество значений данного типа. Семантическая нагрузка: данные сравнимы, только если относятся к одному домену. В большинстве РСУБД домены не используются.</p>
<p><b>Атрибут</b> — именованный домен (столбец); <b>схема отношения</b> — именованное множество пар «имя атрибута, имя домена», её мощность — степень («арность»).</p>
<p><b>Кортеж</b> — множество пар «имя атрибута, значение», содержащее одно вхождение каждого имени атрибута схемы (набор именованных значений заданных типов).</p>
<p><b>Отношение</b> — множество кортежей, соответствующих одной схеме отношения (заголовок = схема = интенсионал; тело = множество кортежей = экстенсионал).</p>
<p><b>Схема БД</b> — набор именованных схем отношений; <b>реляционная БД</b> — набор отношений, имена которых совпадают с именами схем отношений в схеме БД.</p>`],
["Перечислите простейшие правила перехода от ER-схемы к реляционной схеме БД.",`<ol>
<li>Каждое <b>множество сущностей</b> представляется самостоятельным отношением; однозначные атрибуты становятся атрибутами отношения; ключи множества сущностей — возможными ключами отношения; при необходимости в качестве первичного ключа используется суррогатный атрибут.</li>
<li>Бинарные множества связей типа <b>1:1 или 1:M без атрибутов</b> представляются дублированием первичного ключа 1-отношения в M-отношение (для 1:1 выбор M-отношения произволен).</li>
<li>Бинарные множества связей типа <b>M:N без атрибутов</b> представляются самостоятельными отношениями, куда дублируются первичные ключи отношений, построенных для множеств сущностей.</li>
<li>Множества связей <b>с атрибутами</b> представляются самостоятельными отношениями, куда дублируются первичные ключи; однозначные атрибуты множества связей становятся атрибутами этого отношения.</li>
<li>Множества связей <b>степени больше 2</b> представляются самостоятельными отношениями, куда дублируются первичные ключи; однозначные атрибуты связей становятся атрибутами отношения (число ключевых атрибутов равно степени связи).</li>
<li>Каждый <b>многозначный атрибут множества сущностей</b> представляется отдельным отношением, куда дублируется первичный ключ отношения множества сущностей; второй атрибут — для значения.</li>
<li>Каждый <b>многозначный атрибут множества связей</b> представляется отдельным отношением, куда дублируется первичный ключ отношения множества связей; второй атрибут — для значения.</li></ol>`],
["Что такое представление (view)?",`<p><b>Определение 4.2.1.8.</b> Представление — динамический результат одной или нескольких реляционных операций над базовыми отношениями с целью создания некоторого иного отношения. Это <b>виртуальное (производное) отношение</b>, экстенсионал которого не хранится на диске, а динамически воспроизводится на основании одного или нескольких <b>базовых отношений</b> (отношений, кортежи которых физически хранятся в БД, — опр. 4.2.1.7).</p>
<p>Для пользователя представление — постоянно существующее отношение, с которым работают как с базовым; его можно определять и на основе других представлений. Любые операции над представлением автоматически транслируются в операции над отношениями, на основании которых оно создано. Представления <b>динамичны</b>: изменения в базовых отношениях немедленно отражаются на содержимом представления.</p>`],
["Перечислите конструкции языка SQL, связанные с ограничениями целостности.",`<ul>
<li><b>NOT NULL</b> — запрещает столбцу принимать значение NULL; <b>NULL</b> (по умолчанию) — разрешает.</li>
<li><b>UNIQUE</b> — определяет потенциальный ключ.</li>
<li><b>PRIMARY KEY</b> — определяет первичный ключ (предполагает UNIQUE и NOT NULL).</li>
<li><b>CHECK (condition)</b> — условие, которому должны удовлетворять все строки таблицы.</li>
<li><b>FOREIGN KEY … REFERENCES</b> (references_clause) — ограничение ссылочной целостности с конструкцией <b>ON DELETE</b> (по умолчанию — запрет удаления, <b>CASCADE</b> — каскадное удаление, <b>SET NULL</b> — замена на NULL).</li>
<li><b>CONSTRAINT constraint_name</b> — уникальное имя ограничения (если опущено, используется системное имя).</li>
<li>Различают <b>inline_constraint</b> (на уровне столбца) и <b>out_of_line_constraint</b> (на уровне таблицы, позволяет использовать группы столбцов).</li>
<li>Процедурное задание — <b>CREATE TRIGGER</b> (триггеры целостности).</li></ul>`],
["Что такое неопределённое значение?",`<p><b>Определение 4.2.2.1.</b> Неопределённое значение (NULL) указывает, что значение атрибута в настоящий момент <b>неизвестно или неприемлемо</b> для этого кортежа; это способ обработки неполных или необычных данных. NULL не принадлежит никакому типу данных и может присутствовать среди значений любого атрибута, если это явно не запрещено.</p>
<p>По определению: <code>a op NULL = NULL</code>, <code>NULL op a = NULL</code>, <code>a lop NULL = unknown</code>, <code>NULL lop a = unknown</code>, где unknown — третье значение булевского типа (NOT unknown = unknown; true AND unknown = unknown; true OR unknown = true; false AND unknown = false; false OR unknown = unknown).</p>
<p>NULL — не нулевое численное значение и не строка пробелов: нули и пробелы являются значениями, а NULL обозначает <b>отсутствие</b> значения, поэтому термин «значение NULL» можно употреблять лишь с оговорками. Использование NULL спорно: Кодд считает его составной частью модели, другие специалисты — преждевременным включением.</p>`],
["Охарактеризуйте требование целостности сущностей и требование целостности по ссылкам.",`<p><b>Целостность сущностей.</b> Объекту реального мира соответствует кортеж отношения. Требование: любой кортеж любого отношения должен быть отличим от любого другого кортежа этого отношения, т. е. <b>любое отношение должно обладать первичным ключом</b>. Отсюда формулировка: <b>в базовом отношении ни один атрибут первичного ключа не может содержать NULL</b> — иначе это означало бы, что не все его атрибуты необходимы для уникальной идентификации, что противоречит определению первичного ключа как минимального идентификатора. Требование автоматически удовлетворяется, если не нарушаются базовые свойства отношений.</p>
<p><b>Целостность по ссылкам (ссылочная целостность).</b> При нормализации сложные сущности представляются несколькими кортежами нескольких отношений, связанных по значениям ключей. Требование: если в отношении существует <b>внешний ключ</b>, то его значение должно либо соответствовать значению потенциального (как правило, первичного) ключа некоторого кортежа в его базовом отношении, либо внешний ключ должен полностью состоять из значений NULL.</p>
<p>Дополнительно выделяют <b>корпоративные ограничения целостности</b> — дополнительные правила, определяемые пользователями или администраторами БД.</p>`],
["Дайте определения всем вариантам реляционных ключей.",`<ul>
<li><b>Суперключ (4.2.2.2)</b> — атрибут или множество атрибутов, которое единственным образом идентифицирует кортеж данного отношения; может содержать дополнительные атрибуты, необязательные для идентификации.</li>
<li><b>Потенциальный ключ (4.2.2.3)</b> — суперключ, который не содержит подмножества, также являющегося суперключом данного отношения. Свойства: <b>уникальность</b> и <b>неприводимость</b>. Если состоит из нескольких атрибутов — <b>составной ключ</b>.</li>
<li><b>Первичный ключ (4.2.2.4)</b> — потенциальный ключ, выбранный для уникальной идентификации кортежей внутри отношения. Принципы выбора: семантический (атрибуты ПК не должны содержать NULL) и эффективности (минимум атрибутов и суммарной длины).</li>
<li><b>Альтернативные ключи</b> — потенциальные ключи, не выбранные в качестве первичного.</li>
<li><b>Суррогатный ключ (4.2.2.5)</b> — искусственный атрибут, не имеющий связей с естественными характеристиками ПрО, вводимый исключительно для организации связей кортежей этого отношения с кортежами других; значения генерирует СУБД. Преимущества: единообразие, компактность, отсутствие потребности в изменениях, затрагивающих много отношений.</li>
<li><b>Внешний ключ (4.2.2.6)</b> — атрибут или множество атрибутов внутри отношения, который соответствует потенциальному (как правило, первичному) ключу некоторого (может быть, того же самого) отношения и является его подмножеством. Используется правило равенства; уникальность в целевом отношении гарантирует функциональность соответствующего отображения.</li></ul>`],
["Назовите основные компоненты команды SQL CREATE TABLE.",`<ul>
<li><b>Имя таблицы</b> (и при необходимости имя схемы).</li>
<li><b>Список столбцов</b> с указанием <b>типа данных</b> (CHAR, VARCHAR2, NCHAR, NVARCHAR2, NUMBER, LONG, LONG RAW, RAW, DATE, BLOB, CLOB, NCLOB, BFILE, ROWID, UROWID) и при необходимости значения по умолчанию.</li>
<li><b>inline_constraint</b> — ограничения целостности на уровне столбца: NOT NULL/NULL, UNIQUE, PRIMARY KEY, CHECK, references_clause; может содержать имя одного столбца.</li>
<li><b>out_of_line_constraint</b> — ограничения на уровне таблицы; позволяют использовать группы столбцов.</li>
<li><b>constraint_name</b> — уникальное имя ограничения (если опущено, используется системное).</li>
<li><b>references_clause</b> — ограничение ссылочной целостности: schema, object (таблица), column (столбцы её ключа) и конструкция <b>ON DELETE</b> (по умолчанию удаление запрещено; CASCADE; SET NULL).</li></ul>`],
["Что такое триггеры и для чего они предназначены?",`<p><b>Определение 4.2.2.7.</b> Триггер — программа на языке программирования сервера (для Oracle — PL/SQL), которая автоматически выполняется СУБД в момент наступления определённого события. Он подобен процедуре PL/SQL (именованный блок с разделами объявления, выполнения и обработки исключительных ситуаций), но выполняется <b>неявно</b> при каждом возникновении триггерного события и <b>не имеет параметров</b>. Приведение в действие называют запуском (firing) или активизацией. Триггеры базируются на модели <b>«событие-условие-действие» (ECA)</b>.</p>
<p><b>Предназначены для:</b> проверки правильности введённых данных и сложных ОЦ, которые трудно или невозможно поддерживать декларативно; осуществления косвенных модификаций данных (например, при денормализации схемы); выдачи предупреждений (например, по электронной почте); накопления информации <b>аудита</b> — сведений о внесённых изменениях и о тех, кто их выполнил.</p>
<p><b>События:</b> INSERT, UPDATE, DELETE к таблице или представлению; CREATE, ALTER, DROP к любому объекту схемы; запуск БД или останов экземпляра; регистрация пользователя или выход; конкретное или любое сообщение об ошибке. <b>Типы:</b> строковые (FOR EACH ROW), операторные и INSTEAD OF (для модификации представлений).</p>`],
["Назовите основные компоненты команды SQL CREATE TRIGGER.",`<ul>
<li><b>schema</b> — имя схемы, в которой создаётся триггер (по умолчанию — схема текущего пользователя); <b>trigger</b> — имя триггера.</li>
<li><b>Время выполнения:</b> <b>BEFORE</b> (до основного действия; нельзя для представлений; в теле можно изменять NEW-значения и нельзя OLD), <b>AFTER</b> (после; нельзя для представлений; нельзя изменять ни NEW, ни OLD), <b>INSTEAD OF</b> (вместо основного действия; только для модификации данных представлений; значения можно читать, но не изменять).</li>
<li><b>dml_event_clause</b> — грамматика триггеров для команд ЯМД (INSERT, DELETE, UPDATE [OF столбцы] ON таблица); <b>ddl_event</b> — для команд ЯОД; <b>database_event</b> — для системных событий.</li>
<li><b>REFERENCING / :NEW и :OLD</b> — ссылки на новое и старое значения столбца.</li>
<li><b>FOR EACH ROW</b> — триггер на уровне строки (без неё — на уровне оператора).</li>
<li><b>WHEN (condition)</b> — дополнительное условие, при истинности которого триггер выполняется.</li>
<li><b>Тело триггера</b> — блок PL/SQL.</li></ul>
<p>Замечание: можно создать несколько триггеров одного типа на одно и то же событие, но <b>порядок их выполнения не определён</b>; если порядок важен, следует скомпоновать их в один триггер.</p>`],
["Каковы основные особенности навигационного стиля манипулирования реляционными данными?",`<p>Навигационный стиль используется <b>исключительно в программных интерфейсах</b> с реляционными СУБД. Все интерфейсы строятся по одному принципу:</p>
<ol><li>СУБД передаётся <b>спецификационный</b> запрос на выборку данных, которому в общем случае удовлетворяет несколько строк;</li>
<li>в памяти программы отводится место для размещения читаемых из текущей строки значений;</li>
<li>операторами цикла языка программирования организуется <b>построчное сканирование</b> результирующей выборки с чтением и обработкой данных одной строки;</li>
<li>должна быть предусмотрена возможность <b>параллельного независимого сканирования</b> одной и той же или различных таблиц.</li></ol>
<p>По такому принципу строятся интерфейсы прикладных программ с сервером БД с участием специализированных или универсальных драйверов (ODBC, OLE DB, ADO); отличия заключаются лишь в терминологии и способах представления встроенных инструментов. В Oracle такой навигационный язык реализован <b>аппаратом курсоров PL/SQL</b>, который добавляет к спецификационным командам SQL возможность построчного сканирования результирующих таблиц.</p>`],
["Назовите команды аппарата курсоров языка PL/SQL. Опишите схему использования курсоров.",`<p><b>Команды:</b></p>
<ul><li><code>CURSOR cursor_name [(parameter[, parameter]…)] [RETURN return_type] IS select_statement;</code> — объявление курсора в области DECLARE. Обязательны имя курсора и связанная с ним команда SELECT; необязательные элементы — параметры и возвращаемый тип.</li>
<li><code>OPEN cursor_name [(parameter…)];</code> — открытие: выполняется SELECT, формируется результирующая таблица, указатель курсора устанавливается на её первую строку. При FOR UPDATE в SELECT все строки результата блокируются. Чтения не производится.</li>
<li><code>FETCH cursor_name [BULK COLLECT] INTO var_name[, var_name]…;</code> — чтение данных текущей строки в переменные (совместимые по типу, в точном соответствии с целевым списком SELECT) и перемещение указателя на следующую строку. BULK COLLECT читает все столбцы целиком в коллекции.</li>
<li><code>CLOSE cursor_name;</code> — закрытие: результирующая таблица и указатель становятся недоступны. Повторное открытие возможно, но неизменность результата не гарантирована.</li></ul>
<p><b>Два типа курсоров:</b> неявные (организуются системой для команд SQL, работающих с одной строкой) и явные (необходимы для запросов, возвращающих несколько строк).</p>
<p><b>Четыре атрибута</b> (синтаксис «имя курсора»«атрибут»): <b>%ISOPEN</b> — TRUE, если курсор открыт; <b>%FOUND</b> — NULL перед первым FETCH, TRUE после успешного, FALSE если строка не выдана; <b>%NOTFOUND</b> — противоположно %FOUND; <b>%ROWCOUNT</b> — число строк, прочитанных после открытия (0 сразу после OPEN). До открытия и после закрытия обращение к %FOUND, %NOTFOUND, %ROWCOUNT вызывает исключительную ситуацию <b>INVALID_CURSOR</b>.</p>
<p><b>Схема использования:</b> объявить курсор и переменные (типы удобно задавать конструкцией <code>%TYPE</code> по столбцу таблицы) → OPEN → цикл LOOP с FETCH … INTO и EXIT WHEN cursor%NOTFOUND (обработка одной записи внутри цикла) → END LOOP → CLOSE.</p>`]
]}
];
/* ================= state ================= */
const KEY="bdtrainer_v1";
let S={xp:0,streak:0,last:null,mods:{},review:[]};
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function M(id){if(!S.mods[id])S.mods[id]={quiz:0,cards:{},exam:{},read:0};return S.mods[id];}
function today(){return new Date().toISOString().slice(0,10);}
function touchStreak(){
  const t=today();
  if(S.last===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak=(S.last===y)?(S.streak+1):1;
  S.last=t;save();
}
function addXp(n){S.xp+=n;save();paintTop();}
function paintTop(){
  document.getElementById("sXp").textContent=S.xp;
  document.getElementById("sStreak").textContent=S.streak;
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800);}

/* ================= helpers ================= */
const $=(s)=>document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9%#*○/+\- ]/gi,"").replace(/\s+/g," ").trim();}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function modProgress(m){
  const st=M(m.id);
  const q=Math.min(1,(st.quiz||0)/100);
  const c=m.cards.length?Object.values(st.cards).filter(v=>v===1).length/m.cards.length:1;
  const e=m.exam.length?Object.values(st.exam).filter(v=>v===1).length/m.exam.length:1;
  return Math.round((q*0.4+c*0.25+e*0.35)*100);
}
function totalProgress(){
  let s=0;DATA.forEach(m=>s+=modProgress(m));return Math.round(s/DATA.length);
}

/* ================= navigation ================= */
let CUR=null,TAB="theory";
function go(v,arg){
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".bb").forEach(b=>b.classList.toggle("on",b.dataset.nav===v));
  const el=document.getElementById("v-"+v);if(el)el.classList.add("on");
  window.scrollTo({top:0,behavior:"instant"});
  if(v==="home")renderHome();
  if(v==="review")renderReview();
  if(v==="stats")renderStats();
}
window.go=go;

/* ================= home ================= */
function renderHome(){
  const p=totalProgress();
  let h=`<div class="hero">
    <h1>Базы данных наизусть 🎓</h1>
    <p>Теория, тренировка и дословные ответы на вопросы к коллоквиуму — по всем главам пособия.</p>
    <div class="herorow">
      <span class="chip">Пройдено: ${p}%</span>
      <span class="chip">🔥 Серия: ${S.streak}</span>
      <span class="chip">⭐ ${S.xp} XP</span>
      <span class="chip">📌 На повторение: ${S.review.length}</span>
    </div>
  </div>`;
  let tag="";
  DATA.forEach(m=>{
    if(m.tag!==tag){tag=m.tag;h+=`<div class="sect-title">${tag}</div>`;}
    const pr=modProgress(m);
    h+=`<button class="node" onclick="openLesson('${m.id}')">
      <span class="av">${m.icon}</span>
      <span style="flex:1;min-width:0">
        <span class="tt">${m.num}. ${m.title}</span><br>
        <span class="sub">${m.theory.length} блоков теории · ${m.cards.length} карточек · ${m.quiz.length} заданий · ${m.exam.length} вопросов к коллоквиуму</span>
        <span class="bar"><i style="width:${pr}%"></i></span>
      </span>
      <span class="pc">${pr}%</span>
    </button>`;
  });
  $("#v-home").innerHTML=h;
}

/* ================= lesson ================= */
function openLesson(id,tab){
  CUR=DATA.find(m=>m.id===id);TAB=tab||"theory";
  touchStreak();paintTop();
  go("lesson");renderLesson();
}
window.openLesson=openLesson;

function renderLesson(){
  const m=CUR;
  let h=`<button class="btn ghost" style="margin-bottom:12px" onclick="go('home')">← К курсу</button>
  <h1>${m.num}. ${m.title}</h1>
  <div class="tabs">
    <button class="tab ${TAB==="theory"?"on":""}" onclick="setTab('theory')">📖 Теория</button>
    <button class="tab ${TAB==="cards"?"on":""}" onclick="setTab('cards')">🃏 Карточки</button>
    <button class="tab ${TAB==="quiz"?"on":""}" onclick="setTab('quiz')">🎯 Тренировка</button>
    <button class="tab ${TAB==="exam"?"on":""}" onclick="setTab('exam')">🎓 Коллоквиум</button>
  </div><div id="tabbody"></div>`;
  $("#v-lesson").innerHTML=h;
  if(TAB==="theory")renderTheory();
  if(TAB==="cards")renderCards();
  if(TAB==="quiz")startQuiz(m.quiz,m.id);
  if(TAB==="exam")renderExam();
}
function setTab(t){TAB=t;renderLesson();window.scrollTo({top:0});}
window.setTab=setTab;

/* -------- theory -------- */
function renderTheory(){
  const m=CUR;
  let h="";
  m.theory.forEach((t,i)=>{h+=`<div class="tcard"><h3>${i+1}. ${t.h}</h3>${t.html}</div>`;});
  h+=`<div class="row" style="margin:6px 0 10px">
   <button class="btn" onclick="setTab('cards')">Дальше: карточки 🃏</button>
   <button class="btn ghost" onclick="setTab('quiz')">Сразу к тренировке</button></div>`;
  $("#tabbody").innerHTML=h;
  const st=M(m.id);if(!st.read){st.read=1;addXp(5);toast("+5 XP за теорию");save();}
}

/* -------- flashcards -------- */
let fcI=0,fcOrder=[];
function renderCards(){
  const m=CUR;
  fcOrder=m.cards.map((_,i)=>i);
  const st=M(m.id);
  const unknown=fcOrder.filter(i=>st.cards[i]!==1);
  fcOrder=unknown.length?shuffle(unknown).concat(fcOrder.filter(i=>st.cards[i]===1)):shuffle(fcOrder);
  fcI=0;paintCard();
}
function paintCard(){
  const m=CUR,st=M(m.id);
  if(fcI>=fcOrder.length){
    const known=Object.values(st.cards).filter(v=>v===1).length;
    $("#tabbody").innerHTML=`<div class="tcard result"><div class="big">🃏</div>
      <h2>Колода пройдена</h2>
      <p class="muted">Выучено ${known} из ${m.cards.length} карточек</p>
      <div class="row" style="justify-content:center"><button class="btn" onclick="renderCards()">Ещё раз</button>
      <button class="btn ghost" onclick="setTab('quiz')">К тренировке 🎯</button></div></div>`;
    return;
  }
  const i=fcOrder[fcI],c=m.cards[i];
  $("#tabbody").innerHTML=`
   <div class="muted small" style="margin-bottom:8px">Карточка ${fcI+1} из ${fcOrder.length} · нажми на карточку, чтобы перевернуть</div>
   <div class="fcwrap"><div class="fc" id="fc" onclick="this.classList.toggle('flip')">
     <div class="side front"><div class="q">${c[0]}</div></div>
     <div class="side back"><div class="a">${c[1]}</div></div>
   </div></div>
   <div class="row" style="margin-top:14px">
     <button class="btn grey" style="flex:1" onclick="markCard(0)">Повторить 🔁</button>
     <button class="btn" style="flex:1" onclick="markCard(1)">Знаю ✓</button>
   </div>`;
}
function markCard(v){
  const m=CUR,st=M(m.id),i=fcOrder[fcI];
  st.cards[i]=v;save();
  if(v===1)addXp(2);
  fcI++;paintCard();
}
window.markCard=markCard;window.renderCards=renderCards;

/* -------- exam (вопросы к параграфу) -------- */
function renderExam(){
  const m=CUR,st=M(m.id);
  let h=`<div class="tip">Эти вопросы и задания приведены в пособии после параграфа — их нужно знать дословно. Сначала ответь про себя, потом раскрой эталонный ответ и честно отметь результат.</div>`;
  m.exam.forEach((q,i)=>{
    const mk=st.exam[i];
    h+=`<div class="exq ${mk===1?"known":mk===0?"unknown":""}" id="ex${i}">
      <div class="qq" onclick="document.getElementById('ex${i}').classList.toggle('open')">
        <span class="num">${i+1}</span><span>${q[0]}</span></div>
      <div class="aa">${q[1]}
        <div class="mk">
          <button class="mini ${mk===1?"ok":""}" onclick="event.stopPropagation();markExam(${i},1)">Знаю ✓</button>
          <button class="mini ${mk===0?"no":""}" onclick="event.stopPropagation();markExam(${i},0)">Повторить 🔁</button>
        </div>
      </div></div>`;
  });
  const kn=Object.values(st.exam).filter(v=>v===1).length;
  h+=`<div class="tcard center"><b>Выучено ${kn} из ${m.exam.length}</b><br>
  <button class="btn" style="margin-top:10px" onclick="go('home')">К списку тем</button></div>`;
  $("#tabbody").innerHTML=h;
}
function markExam(i,v){
  const st=M(CUR.id);st.exam[i]=v;save();
  if(v===1)addXp(3);
  const el=document.getElementById("ex"+i);
  el.classList.toggle("known",v===1);el.classList.toggle("unknown",v===0);
  el.querySelectorAll(".mini").forEach((b,k)=>{b.classList.toggle("ok",v===1&&k===0);b.classList.toggle("no",v===0&&k===1);});
}
window.markExam=markExam;

/* ================= QUIZ ENGINE ================= */
let Q={list:[],i:0,hearts:5,right:0,mid:null,target:null,answered:false,state:null};
function startQuiz(list,mid,target){
  Q={list:shuffle(list),i:0,hearts:5,right:0,mid:mid,target:target||"#tabbody",answered:false,state:null};
  if(!Q.list.length){document.querySelector(Q.target).innerHTML='<div class="tcard center">Пока нечего повторять 🎉</div>';return;}
  paintQ();
}
function qhead(){
  const pct=Math.round(Q.i/Q.list.length*100);
  return `<div class="qhead"><button class="iconbtn" onclick="quitQuiz()">✕</button>
   <span class="qbar"><i style="width:${pct}%"></i></span>
   <span class="hearts">${"❤️".repeat(Q.hearts)}${"🤍".repeat(Math.max(0,5-Q.hearts))}</span></div>`;
}
function quitQuiz(){ if(Q.target==="#reviewbody")go("home"); else setTab("theory"); }
window.quitQuiz=quitQuiz;

function paintQ(){
  const q=Q.list[Q.i];Q.answered=false;Q.state=null;
  let body="",labels={choice:"Выбери ответ",multi:"Выбери все верные",fill:"Заполни пропуски",match:"Сопоставь пары",order:"Расставь по порядку",type:"Впиши ответ"};
  if(q.t==="choice"||q.t==="multi"){
    body=q.opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="pick(${i})">${o}</button>`).join("");
  }
  if(q.t==="fill"){
    let n=-1;
    const txt=q.text.replace(/___/g,()=>{n++;return `<span class="slot" data-s="${n}" onclick="clearSlot(${n})">…</span>`;});
    Q.state={slots:new Array(q.answers.length).fill(null)};
    body=`<div class="blanks">${txt}</div><div class="bank">`+
      shuffle(q.bank).map((w,i)=>`<button class="word" data-w="${esc(w)}" onclick="putWord(this)">${w}</button>`).join("")+`</div>`;
  }
  if(q.t==="match"){
    const L=q.pairs.map(p=>p[0]),R=shuffle(q.pairs.map(p=>p[1]));
    Q.state={pick:null,done:0};
    body=`<div class="pairs"><div>`+L.map(l=>`<button class="word" data-l="${esc(l)}" onclick="mPick(this,'L')">${l}</button>`).join("")+
    `</div><div>`+R.map(r=>`<button class="word" data-r="${esc(r)}" onclick="mPick(this,'R')">${r}</button>`).join("")+`</div></div>`;
  }
  if(q.t==="order"){
    Q.state={items:shuffle(q.items)};
    body=`<ul class="ord" id="ordlist">`+Q.state.items.map((t,i)=>ordRow(t,i)).join("")+`</ul>`;
  }
  if(q.t==="type"){
    body=`<input class="txt" id="tin" autocomplete="off" placeholder="Твой ответ…" onkeydown="if(event.key==='Enter')checkQ()">`;
  }
  document.querySelector(Q.target).innerHTML=qhead()+`<div class="qbox">
    <div class="qtype">${labels[q.t]}</div>
    <div class="qtext">${q.q}</div>
    <div id="qbody">${body}</div>
    <div class="row" style="margin-top:14px"><button class="btn wide" id="checkBtn" onclick="checkQ()">Проверить</button></div>
    <div class="feed" id="feed"></div>
  </div>`;
  if(q.t==="type")setTimeout(()=>{const e=document.getElementById("tin");if(e)e.focus();},80);
}
function ordRow(t,i){
  return `<li data-t="${esc(t)}"><span class="n">${i+1}</span><span>${t}</span>
   <span class="mv"><button class="mvb" onclick="mv(${i},-1)">↑</button><button class="mvb" onclick="mv(${i},1)">↓</button></span></li>`;
}
function mv(i,d){
  if(Q.answered)return;
  const a=Q.state.items,j=i+d;if(j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];
  document.getElementById("ordlist").innerHTML=a.map((t,k)=>ordRow(t,k)).join("");
}
window.mv=mv;

function pick(i){
  if(Q.answered)return;
  const q=Q.list[Q.i],btns=document.querySelectorAll("#qbody .opt");
  if(q.t==="choice"){btns.forEach(b=>b.classList.remove("sel"));btns[i].classList.add("sel");}
  else btns[i].classList.toggle("sel");
}
window.pick=pick;

function putWord(el){
  if(Q.answered)return;
  const s=Q.state.slots.indexOf(null);if(s<0)return;
  Q.state.slots[s]=el.dataset.w;el.classList.add("used");
  const sl=document.querySelector('.slot[data-s="'+s+'"]');
  sl.textContent=el.dataset.w;sl.classList.add("filled");sl.dataset.word=el.dataset.w;
}
window.putWord=putWord;
function clearSlot(i){
  if(Q.answered)return;
  const w=Q.state.slots[i];if(!w)return;
  Q.state.slots[i]=null;
  const sl=document.querySelector('.slot[data-s="'+i+'"]');sl.textContent="…";sl.classList.remove("filled");
  const b=[...document.querySelectorAll(".bank .word")].find(x=>x.dataset.w===w&&x.classList.contains("used"));
  if(b)b.classList.remove("used");
}
window.clearSlot=clearSlot;

function mPick(el,side){
  if(Q.answered)return;
  const q=Q.list[Q.i];
  if(side==="L"){
    document.querySelectorAll('[data-l]').forEach(x=>x.classList.remove("pick"));
    el.classList.add("pick");Q.state.pick=el;return;
  }
  const L=Q.state.pick;if(!L)return;
  const ok=q.pairs.some(p=>p[0]===L.dataset.l&&p[1]===el.dataset.r);
  if(ok){L.classList.remove("pick");L.classList.add("matched");el.classList.add("matched");Q.state.done++;Q.state.pick=null;}
  else{el.classList.add("bad");setTimeout(()=>el.classList.remove("bad"),400);Q.state.wrong=true;}
}
window.mPick=mPick;

function checkQ(){
  if(Q.answered){next();return;}
  const q=Q.list[Q.i];let ok=false,expl=q.why||"";
  if(q.t==="choice"){
    const sel=[...document.querySelectorAll("#qbody .opt")].findIndex(b=>b.classList.contains("sel"));
    if(sel<0){toast("Выбери вариант");return;}
    ok=sel===q.a;
    document.querySelectorAll("#qbody .opt").forEach((b,i)=>{
      b.classList.remove("sel");
      if(i===q.a)b.classList.add("ok"); else if(i===sel)b.classList.add("bad");});
  }
  if(q.t==="multi"){
    const sel=[...document.querySelectorAll("#qbody .opt")].map((b,i)=>b.classList.contains("sel")?i:-1).filter(i=>i>=0);
    if(!sel.length){toast("Выбери хотя бы один вариант");return;}
    ok=sel.length===q.a.length&&sel.every(i=>q.a.includes(i));
    document.querySelectorAll("#qbody .opt").forEach((b,i)=>{
      b.classList.remove("sel");
      if(q.a.includes(i))b.classList.add("ok"); else if(sel.includes(i))b.classList.add("bad");});
  }
  if(q.t==="fill"){
    if(Q.state.slots.some(x=>x===null)){toast("Заполни все пропуски");return;}
    ok=Q.state.slots.every((w,i)=>norm(w)===norm(q.answers[i]));
    expl="Правильно: "+q.answers.join(" · ")+(q.why?" — "+q.why:"");
  }
  if(q.t==="match"){
    if(Q.state.done<q.pairs.length){toast("Сопоставь все пары");return;}
    ok=!Q.state.wrong;
    expl=ok?"Все пары верны.":"Пары собраны, но были ошибки — повторим позже.";
  }
  if(q.t==="order"){
    ok=Q.state.items.every((t,i)=>t===q.items[i]);
    expl="Верный порядок: "+q.items.map((t,i)=>(i+1)+") "+t).join("; ");
  }
  if(q.t==="type"){
    const v=norm(document.getElementById("tin").value);
    if(!v){toast("Впиши ответ");return;}
    ok=(q.alts||[q.a]).some(a=>norm(a)===v||v.includes(norm(a))&&norm(a).length>3);
    expl="Ответ: "+q.a+(q.why?" — "+q.why:"");
  }
  Q.answered=true;
  if(ok){Q.right++;addXp(4);}
  else{
    Q.hearts--;
    if(Q.mid){
      const key=Q.mid+"|"+Q.list[Q.i].q;
      if(!S.review.some(r=>r.k===key)){S.review.push({k:key,mid:Q.mid,q:Q.list[Q.i].q});save();}
    }
  }
  const f=document.getElementById("feed");
  f.className="feed on "+(ok?"good":"bad");
  f.innerHTML=(ok?"✓ Верно!":"✗ Не совсем")+(expl?`<div class="ex">${expl}</div>`:"");
  const b=document.getElementById("checkBtn");b.textContent=Q.i+1<Q.list.length?"Дальше →":"Завершить";
  if(Q.hearts<=0){setTimeout(finishQuiz,900);}
}
window.checkQ=checkQ;
function next(){
  Q.i++;
  if(Q.i>=Q.list.length){finishQuiz();return;}
  paintQ();
}
function finishQuiz(){
  const pct=Math.round(Q.right/Q.list.length*100);
  if(Q.mid){const st=M(Q.mid);if(pct>(st.quiz||0))st.quiz=pct;save();}
  if(Q.target==="#reviewbody"&&Q.right>0){
    // убираем отработанное
    S.review=S.review.filter(r=>!Q.list.some(q=>q.q===r.q&&Q.rightSet&&Q.rightSet.has(q.q)));
    save();
  }
  const em=pct>=90?"🏆":pct>=70?"🎉":pct>=50?"💪":"📚";
  document.querySelector(Q.target).innerHTML=`<div class="tcard result">
    <div class="big">${em}</div>
    <div class="ring" style="background:conic-gradient(var(--brand) ${pct*3.6}deg, var(--line) 0)">
      <span style="background:var(--card);width:100px;height:100px;border-radius:50%;display:grid;place-items:center">${pct}%</span></div>
    <h2>${Q.right} из ${Q.list.length} верно</h2>
    <p class="muted">${pct>=80?"Отлично! Материал держится в голове.":"Ошибки добавлены в раздел «Повторение» — прогоняй их регулярно."}</p>
    <div class="row" style="justify-content:center;margin-top:8px">
      <button class="btn" onclick="${Q.target==="#reviewbody"?"go('review')":"setTab('quiz')"}">Ещё раз</button>
      <button class="btn ghost" onclick="${Q.target==="#reviewbody"?"go('home')":"setTab('exam')"}">${Q.target==="#reviewbody"?"К курсу":"К вопросам коллоквиума"}</button>
    </div></div>`;
  addXp(pct>=80?15:5);
}

/* ================= review ================= */
function renderReview(){
  let list=[];
  S.review.forEach(r=>{
    const m=DATA.find(x=>x.id===r.mid);if(!m)return;
    const q=m.quiz.find(q=>q.q===r.q);if(q)list.push(q);
  });
  // добавим карточки и вопросы, отмеченные "повторить"
  let weakCards=[],weakExam=[];
  DATA.forEach(m=>{const st=M(m.id);
    Object.keys(st.cards).forEach(k=>{if(st.cards[k]===0)weakCards.push([m,+k]);});
    Object.keys(st.exam).forEach(k=>{if(st.exam[k]===0)weakExam.push([m,+k]);});
  });
  let h=`<h1>🔁 Повторение</h1>
  <div class="tcard"><b>Ошибки в тренировках: ${list.length}</b><br>
  <span class="muted small">Сюда автоматически попадают задания, в которых ты ошиблась.</span>
  <div class="row" style="margin-top:12px">
    <button class="btn" ${list.length?"":"disabled"} onclick="startReview()">Прогнать ошибки</button>
    <button class="btn ghost" onclick="mixAll()">Большой микс по всему курсу</button>
  </div></div>`;
  if(weakCards.length){
    h+=`<div class="sect-title">Карточки «повторить» (${weakCards.length})</div>`;
    weakCards.slice(0,40).forEach(([m,i])=>{
      h+=`<div class="tcard"><b>${m.cards[i][0]}</b><div class="small muted" style="margin-top:6px">${m.cards[i][1]}</div>
      <div class="small" style="margin-top:6px;color:var(--ink2)">${m.num} ${m.title}</div></div>`;
    });
  }
  if(weakExam.length){
    h+=`<div class="sect-title">Вопросы коллоквиума «повторить» (${weakExam.length})</div>`;
    weakExam.slice(0,40).forEach(([m,i])=>{
      h+=`<div class="exq"><div class="qq" onclick="this.parentNode.classList.toggle('open')">
      <span class="num">${i+1}</span><span>${m.exam[i][0]}<br><span class="small muted">${m.num} ${m.title}</span></span></div>
      <div class="aa">${m.exam[i][1]}</div></div>`;
    });
  }
  h+=`<div id="reviewbody"></div>`;
  $("#v-review").innerHTML=h;
}
function startReview(){
  let list=[];
  S.review.forEach(r=>{const m=DATA.find(x=>x.id===r.mid);if(!m)return;const q=m.quiz.find(q=>q.q===r.q);if(q)list.push(q);});
  $("#v-review").innerHTML=`<h1>🔁 Повторение ошибок</h1><div id="reviewbody"></div>`;
  startQuiz(list,null,"#reviewbody");
}
window.startReview=startReview;
function mixAll(){
  let all=[];DATA.forEach(m=>m.quiz.forEach(q=>all.push(q)));
  all=shuffle(all).slice(0,20);
  $("#v-review").innerHTML=`<h1>🎲 Микс по всему курсу</h1><div id="reviewbody"></div>`;
  startQuiz(all,null,"#reviewbody");
}
window.mixAll=mixAll;

/* ================= stats ================= */
function renderStats(){
  const p=totalProgress();
  let cardsK=0,cardsT=0,examK=0,examT=0;
  DATA.forEach(m=>{const st=M(m.id);
    cardsT+=m.cards.length;cardsK+=Object.values(st.cards).filter(v=>v===1).length;
    examT+=m.exam.length;examK+=Object.values(st.exam).filter(v=>v===1).length;});
  let h=`<h1>📊 Прогресс</h1>
  <div class="tcard center">
    <div class="ring" style="background:conic-gradient(var(--brand) ${p*3.6}deg, var(--line) 0)">
      <span style="background:var(--card);width:100px;height:100px;border-radius:50%;display:grid;place-items:center">${p}%</span></div>
    <b>Курс пройден на ${p}%</b>
    <div class="row" style="justify-content:center;margin-top:10px">
      <span class="stat">⭐ ${S.xp} XP</span><span class="stat">🔥 ${S.streak} дн.</span>
      <span class="stat">🃏 ${cardsK}/${cardsT}</span><span class="stat">🎓 ${examK}/${examT}</span></div>
  </div>`;
  DATA.forEach(m=>{
    const st=M(m.id),pr=modProgress(m);
    h+=`<div class="tcard"><b>${m.num}. ${m.title}</b>
      <div class="small muted">Тренировка: ${st.quiz||0}% · Карточки: ${Object.values(st.cards).filter(v=>v===1).length}/${m.cards.length} · Коллоквиум: ${Object.values(st.exam).filter(v=>v===1).length}/${m.exam.length}</div>
      <span class="bar"><i style="width:${pr}%"></i></span></div>`;
  });
  h+=`<div class="tcard center"><button class="btn red" onclick="resetAll()">Сбросить весь прогресс</button></div>`;
  $("#v-stats").innerHTML=h;
}
function resetAll(){
  if(!confirm("Сбросить весь прогресс, XP и серию?"))return;
  S={xp:0,streak:0,last:null,mods:{},review:[]};save();paintTop();renderStats();toast("Прогресс сброшен");
}
window.resetAll=resetAll;

/* ================= theme ================= */
(function(){
  const b=document.getElementById("themeBtn");
  const st=localStorage.getItem("bdtheme");
  if(st)document.documentElement.setAttribute("data-theme",st);
  b.onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const nx=cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",nx);
    try{localStorage.setItem("bdtheme",nx);}catch(e){}
  };
})();

/* ================= init ================= */
load();touchStreak();paintTop();renderHome();

</script>
</body>
</html>
